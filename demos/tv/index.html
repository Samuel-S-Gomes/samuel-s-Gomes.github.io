}

function Editor({ slides, onSalvar, onSair, salvando, erro }) {
  const [draft, setDraft] = useState(slides);
  const [selecionado, setSelecionado] = useState(() => (slides[0] ? slides[0].id : null));
  const [editandoSlide, setEditandoSlide] = useState(false);
  const [subindo, setSubindo] = useState('');
  const [erroLocal, setErroLocal] = useState('');
  const inputArquivo = useRef(null);

  const sujo = useMemo(() => JSON.stringify(draft) !== JSON.stringify(slides), [draft, slides]);

  // Se o slide selecionado sumir do draft (excluído), cai no primeiro que sobrou.
  useEffect(() => {
    if (!draft.length) { setSelecionado(null); return; }
    if (!draft.some(s => s.id === selecionado)) setSelecionado(draft[0].id);
  }, [draft, selecionado]);

  const idxAtual = draft.findIndex(s => s.id === selecionado);
  const atual = idxAtual >= 0 ? draft[idxAtual] : null;

  /* Autosave: some tempo depois da última mudança (debounce), sem botão. `slides`
     (o que já está salvo) atualiza sozinho quando onSalvar termina — é o que faz
     `sujo` voltar a false e a indicação virar "Salvo". */
  const timerSalvar = useRef(null);
  useEffect(() => {
    if (!sujo) return;
    if (timerSalvar.current) clearTimeout(timerSalvar.current);
    timerSalvar.current = setTimeout(() => onSalvar(draft), 1200);
    return () => clearTimeout(timerSalvar.current);
  }, [draft, sujo, onSalvar]);

  /* Sair não pode deixar as últimas teclas para trás: se o debounce ainda não
     disparou, salva na hora antes de trocar de tela. */
  const flush = useCallback(() => {
    if (timerSalvar.current) { clearTimeout(timerSalvar.current); timerSalvar.current = null; }
    if (sujo) onSalvar(draft);
  }, [draft, sujo, onSalvar]);

  // Avisa antes de fechar a aba com alteração ainda não salva (janela do debounce).
  useEffect(() => {
    if (!sujo) return;
    const onSaida = (e) => { e.preventDefault(); e.returnValue = ''; };
    window.addEventListener('beforeunload', onSaida);
    return () => window.removeEventListener('beforeunload', onSaida);
  }, [sujo]);

  const muda = (id, patch) => setDraft(d => d.map(s => s.id === id ? { ...s, ...patch } : s));
  const move = (id, dir) => setDraft(d => {
    const de = d.findIndex(s => s.id === id), para = de + dir;
    if (de < 0 || para < 0 || para >= d.length) return d;
    const n = d.slice(); [n[de], n[para]] = [n[para], n[de]]; return n;
  });
  // Gráfico é permanente: não sai pelo editor, só oculta (garantido também no PainelEdicao).
  const exclui = (id) => setDraft(d => {
    const alvo = d.find(s => s.id === id);
    if (!alvo || alvo.kind === 'chart') return d;
    return d.filter(s => s.id !== id);
  });

  const novoTexto = () => {
    const s = { id: novoId(), kind: 'text', title: '', body: '', mediaKey: null, mediaType: null, chartId: null, durationMs: 15000, enabled: true };
    setDraft(d => [...d, s]);
    setSelecionado(s.id);
  };

  const subirArquivo = async (file) => {
    if (!file) return;
    setErroLocal('');
    setSubindo(file.name);
    try {
      const pronto = file.type.startsWith('image/') ? await reduzImagem(file) : file;
      /* ★ Quem codifica em base64 é AQUI, o navegador — não o Worker. No plano
         gratuito o Worker tem 10 ms de CPU por requisição e codificar dezenas
         de MB estouraria isso; o backend só repassa o fluxo adiante. O tipo e o
         tamanho vão na query porque o corpo é o arquivo cru em base64, não um
         multipart (o Worker não abre o corpo para não gastar CPU). */
      const base64 = await paraBase64(pronto);
      const r = await fetch(
        `${API_MEDIA}?tipo=${encodeURIComponent(pronto.type)}&bytes=${pronto.size}`,
        { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: base64 },
      );
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || 'Falha no upload.');
      const s = { id: novoId(), kind: 'media', title: '', body: '', mediaKey: j.mediaKey, mediaType: j.mediaType, durationMs: 15000, enabled: true };
      setDraft(d => [...d, s]);
      setSelecionado(s.id);
    } catch (e) {
      setErroLocal(e.message || 'Falha no upload.');
    } finally {
      setSubindo('');
      if (inputArquivo.current) inputArquivo.current.value = '';
    }
  };

  const ocupado = !!subindo || salvando;
  const noAr = draft.filter(s => s.enabled !== false).length;
  const voltaMs = draft.filter(s => s.enabled !== false && !ehVideo(s)).reduce((a, s) => a + s.durationMs, 0);

  return (
    <div style={{ minHeight: '100vh', background: E.bg, color: E.txt }}>
      <header style={{
        position: 'sticky', top: 0, zIndex: 20, background: 'rgba(238,242,247,.94)',
        backdropFilter: 'blur(8px)', borderBottom: `1px solid ${E.line}`, padding: '16px 28px',
        display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap',
      }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 8, height: 30,
          fontFamily: HEADING, fontWeight: 800, fontSize: 20, letterSpacing: '-0.02em', color: '#0072ce',
        }}>
          <span style={{
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            width: 26, height: 26, borderRadius: '50%', background: '#0072ce',
            color: '#fff', fontSize: 15, fontWeight: 800,
          }}>N</span>
          prisma
        </div>
        <div style={{ flex: 1, minWidth: 220 }}>
          <div style={{ fontFamily: HEADING, fontSize: 20, fontWeight: 700, letterSpacing: '-0.02em' }}>Dashboard TV</div>
          <div style={{ fontSize: 13, color: E.muted }}>
            {draft.length} slide{draft.length === 1 ? '' : 's'} · {noAr} no ar
            {voltaMs > 0 && ` · volta do loop em ~${Math.round(voltaMs / 1000)}s (~${Math.round(voltaMs / 60000)}min) (+ os vídeos)`}
          </div>
        </div>

        <input ref={inputArquivo} type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm"
               style={{ display: 'none' }} onChange={e => subirArquivo(e.target.files && e.target.files[0])} />
        <button className="tv-btn" disabled={ocupado} onClick={() => inputArquivo.current && inputArquivo.current.click()} style={btnClaro}>
          {subindo ? <><Loader2 size={16} className="tv-girando" /> Subindo…</> : <><ImagePlus size={16} /> Imagem ou vídeo</>}
        </button>
        <button className="tv-btn" disabled={ocupado} onClick={novoTexto} style={btnClaro}>
          <Type size={16} /> Slide de texto
        </button>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 7, fontSize: 13, fontWeight: 600,
          color: salvando ? C.blue : sujo ? E.muted : '#1a8d5f', padding: '0 4px',
        }}>
          {salvando ? <><Loader2 size={15} className="tv-girando" /> Salvando…</>
            : sujo ? <><Save size={15} /> Alteração pendente…</>
            : <><Save size={15} /> Salvo automaticamente</>}
        </div>
        <button className="tv-btn" onClick={() => { flush(); onSair(atual ? atual.id : null); }} style={btnClaro}>
          <Play size={16} /> Exibir
        </button>
      </header>

      {(erro || erroLocal) && (
        <div style={{ margin: '18px 28px 0', background: '#fdeceb', border: '1px solid #f3b9b4', color: '#a4231b', borderRadius: 10, padding: '12px 16px', display: 'flex', gap: 10, fontSize: 14 }}>
          <AlertTriangle size={18} /> {erro || erroLocal}
        </div>
      )}

      <main style={{ padding: '22px 28px 60px', display: 'grid', gap: 18, maxWidth: 1400, margin: '0 auto' }}>
        {!draft.length && (
          <div style={{ background: E.card, border: `1px dashed ${E.line}`, borderRadius: 12, padding: '54px 24px', textAlign: 'center', color: E.muted }}>
            <Tv size={40} style={{ color: C.blueLight, marginBottom: 16 }} strokeWidth={1.5} />
            <div style={{ fontSize: 16, fontWeight: 600, color: E.txt }}>Painel vazio</div>
            <div style={{ fontSize: 14, marginTop: 6 }}>Suba uma imagem ou vídeo, ou crie um slide de texto.</div>
          </div>
        )}

        {!!atual && (
          <>
            {/* Prévia — o que a TV mostraria de fato, em 85% da largura. */}
            {/* ★★ DUAS CAIXAS, e a razão é sutil: 16/9 vem de `padding-bottom`
                (o `aspect-ratio` não existe no Safari 14, onde a prévia
                colapsava sem altura), e padding em PORCENTAGEM resolve contra a
                largura do BLOCO CONTÊINER, não a do próprio elemento. Com
                `width:85%` e o padding no MESMO elemento, a altura saía de 85%
                da largura do pai contra 56,25% dela — medido: 1190x788, ratio
                1,51 em vez de 1,78. A caixa externa fixa a largura; a interna
                só cria a proporção, e aí o padding resolve contra a largura
                certa. O <Slide> filho já é `position:absolute; top:0,right:0,bottom:0,left:0`. */}
            <div style={{ width: '85%', maxWidth: 1280, margin: '0 auto' }}>
              <div style={{
                height: 0, paddingBottom: '56.25%', position: 'relative', borderRadius: 16,
                overflow: 'hidden', background: C.ink, boxShadow: '0 18px 44px rgba(15,23,42,.28)',
              }}>
                <Slide key={atual.id} slide={atual} pausado={false} onFim={() => {}} onErro={() => {}} onTravou={() => {}} />
              </div>
            </div>

            {/* Mover a posição do slide atual na trilha geral + editar detalhes */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10 }}>
              <button className="tv-btn" title="Mover para trás na trilha" disabled={ocupado || idxAtual <= 0}
                      onClick={() => move(atual.id, -1)} style={{ ...btnClaro, width: 42, height: 42 }}>
                <ChevronLeft size={18} />
              </button>
              <div style={{ fontSize: 13, color: E.muted, fontWeight: 600, minWidth: 110, textAlign: 'center' }}>
                Posição {idxAtual + 1} de {draft.length}
              </div>
              <button className="tv-btn" title="Mover para frente na trilha" disabled={ocupado || idxAtual >= draft.length - 1}
                      onClick={() => move(atual.id, 1)} style={{ ...btnClaro, width: 42, height: 42 }}>
                <ChevronRight size={18} />
              </button>
              <button className="tv-btn" onClick={() => setEditandoSlide(true)}
                      style={{ background: C.blue, color: '#fff', padding: '10px 20px', fontSize: 14, fontWeight: 700, marginLeft: 12 }}>
                <Pencil size={16} /> Editar slide
              </button>
            </div>

            {/* Trilha geral — a ordem aqui é a ordem do loop na TV. */}
            <div style={{ display: 'flex', gap: 10, overflowX: 'auto', padding: '4px 2px 10px' }}>
              {draft.map((s, k) => (
                <ItemTrilha key={s.id} slide={s} n={k + 1} ativo={s.id === atual.id} onSelecionar={() => setSelecionado(s.id)} />
              ))}
            </div>
          </>
        )}
      </main>

      {editandoSlide && atual && (
        <PainelEdicao
          slide={atual}
          onMuda={patch => muda(atual.id, patch)}
          onExclui={() => { exclui(atual.id); setEditandoSlide(false); }}
          onFechar={() => setEditandoSlide(false)}
        />
      )}
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [slides, setSlides] = useState(null);
  const [podeEditar, setPodeEditar] = useState(false);
  const [editando, setEditando] = useState(false);
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState('');
  const [erroCarga, setErroCarga] = useState('');
  const [slideInicialId, setSlideInicialId] = useState(null);

  const carrega = useCallback(async () => {
    const r = await fetch(API_DECK, { headers: { 'Cache-Control': 'no-cache' } });
    if (!r.ok) throw new Error(r.status === 403 ? 'Sem acesso ao painel.' : 'Falha ao carregar o painel.');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Falha ao carregar o painel.');
    return j;
  }, []);

  useEffect(() => {
    let vivo = true;
    carrega()
      .then(j => { if (!vivo) return; setSlides(garantirGraficosPermanentes(j.slides)); setPodeEditar(!!j.canEdit); setErroCarga(''); })
      .catch(e => { if (vivo) setErroCarga(e.message); });
    return () => { vivo = false; };
  }, [carrega]);

  /* Recarga periódica: é assim que uma edição do gestor chega à TV, que ninguém
     recarrega à mão. Fica parada enquanto o editor está aberto — senão o deck
     remoto atropelaria o rascunho de quem está digitando. Falha de rede aqui é
     ignorada de propósito: a TV segue exibindo o que já tem. */
  useEffect(() => {
    if (editando) return;
    const t = setInterval(() => {
      carrega()
        .then(j => setSlides(prev => {
          const novo = garantirGraficosPermanentes(j.slides);
          return JSON.stringify(prev) === JSON.stringify(novo) ? prev : novo;
        }))
        .catch(() => {});
    }, RECARGA_MS);
    return () => clearInterval(t);
  }, [editando, carrega]);

  const salva = useCallback(async (draft) => {
    setSalvando(true); setErro('');
    try {
      const r = await fetch(API_DECK, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slides: draft }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || 'Não foi possível salvar.');
      setSlides(garantirGraficosPermanentes(j.slides));
    } catch (e) {
      setErro(e.message || 'Não foi possível salvar.');
    } finally {
      setSalvando(false);
    }
  }, []);

  // Autosave: ao sair, o Editor já garantiu (via flush) que não fica nada pendente.
  // `slideId` (do botão "Exibir" com um slide selecionado no editor) pula a
  // exibição direto pra ele — sem isso o caminho até revisar 1 slide era abrir
  // Apresentação do zero e rolar a trilha inteira até achar o certo.
  const sai = useCallback((slideId) => {
    setErro('');
    setEditando(false);
    setSlideInicialId(slideId || null);
  }, []);

  if (erroCarga) {
    return (
      <div style={{ position: 'fixed', top: 0, right: 0, bottom: 0, left: 0, background: C.ink, color: C.text, display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: 40 }}>
        <div>
          <AlertTriangle size={52} style={{ color: C.amber, marginBottom: 20 }} />
          <div style={{ fontFamily: HEADING, fontSize: 28, fontWeight: 700 }}>{erroCarga}</div>
          <button className="tv-btn" onClick={() => location.reload()} style={{ marginTop: 24, padding: '12px 20px', background: C.blue }}>
            Tentar de novo
          </button>
        </div>
      </div>
    );
  }

  if (slides === null) {
    return (
      <div style={{ position: 'fixed', top: 0, right: 0, bottom: 0, left: 0, background: C.ink, color: C.faint, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>
        Carregando o painel…
      </div>
    );
  }

  if (editando) {
    return <Editor slides={slides} onSalvar={salva} onSair={sai} salvando={salvando} erro={erro} />;
  }
  return (
    <Exibicao
      slides={slides} podeEditar={podeEditar} onEditar={() => setEditando(true)}
      slideInicialId={slideInicialId}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
