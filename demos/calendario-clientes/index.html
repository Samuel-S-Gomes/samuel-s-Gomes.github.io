  }
  function closeScope(){ $("#scopebg").classList.remove("open"); scopeItem=null; }
  async function saveScope(clearAll){
    if(!scopeItem) return;
    var ids=[];
    if(!clearAll){ document.querySelectorAll("#scope-list input:checked").forEach(function(c){ ids.push(Number(c.value)); }); }
    try{
      await api("/opcoes/"+scopeItem.id,{method:"PATCH",body:JSON.stringify({clientes:ids})});
      closeScope(); await refreshListas(); toast("Escopo atualizado");
    }catch(e){ toast(e.message,true); }
  }
  function itemPath(id){ return listaTab==="clientes" ? ("/clientes/"+(id||"")) : ("/opcoes/"+(id||"")); }
  function createPath(){ var t=curTabDef(); return t.cat?("/opcoes/"+t.cat):"/clientes"; }
  async function addItem(){
    var nome=$("#listas-input").value.trim(); if(!nome) return;
    try{ await api(createPath(),{method:"POST",body:JSON.stringify({nome:nome})}); $("#listas-input").value="";
      await refreshListas(); toast("Adicionado"); }catch(e){ toast(e.message,true); }
  }
  async function renameItem(o){
    var nome=prompt("Novo nome:", o.nome); if(nome===null) return; nome=nome.trim(); if(!nome) return;
    try{ await api(itemPath(o.id),{method:"PATCH",body:JSON.stringify({nome:nome})}); await refreshListas(); }
    catch(e){ toast(e.message,true); }
  }
  async function toggleItem(o){
    try{ await api(itemPath(o.id),{method:"PATCH",body:JSON.stringify({ativo:o.ativo===false})}); await refreshListas(); }
    catch(e){ toast(e.message,true); }
  }
  async function deleteItem(o){
    if(!confirm('Excluir "'+o.nome+'"?')) return;
    try{ await api(itemPath(o.id),{method:"DELETE"}); await refreshListas(); toast("Excluído"); }
    catch(e){ toast(e.message,true); }
  }
  async function refreshListas(){ await loadListas(); populateFilters(); renderListaItems(); await loadPosts(); render(); }

  // ---- eventos ----
  function bind(){
    // agSoltarPeriodo(): navegar de mês contradiz um período aplicado pela
    // Agenda ("em julho" e depois clicar ›). As outras dimensões continuam.
    $("#prev").onclick=async function(){ agSoltarPeriodo(); view.setMonth(view.getMonth()-1); await loadPosts(); render(); };
    $("#next").onclick=async function(){ agSoltarPeriodo(); view.setMonth(view.getMonth()+1); await loadPosts(); render(); };
    $("#hoje").onclick=async function(){ agSoltarPeriodo(); view=new Date(); view.setDate(1); await loadPosts(); render(); };
    $("#fFds").onchange=function(){ showFds=$("#fFds").checked; render(); };
    $("#btnNovo").onclick=function(){ openPost(null); };
    $("#btnListas").onclick=openListas;
    $("#modal-close").onclick=closePost; $("#modal-cancel").onclick=closePost;
    $("#modal-save").onclick=savePost; $("#modal-del").onclick=delPost;
    // Trocar o cliente no modal re-filtra Pilar/Público/Objetivo, preservando o
    // que já estava escolhido (se a opção continuar válida para o novo cliente).
    $("#m-cliente").onchange=function(){
      var cur={pilar:$("#m-pilar").value, publico:$("#m-publico").value, objetivo:$("#m-objetivo").value};
      refreshOptSelects(Number($("#m-cliente").value),
        {pilar:Number(cur.pilar)||0, publico:Number(cur.publico)||0, objetivo:Number(cur.objetivo)||0});
      $("#m-pilar").value=cur.pilar; $("#m-publico").value=cur.publico; $("#m-objetivo").value=cur.objetivo;
    };
    $("#listas-close").onclick=closeListas; $("#listas-done").onclick=closeListas;
    $("#listas-add").onclick=addItem;
    $("#listas-input").addEventListener("keydown",function(e){ if(e.key==="Enter") addItem(); });
    $("#scope-close").onclick=closeScope; $("#scope-cancel").onclick=closeScope;
    $("#scope-save").onclick=function(){ saveScope(false); };
    $("#scope-none").onclick=function(){ saveScope(true); };
    [$("#modal"),$("#listas"),$("#scopebg")].forEach(function(bg){ bg.addEventListener("click",function(e){ if(e.target===bg) bg.classList.remove("open"); }); });
    // Fecha os dropdowns de filtro ao clicar fora deles.
    document.addEventListener("click",function(e){ if(!e.target.closest(".msdd")) closeAllDropdowns(); });
    document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ closePost(); closeListas(); closeScope(); closeAllDropdowns(); } });
  }

  // ==========================================================================
  //  AGENDA INTELIGENTE (v2) — interpretação ao vivo
  // ==========================================================================
  // Contrato: o front NÃO interpreta nada. Ele manda o texto + o contexto da
  // tela (data de hoje LOCAL e mês visível na grade) para
  // POST /api/calendario/agenda/interpretar e desenha o plano que volta.
  // Uma fonte de verdade só, no Worker, testada por `npm run test:agenda`.
  //
  // Aplicáveis hoje: consultar (filtra, escrita zero), criar, mover e trocar
  // status. Alterar e remover seguem em dry-run — a tela responde "a ferramenta
  // entendeu o que eu escrevi?" antes de existir botão que grave.
  var AG_DEBOUNCE = 320;      // ms após a última tecla
  var AG_MIN = 4;             // não vale interpretar "Inc"
  var agTimer = null, agSeq = 0, agUltimo = "", agUi = null, agPlano = null;
  // Respostas HUMANAS às perguntas do parser, enviadas ao aplicar (fase 2).
  // Zeradas a cada nova interpretação: texto novo = perguntas novas, e um
  // `trecho` de antes pode nem existir mais no comando.
  var agResolucoes = {};
  var agEnviando = false;     // trava contra duplo Enter / duplo clique
  var agPostDestaque = null;  // id do post que o último comando criou OU alterou
  /** Intenções que GRAVAM (o Enter delas escreve). Desde a 4.2, TODAS gravam. */
  var ESCREVEM = {criar:true, mover:true, status:true, remover:true, alterar:true};

  // ── A ILHA: estados, canto e anticolisão ───────────────────────────────────
  // ★ A ilha NÃO FECHA (§8.8, pergunta aberta nº 5). Do tamanho de um campo de
  // texto, esconder e reabrir custaria mais do que economiza — e a FAB do §8.6,
  // que só existia porque o dock desaparecia por inteiro, morreu junto. O que se
  // lembra entre visitas, portanto, não é "aberto/fechado": é o CANTO.
  var ILHA_CANTO_CHAVE = "cal2.ilha.canto";
  /** Ordem do botão de canto: gira sempre no mesmo sentido, porque previsível
   *  vale mais que ótimo — dois cliques têm de levar sempre ao mesmo lugar. */
  var CANTOS = ["bd","be","ce","cd"];
  var CANTO_NOME = {bd:"canto inferior direito", be:"canto inferior esquerdo",
                    ce:"canto superior esquerdo", cd:"canto superior direito"};
  /** Canto para cada seta do Alt+seta — a alternativa de teclado ao botão. */
  var CANTO_SETA = {ArrowLeft:{bd:"be", cd:"ce", be:"be", ce:"ce"},
                    ArrowRight:{be:"bd", ce:"cd", bd:"bd", cd:"cd"},
                    ArrowUp:{bd:"cd", be:"ce", cd:"cd", ce:"ce"},
                    ArrowDown:{cd:"bd", ce:"be", bd:"bd", be:"be"}};
  var ILHA_MARG = 18;      // espelha --ilha-marg
  var ILHA_MOBILE = 700;   // espelha o @media (max-width:700px)

  var ilhaCanto = localStorage.getItem(ILHA_CANTO_CHAVE) || "bd";
  if(CANTOS.indexOf(ilhaCanto) < 0) ilhaCanto = "bd";
  var ilhaLogAberto = false;
  var ilhaFocada = false;
  var ilhaDesviou = false;   // ★ no máximo UM salto por comando

  /**
   * Fonte única do estado visual da ilha. Quem muda algo chama isto, em vez de
   * mexer em classe na mão: são quatro estados que se COMBINAM (repouso, vitrine,
   * registro aberto, comando escrito), e espalhá-los seria o jeito garantido de a
   * pílula acabar grande e vazia — ou pequena com conteúdo dentro.
   */
  function ilhaSincronizar(){
    var il = $("#ilha");
    var texto = $("#ag-texto").value.trim();
    // A VITRINE aparece ao FOCAR, antes de digitar (§8.8, pergunta aberta nº 1):
    // é o instante exato em que a pessoa precisa saber o que dizer. Com comando
    // escrito, quem ocupa o lugar é o plano — as sugestões não somem, só esperam,
    // e é por isso que elas podem sair da tela em repouso sem perder a função de
    // ensinar o vocabulário a quem nunca usou.
    var vitrine = ilhaFocada && !texto && agSugCache.length > 0 && !ilhaLogAberto;
    il.setAttribute("data-canto", ilhaCanto);
    il.classList.toggle("vitrine", vitrine);
    il.classList.toggle("log-aberto", ilhaLogAberto);
    il.classList.toggle("com-texto", !!texto);
    il.classList.toggle("cresceu", vitrine || ilhaLogAberto || !!texto);
    $("#cop-hist").hidden = !ilhaLogAberto;

    // Selo do registro: um número, não um chat. Abre por CLIQUE (§8.8, nº 2) —
    // hover em elemento flutuante é frágil e simplesmente não existe no toque.
    var selo = $("#ilha-selo"), n = agHistorico.length;
    selo.hidden = !n;
    selo.textContent = "☰ " + n;
    selo.title = n + (n===1 ? " comando nesta sessão" : " comandos nesta sessão")
               + " — clique para " + (ilhaLogAberto ? "fechar" : "ver") + " o registro";
    selo.setAttribute("aria-expanded", ilhaLogAberto ? "true" : "false");

    // ★ Desfazer FORA do selo: a regra do §8.4 é que a rede de segurança fica no
    // caminho de quem acabou de agir. Atrás de um clique no registro ela seria o
    // "menu" que a fase 4.1 recusou.
    $("#ilha-desfazer").hidden = agIndiceDesfazivel() < 0;

    var bc = $("#ilha-canto");
    var prox = CANTOS[(CANTOS.indexOf(ilhaCanto) + 1) % CANTOS.length];
    bc.title = "Mover a Agenda para o " + CANTO_NOME[prox] + " (ou Alt + setas)";
    bc.setAttribute("aria-label", bc.title);
  }

  function ilhaIrPara(canto){
    if(CANTOS.indexOf(canto) < 0 || canto === ilhaCanto) return;
    ilhaCanto = canto;
    try{ localStorage.setItem(ILHA_CANTO_CHAVE, canto); }catch(e){}
    ilhaSincronizar();
  }
  function ilhaGirarCanto(){
    ilhaIrPara(CANTOS[(CANTOS.indexOf(ilhaCanto) + 1) % CANTOS.length]);
  }

  /** Retângulo que a ilha OCUPARIA num canto — sem movê-la para descobrir. */
  function ilhaRetEm(canto, w, h){
    var vw = window.innerWidth, vh = window.innerHeight;
    var esq = (canto === "be" || canto === "ce") ? ILHA_MARG : vw - ILHA_MARG - w;
    var top = (canto === "cd" || canto === "ce") ? ILHA_MARG : vh - ILHA_MARG - h;
    return {left:esq, top:top, right:esq + w, bottom:top + h};
  }
  function seCruzam(a, b){
    return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  }

  /**
   * ★ ANTICOLISÃO — é por isto que a ilha foi escolhida entre as seis maquetes.
   *
   * A patologia registrada no §8.6 era: o painel cresce justamente quando há algo
   * a decidir, cobrindo a grade que a pessoa precisa olhar PARA decidir. O dock
   * tolerava a colisão; a ilha sai da frente.
   *
   * As três regras existem todas para a tela não ficar nervosa:
   *   1. Só salta quando o retângulo da ilha REALMENTE cruza um cartão marcado —
   *      não por precaução, nem "sempre que houver alvo".
   *   2. No máximo UM salto por comando (`ilhaDesviou`, zerado a cada texto novo).
   *   3. Vai para o primeiro canto LIVRE na ordem do botão. Se nenhum estiver
   *      livre, fica onde está: trocar uma colisão por outra é só movimento.
   *
   * O movimento é a transição de CSS, e ela É o rastro: o olho segue. Um fantasma
   * deixado no canto antigo seria sujeira permanente por um ganho de um instante.
   * Com `prefers-reduced-motion` o navegador suprime a transição e o salto fica
   * seco — o que continua correto, porque o valor está em SAIR da frente.
   */
  function ilhaDesviar(){
    if(ilhaDesviou) return;
    if(window.innerWidth <= ILHA_MOBILE) return;   // barra inferior: não há para onde
    var marcados = document.querySelectorAll(".chip.alvo, .chip.cand");
    if(!marcados.length) return;

    var il = $("#ilha");
    // ★ A largura vem da VARIÁVEL, não de offsetWidth: `cresceu` acabou de entrar
    // e a transição de .18s ainda está no meio, então medir devolveria um valor
    // interpolado e a conta erraria. A altura pode ser medida (não é transicionada).
    var cs = getComputedStyle(document.documentElement);
    var alvoW = parseFloat(cs.getPropertyValue(
      il.classList.contains("cresceu") ? "--ilha-w" : "--ilha-rep")) || 390;
    var w = Math.min(alvoW, window.innerWidth - ILHA_MARG * 2);
    var h = il.offsetHeight;

    var cartoes = [];
    Array.prototype.forEach.call(marcados, function(el){
      cartoes.push(el.getBoundingClientRect());
    });
    function livre(canto){
      var r = ilhaRetEm(canto, w, h);
      for(var i=0;i<cartoes.length;i++){ if(seCruzam(r, cartoes[i])) return false; }
      return true;
    }

    ilhaDesviou = true;              // tentou: não tenta outra vez neste comando
    if(livre(ilhaCanto)) return;     // já está fora do caminho
    var i0 = CANTOS.indexOf(ilhaCanto);
    for(var k=1;k<CANTOS.length;k++){
      var c = CANTOS[(i0 + k) % CANTOS.length];
      if(livre(c)){ ilhaIrPara(c); return; }
    }
  }

  // ── O comando na GRADE (enxerto do prato 02 do estudo, §8.8) ───────────────
  // O chip "Post encontrado" descreve em TEXTO um post que a grade pode MOSTRAR.
  var NUM_CIRC = ["","①","②","③","④","⑤","⑥"];

  function agLimparMarcas(){
    Array.prototype.forEach.call(document.querySelectorAll(".chip.alvo, .chip.cand"),
      function(el){
        el.classList.remove("alvo","cand");
        var n = $(".num", el); if(n) n.remove();
      });
  }

  /**
   * Marca no calendário o post que o comando encontrou (anel azul) ou os
   * candidatos que ele precisa desempatar (número âmbar).
   *
   * ★ SOMA à lista de texto do painel, não substitui: o candidato pode estar em
   * OUTRO mês, e aí não existe cartão para marcar. Não achar nada é normal aqui.
   */
  function agMarcarNaGrade(plano){
    agLimparMarcas();
    var alvo = plano && plano.alvo;
    if(!alvo) return;
    if(alvo.estado === "resolvido" && alvo.escolhido){
      agMarcarCartao(alvo.escolhido.id, "alvo", null);
    }else if(alvo.estado === "perguntar"){
      (alvo.candidatos||[]).forEach(function(c,i){ agMarcarCartao(c.id, "cand", i+1); });
    }
  }
  function agMarcarCartao(id, classe, numero){
    var el = document.querySelector('.chip[data-post-id="'+id+'"]');
    if(!el) return;
    el.classList.add(classe);
    if(numero != null){
      var s = document.createElement("span");
      s.className = "num"; s.textContent = NUM_CIRC[numero] || numero;
      el.appendChild(s);
    }
  }

  /**
   * Clicar num cartão numerado RESPONDE "qual post?" — pelo mesmo caminho do
   * botão de opção no painel: a escolha volta ao servidor (§8.3), porque é ele
   * que sabe se aquele post já está na data pedida e é ele que devolve o chip do
   * alvo com os dados reais. A diferença é só ONDE se decide: olhando os posts no
   * mês, não uma lista de títulos parecidos dentro de um painel.
   */
  function agResponderAlvoPeloCartao(id){
    agResolucoes.alvo = {acao:"escolher", id:id};
    agInterpretar(agUltimo, true);
  }

  // ── Registro da sessão ─────────────────────────────────────────────────────
  // Memória de TRABALHO, não histórico: vive só em memória e some no F5 (decisão
  // do usuário). O log de verdade continua no D1 desde a fase 4.1 — é ele que
  // sustenta o Desfazer e a auditoria; isto aqui é a visão do que EU acabei de
  // fazer, para não precisar reler a grade a cada comando.
  var agHistorico = [];
  var JANELA_DESFAZER_MS = 60*60*1000;   // espelha JANELA_DESFAZER_MIN do servidor

  /** @param tipo 'ok' (gravou) | 'consulta' (filtrou) | 'err' (recusado) */
  function agRegistrar(tipo, texto, resultado, logId){
    agHistorico.push({
      tipo:tipo, texto:texto, resultado:resultado,
      logId:logId||null, quando:Date.now(), desfeito:false
    });
    agRenderHistorico();
  }

  /**
   * ★ O Desfazer aparece em UMA linha só — a última que gravou e ainda não foi
   * desfeita. Não é economia de botão: a rota `/agenda/desfazer` é uma PILHA
   * (desfaz o último comando da pessoa, §6.2), então oferecer o botão em toda
   * linha prometeria escolher qual reverter e faria outra coisa. Depois de
   * desfazer, o botão migra sozinho para a linha anterior — que é exatamente o
   * que o servidor passará a reverter.
   */
  /**
   * Índice da última linha que o servidor reverteria — a mesma régua que a rota
   * usa (última da PESSOA, gravável, não desfeita, dentro da janela). Extraída
   * porque agora tem dois leitores: o registro (para pôr o botão na linha certa) e
   * o selo da ilha (para decidir se o Desfazer existe na pílula).
   */
  function agIndiceDesfazivel(){
    for(var i=agHistorico.length-1;i>=0;i--){
      var h=agHistorico[i];
      if(h.tipo==="ok" && h.logId && !h.desfeito && (Date.now()-h.quando)<JANELA_DESFAZER_MS) return i;
    }
    return -1;
  }

  function agRenderHistorico(){
    var box=$("#cop-hist"); box.innerHTML="";
    ilhaSincronizar();   // o selo conta as linhas; o Desfazer da pílula depende delas
    if(!agHistorico.length){
      var v=document.createElement("div"); v.className="cop-vazio";
      v.textContent="Diga o que você quer fazer.";
      box.appendChild(v);
      return;
    }
    var alvoDesfazer=agIndiceDesfazivel();
    agHistorico.forEach(function(h,i){
      var d=document.createElement("div");
      d.className="hist-item "+h.tipo+(h.desfeito?" desfeito":"");
      var c=document.createElement("div"); c.className="cmd"; c.textContent=h.texto;
      var r=document.createElement("div"); r.className="res"; r.textContent=h.resultado;
      d.appendChild(c); d.appendChild(r);
      if(i===alvoDesfazer){
        var b=document.createElement("button");
        b.type="button"; b.className="hist-desfazer"; b.textContent="↶ Desfazer";
        b.onclick=agDesfazer;
        d.appendChild(b);
      }
      box.appendChild(d);
    });
    // Comando novo vai para o fim: a faixa rola até ele, como um registro.
    var corpo=$("#cop-corpo"); corpo.scrollTop=corpo.scrollHeight;
  }

  /** Marca a última linha gravável como desfeita (o Desfazer migra sozinho). */
  function agMarcarDesfeito(){
    for(var i=agHistorico.length-1;i>=0;i--){
      if(agHistorico[i].tipo==="ok" && !agHistorico[i].desfeito){ agHistorico[i].desfeito=true; break; }
    }
    agRenderHistorico();
  }

  // ── Sugestões verificadas ──────────────────────────────────────────────────
  // Vêm de GET /agenda/sugestoes, montadas a partir do dado que está NA GRADE e
  // já passadas pelo parser no servidor: o que aparece aqui executa (ver o topo
  // de src/calendario/agenda-sugestoes.js). Substituem as nove frases fixas que
  // moravam neste arquivo e citavam posts que podiam nem existir mais.
  //
  // Buscadas por EVENTO — abrir o painel, trocar de mês, trocar de cliente,
  // pedir outras ideias, concluir um comando —, nunca por tecla.
  var agSemente = 0, agSugSeq = 0, agSugCtx = "", agSugCache = [];
  var AG_VERBO_SUG = {consultar:"Consultar", criar:"Criar", mover:"Mover",
                      status:"Trocar status", alterar:"Alterar", remover:"Remover"};

  /**
   * BUSCA as sugestões. Separada de agRenderSugestoes de propósito: desenhar
   * acontece a toda hora (a vitrine some e volta conforme o campo enche e
   * esvazia), buscar não pode — `agLimpar` roda a cada tecla enquanto o texto
   * ainda é curto, e uma requisição ali seria query por keystroke, o padrão que
   * está na fila de "Revisão do Repositório" do hub.
   */
  async function agSugestoes(girar){
    // Não há mais guarda de "painel aberto": a ilha não fecha. A economia que a
    // guarda fazia continua de pé pelo outro lado — a busca é por EVENTO
    // (abrir a vitrine, trocar de mês/cliente, girar, concluir comando), jamais
    // por tecla.
    agSemente = girar ? (agSemente + 1) : agSemente;
    var seq = ++agSugSeq;
    var ctx = agContexto();
    try{
      var qs = "?mes="+encodeURIComponent(ctx.mes)+"&hoje="+encodeURIComponent(ctx.hoje)
             + "&semente="+agSemente + (ctx.cliente_id ? "&cliente_id="+ctx.cliente_id : "");
      var r = await fetch(API+"/agenda/sugestoes"+qs, {headers:{Accept:"application/json"}});
      var d = await r.json();
      if(seq!==agSugSeq) return;                       // resposta velha: descarta
      agSugCache = (d.ok && d.sugestoes) || [];
    }catch(e){
      if(seq!==agSugSeq) return;
      agSugCache = [];                                 // sem vitrine, o resto vive
    }
    agRenderSugestoes();
  }

  function agRenderSugestoes(){
    var lista = agSugCache;
    var box=$("#cop-sug"); box.innerHTML="";
    ilhaSincronizar();   // a vitrine ter ou não conteúdo decide se a ilha cresce
    // Some enquanto há comando escrito: sugestão é para a folha em branco.
    if(!lista.length || $("#ag-texto").value.trim()){ box.hidden=true; return; }
    box.hidden=false;

    // ★ O cabeçalho NOMEIA a ferramenta. Em repouso a ilha é só um campo de texto;
    // é aqui — no primeiro foco, antes de digitar — que quem nunca viu a Agenda
    // descobre o que ela é. Era o papel do rótulo da FAB no §8.6.
    var cab=document.createElement("div"); cab.className="cab";
    cab.appendChild(document.createTextNode("Agenda Inteligente · experimente"));
    var g=document.createElement("button");
    g.type="button"; g.className="girar"; g.textContent="↻ outras ideias";
    g.title="Mostra outros comandos possíveis com o que está na grade";
    g.onclick=function(){ agSugestoes(1); };
    cab.appendChild(g);
    box.appendChild(cab);

    lista.forEach(function(s){
      var b=document.createElement("button");
      b.type="button"; b.className="sug"+(s.perigo?" perigo":"");
      var v=document.createElement("span"); v.className="verbo";
      v.textContent=AG_VERBO_SUG[s.intencao]||s.intencao;
      b.appendChild(v);
      b.appendChild(document.createTextNode(s.texto));
      // ★ PREENCHE, nunca executa — vale inclusive para a de remover. A promessa
      // dos chips é ver antes de agir, e uma sugestão que agisse sozinha seria a
      // primeira coisa da tela a quebrá-la.
      b.onclick=function(){
        $("#ag-texto").value=s.texto; agUltimo=""; agAoDigitar();
        $("#ag-texto").focus();
      };
      box.appendChild(b);
    });
  }

  /**
   * Rebusca a vitrine quando o CONTEXTO da grade muda (mês ou cliente do
   * filtro) — e só então. Chamada de dentro de render(), que roda a cada mexida
   * de filtro; a comparação de chave é o que impede uma requisição por clique.
   */
  function agSugestoesSeMudou(){
    var c=agContexto();
    var chave=c.mes+"|"+(c.cliente_id||"");
    if(chave===agSugCtx) return;
    agSugCtx=chave;
    agSugestoes(0);
  }

  function agContexto(){
    var hoje = new Date();
    return {
      hoje: ymd(hoje),                                                   // data LOCAL de quem digita
      mes: view.getFullYear()+"-"+pad(view.getMonth()+1),                // mês aberto na grade
      cliente_id: clientesFiltro.length===1 ? clientesFiltro[0] : null   // cliente do filtro, se único
    };
  }

  function agRotulo(campo){
    return (agUi && agUi.rotulos && agUi.rotulos[campo]) || campo;
  }

  // Texto curto e legível para o valor de um chip.
  function agValor(campo, c){
    if(Array.isArray(c.valor)) return c.valor.join(" + ");
    if(c.valor && typeof c.valor==="object") return (c.valor.de||"")+" → "+(c.valor.ate||"");
    if(campo==="impulsionar") return c.valor ? "Sim" : "Não";
    return String(c.rotulo!=null && c.rotulo!=="" ? c.rotulo : c.valor);
  }

  function agChip(classe, campo, valor, titulo){
    var s=document.createElement("span");
    s.className="cchip "+classe;
    if(titulo) s.title=titulo;
    s.innerHTML='<b>'+esc(agRotulo(campo))+'</b> '+esc(valor);
    return s;
  }

  function agDesenhar(plano){
    agPlano = plano;
    var out=$("#ag-out");
    out.classList.add("on");
    agRenderSugestoes();   // há comando escrito: a vitrine sai da frente

    // Intenção + medidor de confiança
    var nomeInt=(agUi&&agUi.intencoes&&agUi.intencoes[plano.intencao])||plano.intencao;
    $("#ag-intencao").textContent=nomeInt;
    var pct=Math.round(plano.confianca*100);
    var med=$("#ag-medidor");
    med.className="medidor"+(pct>=75?"":(pct>=50?" media":" baixa"));
    $("i",med).style.width=pct+"%";
    $("#ag-conf").textContent=pct+"% de confiança";

    // O botão troca de papel conforme a intenção: filtrar (fase 1, não escreve),
    // criar (fase 2), mover e marcar status (fase 3). Alterar/remover seguem em
    // dry-run — sem botão. O destaque visual acompanha quem GRAVA.
    var acao=agAcaoDoPlano(plano);
    var btn=$("#ag-aplicar");
    if(acao){
      btn.style.display="";
      btn.textContent=acao.rotulo;
      btn.disabled=!acao.pode || agEnviando;
      btn.title=acao.porque||"";
      // `.danger` já existe na folha (é o Excluir do modal) — mesma cor para a
      // mesma consequência, em vez de um vermelho novo só para a Agenda.
      btn.className="btn"+(acao.escreve?"":" ghost")+(acao.perigo?" danger":"");
    }else{
      btn.style.display="none";
    }

    // Chips dos campos, na ordem estável que o backend define
    var box=$("#ag-chips"); box.innerHTML="";
    var ordem=(agUi&&agUi.ordem)||Object.keys(plano.campos);
    ordem.forEach(function(campo){
      var c=plano.campos[campo]; if(!c) return;
      var classe = c.confianca>=0.9 ? "ok" : "conferir";
      var dica = "origem: "+c.origem+" · confiança "+Math.round(c.confianca*100)+"%"
               + (c.trecho ? ' · lido de "'+c.trecho+'"' : "");
      box.appendChild(agChip(classe, campo, agValor(campo,c), dica));
    });
    // Mudanças (fase 4.2) — chips com uma SETA, para a leitura ser "o que vira o
    // quê". Sem a seta, um chip "Formato Reels" ao lado de "Formato Carrossel"
    // (o critério) seria indistinguível, e é exatamente essa confusão que a
    // decisão do "para" existe para desfazer.
    Object.keys(plano.mudancas||{}).forEach(function(campo){
      var c=plano.mudancas[campo];
      box.appendChild(agChip("muda", campo, "→ "+agValor(campo,c),
        "valor NOVO · origem: "+c.origem+(c.trecho?' · lido de "'+c.trecho+'"':"")));
    });
    // Obrigatórios ausentes viram chips vermelhos — a pessoa vê o que falta.
    (plano.faltando||[]).forEach(function(campo){
      box.appendChild(agChip("falta", campo, "?", "obrigatório para "+nomeInt.toLowerCase()));
    });
    if(!box.children.length){
      var vazio=document.createElement("span"); vazio.className="conf";
      vazio.textContent="Nada reconhecido ainda.";
      box.appendChild(vazio);
    }

    // Perguntas (ambiguidades). Responder registra a escolha em agResolucoes —
    // é isso que viaja para /aplicar. A tela nunca manda o corpo do post; ela só
    // responde o que é decisão humana (ver o topo de src/calendario/agenda.js).
    var pbox=$("#ag-perguntas"); pbox.innerHTML="";
    (plano.ambiguidades||[]).forEach(function(a){
      var linha=document.createElement("div"); linha.className="pergunta";
      var qual = a.acao==="criar"
        ? 'não existe em <strong>'+esc(agRotulo(a.campo))+'</strong> — cadastrar?'
        : 'qual <strong>'+esc(agRotulo(a.campo))+'</strong>?';
      linha.innerHTML='<span>❓ "<strong>'+esc(a.trecho)+'</strong>" '+qual+'</span>';

      function resolver(resolucao, chip){
        agResolucoes[a.campo]=resolucao;
        // Fase 3: responder QUAL POST volta ao servidor em vez de resolver na
        // tela. Não é preciosismo — é o servidor que sabe se aquele post já está
        // na data pedida (o "nada a mover") e que devolve o chip do alvo com os
        // dados reais. Nas opções o atalho local vale a pena: lá a escolha é só
        // um id que já veio na lista.
        if(a.campo==="alvo"){ agInterpretar(agUltimo, true); return; }
        // Fase 4.2: a resposta vai para `mudancas` quando a pergunta é sobre o
        // VALOR NOVO — e nesse caso ela satisfaz o obrigatório `mudanca`, que veio
        // do servidor calculado ANTES da resposta. Sem soltar esse `faltando`, a
        // pessoa respondia a pergunta e o botão continuava desabilitado para
        // sempre. O servidor revalida do jeito dele; isto é a tela não mentir.
        var destino = a.destino==="mudanca" ? (plano.mudancas=plano.mudancas||{}) : plano.campos;
        if(chip) destino[a.campo]=chip; else delete destino[a.campo];
        if(a.destino==="mudanca" && chip){
          plano.faltando=(plano.faltando||[]).filter(function(f){ return f!=="mudanca"; });
        }
        plano.ambiguidades=plano.ambiguidades.filter(function(x){return x!==a;});
        agDesenhar(plano);
      }

      if(a.acao==="criar"){
        var bc=document.createElement("button"); bc.className="opt";
        bc.textContent='Cadastrar "'+a.trecho+'"';
        bc.title="Cria o valor na lista, exclusivo deste cliente, ao criar o post";
        bc.onclick=function(){
          // valor null: o id só existe depois de o Worker cadastrar. O chip fica
          // em "conferir" para deixar claro que ainda vai ser criado.
          resolver({acao:"criar"}, {valor:null, rotulo:a.trecho+" (cadastrar)",
            trecho:a.trecho, origem:"cadastrar ao criar", confianca:0.85});
        };
        linha.appendChild(bc);
      }else{
        (a.opcoes||[]).forEach(function(o){
          var b=document.createElement("button"); b.className="opt";
          // Sem score é candidato a POST achado por cliente+data, não por
          // semelhança de título: mostrar "(0%)" ali seria só ruído.
          b.textContent=o.nome+(o.score==null?"":" ("+Math.round(o.score*100)+"%)");
          b.onclick=function(){
            resolver({acao:"escolher", id:o.id},
              {valor:o.id, rotulo:o.nome, trecho:a.trecho, origem:"escolha do usuário", confianca:1});
          };
          linha.appendChild(b);
        });
      }
      // Saída explícita: "isso não era pilar/público, era parte do texto". Não
      // vale para o alvo (`sem_ignorar`): um comando de mover fala de um post
      // existente por definição — "não é um post" não é resposta possível.
      if(!a.sem_ignorar){
        var bi=document.createElement("button"); bi.className="opt";
        bi.textContent="Não é "+agRotulo(a.campo).toLowerCase();
        bi.onclick=function(){ resolver({acao:"ignorar"}, null); };
        linha.appendChild(bi);
      }

      pbox.appendChild(linha);
    });

    // Avisos do parser (ano inferido, data no passado, cliente vs. título…)
    var abox=$("#ag-avisos"); abox.innerHTML="";
    (plano.avisos||[]).forEach(function(a){
      var d=document.createElement("div"); d.className="agenda-aviso"; d.textContent="⚠ "+a;
      abox.appendChild(d);
    });

    // Rodapé: o que sobrou sem interpretação + em que fase isso será aplicável.
    var rod=$("#ag-rodape"); rod.innerHTML="";
    if((plano.resto||[]).length){
      var r=document.createElement("span"); r.className="resto";
      r.textContent="não interpretado: "+plano.resto.join(" · ");
      rod.appendChild(r);
    }
    var VERBO_ENTER={criar:"CRIA o post", mover:"MOVE o post", status:"TROCA o status do post",
                     remover:"pede confirmação para REMOVER o post", alterar:"ALTERA o post"};
    var f=document.createElement("span");
    // Destaque no aviso de que o Enter GRAVA. O Enter da Agenda nunca deve ser
    // surpresa (§8.2), e num painel estreito uma linha cinza a mais passa batida.
    if(acao && acao.escreve && acao.pode) f.className="grava";
    if(plano.consulta){
      f.textContent = plano.consulta.vazia
        ? "↵ Enter mostra tudo (limpa os filtros) — nada é gravado"
        : "↵ Enter filtra a grade — consulta não grava nada";
    }else if(acao && acao.escreve){
      f.textContent = acao.pode
        ? "↵ Enter "+VERBO_ENTER[acao.tipo]+" — esta ação grava"
        : acao.porque;
    }else if(plano.intencao==="criar" && !me.canEditCalendario){
      f.textContent = "criar exige o perfil de edição do calendário";
    }else if(plano.intencao==="mover" && !me.canEditCalendario){
      f.textContent = "mudar a data exige o perfil de edição do calendário";
    }else if(plano.intencao==="remover" && !me.canEditCalendario){
      f.textContent = "remover exige o perfil de edição do calendário";
    }else if(plano.intencao==="alterar" && !me.canEditCalendario){
      f.textContent = "alterar campos exige o perfil de edição do calendário";
    }else if(plano.intencao==="status" && !me.canToggleCalendarioStatus){
      f.textContent = "trocar status exige perfil do calendário";
    }else{
      f.textContent = plano.meta.fase_aplicacao
        ? "execução de “"+nomeInt.toLowerCase()+"” prevista para a fase "+plano.meta.fase_aplicacao
        : "";
    }
    rod.appendChild(f);

    // ── A grade participa do plano (§8.8) ────────────────────────────────────
    // Estes dois passos vêm no FIM de propósito: marcar depende do alvo já
    // resolvido, e desviar depende da altura FINAL da ilha (que os chips e as
    // perguntas acima acabaram de definir).
    agMarcarNaGrade(plano);
    ilhaDesviar();
  }

  /**
   * O que o botão faz para este plano — ou null quando não há ação nesta fase.
   * Fase 1: consultar (filtra, não grava). Fase 2: criar. Fase 3: mover e trocar
   * status. `alterar` e `remover` seguem em dry-run.
   *
   * Devolve {tipo, rotulo, pode, porque, escreve}. `escreve` é o que decide o
   * destaque do botão e o texto do rodapé: a pessoa tem de saber, ANTES do
   * Enter, se aquele comando toca o banco.
   */
  function agAcaoDoPlano(plano){
    if(!plano) return null;
    if(plano.consulta) return {tipo:"filtrar", rotulo:"Filtrar a grade", pode:true, porque:"", escreve:false};

    var ACOES={
      criar:  {rotulo:function(){ return "Criar post"; },        precisa:"editar"},
      mover:  {rotulo:function(p){ var d=p.campos.data_publicacao;
                                   return "Mover para "+(d?agData(d.valor):"a data"); }, precisa:"editar"},
      // Status é a única ação de escrita que o perfil `calendario-status` alcança
      // — a mesma divisão do checkmark do card (Ana e Daiane trocam status, não
      // criam nem movem). O servidor recusa de todo jeito; isto é para não
      // oferecer o que não dá.
      status: {rotulo:function(p){ var s=p.campos.status;
                                   return "Marcar como "+(s?s.valor:"…"); },           precisa:"status"},
      // Fase 4. Rótulo com o verbo explícito e destaque de perigo: é a única ação
      // cujo resultado não fica visível na grade depois (o card simplesmente sai).
      remover:{rotulo:function(){ return "Remover post"; },      precisa:"editar", perigo:true},
      // Fase 4.2. O rótulo diz QUAL campo muda, porque é o que a pessoa precisa
      // conferir: alterar erra escrevendo o valor certo no campo errado.
      alterar:{rotulo:function(p){
        var campos=Object.keys(p.mudancas||{});
        return campos.length ? ("Alterar "+campos.map(agRotulo).join(" e ")) : "Alterar post";
      }, precisa:"editar"}
    };
    var def=ACOES[plano.intencao];
    if(!def) return null;
    if(def.precisa==="editar" && !me.canEditCalendario) return null;
    if(def.precisa==="status" && !me.canToggleCalendarioStatus) return null;

    var pendencias=[];
    var falta=(plano.faltando||[]).map(agRotulo);
    if(falta.length) pendencias.push("informar "+falta.join(", "));
    var perguntas=(plano.ambiguidades||[]).length;
    if(perguntas) pendencias.push(perguntas===1?"responder 1 pergunta":"responder "+perguntas+" perguntas");

    var porque = pendencias.length ? ("Falta "+pendencias.join(" e ")+".") : "";

    // Fase 3: o alvo é o bloqueio mais comum, e a frase vem do SERVIDOR — a mesma
    // que a rota de aplicar usaria — para tela e API nunca se contradizerem.
    var alvo=plano.alvo;
    if(alvo && alvo.impedimento){ porque=alvo.impedimento; }
    else if(alvo && alvo.estado && alvo.estado!=="resolvido" && alvo.estado!=="perguntar"){
      porque=alvo.motivo;
    }

    return {
      tipo:plano.intencao, rotulo:def.rotulo(plano), escreve:true, perigo:!!def.perigo,
      pode:!porque, porque:porque
    };
  }

  /** 'YYYY-MM-DD' -> '12/09' (rótulo curto de botão e toast). */
  function agData(iso){
    return /^\d{4}-\d{2}-\d{2}$/.test(String(iso)) ? String(iso).slice(8,10)+"/"+String(iso).slice(5,7) : String(iso||"");
  }

  // ── Filtro ativo (fase 1) ──────────────────────────────────────────────────
  // A barra é uma VISÃO de tudo que filtra a grade: os dois dropdowns + as
  // dimensões que só a Agenda aplica. Um chip por critério, com × para desfazer
  // uma dimensão sem reescrever o comando inteiro.
  var AG_FILTRO_DEF = [
    {k:"formato",     campo:"formato",     txt:function(v){ return v; }},
    {k:"status",      campo:"status",      txt:function(v){ return v; }},
    {k:"pilar_id",    campo:"pilar",       txt:function(v){ return opcaoNome("pilares",v); }},
    {k:"publico_id",  campo:"publico",     txt:function(v){ return opcaoNome("publicos",v); }},
    {k:"objetivo_id", campo:"objetivo",    txt:function(v){ return opcaoNome("objetivos",v); }},
    {k:"impulsionar", campo:"impulsionar", txt:function(v){ return v?"Sim":"Não"; }},
    // Em consulta o resíduo cai em alvo_titulo; como filtro, é "contém".
    {k:"titulo",      rotulo:"Título contém", txt:function(v){ return v; }}
  ];

  function agFiltroTemAlgo(f){
    if(!f) return false;
    for(var k in f){ if(f[k]!=null) return true; }
    return false;
  }

  function agFiltroChip(rotulo, valor, remover){
    var s=document.createElement("span");
    s.className="cchip ok";
    s.innerHTML='<b>'+esc(rotulo)+'</b> '+esc(valor);
    // <button> de verdade, não <span> com onclick: o × precisa ser alcançável
    // por teclado e anunciado por leitor de tela — é um controle, não enfeite.
    var x=document.createElement("button");
    x.type="button"; x.className="x"; x.textContent="×";
    x.title="Remover este critério";
    x.setAttribute("aria-label","Remover filtro "+rotulo+" "+valor);
    x.onclick=remover;
    s.appendChild(x);
    return s;
  }

  // Navegar de mês CONTRADIZ um período aplicado ("em julho" e depois clicar ›).
  // Solta só o período; as outras dimensões do filtro continuam valendo.
  function agSoltarPeriodo(){
    if(!agFiltro || (agFiltro.de==null && agFiltro.ate==null)) return;
    agFiltro.de=null; agFiltro.ate=null;
    if(!agFiltroTemAlgo(agFiltro)) agFiltro=null;
  }

  function agFiltroLimparTudo(){
    clientesFiltro.length=0; redesFiltro.length=0; agFiltro=null;
    if(msClientes) msClientes.refresh();
    if(msRedes) msRedes.refresh();
    render();
  }

  function agRenderFiltro(){
    var bar=$("#ag-filtro"); bar.innerHTML="";
    var chips=[];

    // Cliente e redes vivem nos dropdowns — remover o chip mexe no dropdown.
    clientesFiltro.slice().forEach(function(id){
      chips.push(agFiltroChip(agRotulo("cliente"), opcaoNome("clientes",id)||("#"+id), function(){
        var i=clientesFiltro.indexOf(id); if(i>=0) clientesFiltro.splice(i,1);
        if(msClientes) msClientes.refresh();
        render();
      }));
    });
    redesFiltro.slice().forEach(function(r){
      chips.push(agFiltroChip(agRotulo("redes"), r, function(){
        var i=redesFiltro.indexOf(r); if(i>=0) redesFiltro.splice(i,1);
        if(msRedes) msRedes.refresh();
        render();
      }));
    });

    if(agFiltro){
      AG_FILTRO_DEF.forEach(function(d){
        var v=agFiltro[d.k]; if(v==null) return;
        chips.push(agFiltroChip(d.rotulo||agRotulo(d.campo), d.txt(v), function(){
          agFiltro[d.k]=null;
          if(!agFiltroTemAlgo(agFiltro)) agFiltro=null;
          render();
        }));
      });
      if(agFiltro.de!=null || agFiltro.ate!=null){
        var per = (agFiltro.de===agFiltro.ate)
          ? agFiltro.de
          : (agFiltro.de||"…")+" → "+(agFiltro.ate||"…");
        chips.push(agFiltroChip(agRotulo("periodo"), per, function(){
          agSoltarPeriodo(); render();
        }));
      }
    }

    if(!chips.length){ bar.classList.remove("on"); return; }
    var rot=document.createElement("span"); rot.className="rot"; rot.textContent="Filtrando";
    bar.appendChild(rot);
    chips.forEach(function(c){ bar.appendChild(c); });

    // Contagem é o retorno mais honesto de um filtro: zero avisa que a consulta
    // não achou nada, em vez de deixar a grade vazia sem explicação. Só conta o
    // que está DESENHADO, e diz quantos ficaram fora por fim de semana oculto —
    // senão a barra prometeria posts invisíveis.
    var achados=visiblePosts();
    var ocultos=achados.filter(function(p){ return fimDeSemanaOculto(p.data_publicacao); }).length;
    var n=achados.length-ocultos;
    var cont=document.createElement("span"); cont.className="vazio";
    cont.textContent = (n===0 ? "nenhum post neste mês" : (n===1 ? "1 post neste mês" : n+" posts neste mês"))
      + (ocultos ? " · "+ocultos+" em fim de semana oculto" : "");
    bar.appendChild(cont);

    var limpar=document.createElement("button");
    limpar.className="limpar"; limpar.type="button"; limpar.textContent="Limpar filtros";
    limpar.onclick=agFiltroLimparTudo;
    bar.appendChild(limpar);
    bar.classList.add("on");
  }

  /**
   * Aplica o plano de uma CONSULTA na grade. Não escreve nada — é o que torna
   * `consultar` a primeira intenção executável (fase 1).
   */
  async function agAplicar(){
    if(!agPlano || !agPlano.consulta){ return; }
    var f=agPlano.consulta.filtros;
    var comando=$("#ag-texto").value.trim();

    // "Mostre tudo": aplicar = limpar tudo.
    if(agPlano.consulta.vazia){
      agFiltroLimparTudo();
      agRegistrar("consulta", comando, "Filtros limpos — mostrando tudo.");
      toast("Filtros limpos — mostrando tudo.");
      return;
    }

    clientesFiltro.length=0;
    if(f.cliente_id!=null) clientesFiltro.push(f.cliente_id);
    redesFiltro.length=0;
    if(f.redes) f.redes.forEach(function(r){ redesFiltro.push(r); });
    if(msClientes) msClientes.refresh();
    if(msRedes) msRedes.refresh();

    agFiltro={
      formato:f.formato, status:f.status,
      pilar_id:f.pilar_id, publico_id:f.publico_id, objetivo_id:f.objetivo_id,
      impulsionar:f.impulsionar, titulo:f.titulo, de:f.de, ate:f.ate
    };
    if(!agFiltroTemAlgo(agFiltro)) agFiltro=null;

    // O período manda a grade para o mês do início. A grade mostra UM mês por
    // vez (decisão §7 nº 2 do doc: sem visão de lista), então um intervalo que
    // atravessa o mês é avisado em vez de silenciosamente cortado.
    var aviso="";
    if(f.de){
      var y=+f.de.slice(0,4), m=+f.de.slice(5,7)-1;
      if(y!==view.getFullYear() || m!==view.getMonth()){
        view=new Date(y,m,1);
        await loadPosts();
      }
      if(f.ate && f.ate.slice(0,7)!==f.de.slice(0,7)){
        aviso="O período vai até "+f.ate+", mas a grade mostra um mês por vez.";
      }
    }
    render();
    // A contagem é o retorno honesto de uma consulta — e no registro ela é o que
    // diferencia "filtrou e achou 12" de "filtrou e não achou nada", que na grade
    // são a mesma tela vazia.
    var achados=visiblePosts().length;
    agRegistrar("consulta", comando,
      (achados===0 ? "Nenhum post" : (achados===1 ? "1 post" : achados+" posts"))
      +" no mês visível."+(aviso?" "+aviso:""));
    toast(aviso ? ("Filtro aplicado. "+aviso) : "Filtro aplicado à grade.");
  }

  /**
   * Executa o comando: criar (fase 2), mover ou trocar status (fase 3). É a
   * única ação da Agenda que grava, e é uma rota só para as três.
   *
   * Manda o TEXTO + as resoluções — nunca o corpo do post, nem qual post
   * alterar. O Worker re-interpreta e aplica o que ele mesmo derivou (ver
   * src/calendario/agenda.js); é o determinismo do parser que torna isso
   * possível e seguro.
   */
  async function agExecutar(confirmacoes){
    if(agEnviando || !agPlano) return;
    var acao=agAcaoDoPlano(agPlano);
    if(!acao || !acao.escreve || !acao.pode) return;
    var conf = confirmacoes || {};
    // O texto é lido AGORA porque o campo é limpo no sucesso — e é o texto cru
    // que vai para o registro, não o resumo do que o parser entendeu.
    var comando = $("#ag-texto").value.trim();

    agEnviando=true;
    var btn=$("#ag-aplicar"); btn.disabled=true;
    try{
      var r=await fetch(API+"/agenda/aplicar",{
        method:"POST",
        headers:{Accept:"application/json","Content-Type":"application/json"},
        body:JSON.stringify({
          texto: $("#ag-texto").value.trim(),
          contexto: agContexto(),
          resolucoes: agResolucoes,
          confirmar_duplicado: !!conf.duplicado,
          confirmar_remocao: !!conf.remocao
        })
      });
      var d=await r.json();

      // 409 tem TRÊS significados, e os três são "decida você":
      //   duplicado          -> já existe post igual (criar)
      //   confirmar:'remocao'-> apagar precisa de sim explícito (remover)
      //   alvo               -> mais de um post atende ao comando
      if(r.status===409 && d.duplicado){
        agEnviando=false; btn.disabled=false;
        if(confirm("Já existe um post com esse título, nesse dia, para esse cliente.\n\nCriar mesmo assim?")){
          return agExecutar({duplicado:true});
        }
        agRegistrar("err", comando, "Criação cancelada — já existe post igual.");
        toast("Criação cancelada.");
        return;
      }
      // A pergunta NOMEIA o post e a data. "Remover mesmo?" sem dizer o quê é a
      // confirmação que a pessoa aprende a clicar sem ler.
      if(r.status===409 && d.confirmar==="remocao"){
        agEnviando=false; btn.disabled=false;
        var alvo=d.alvo_post||{};
        if(confirm("Remover o post:\n\n“"+(alvo.assunto||"?")+"” — "+(alvo.data_publicacao||"?")
                   +(alvo.cliente_nome?" ("+alvo.cliente_nome+")":"")
                   +"\n\nO post sai da grade. Dá para desfazer logo depois.")){
          return agExecutar({remocao:true});
        }
        agRegistrar("err", comando, "Remoção cancelada — nada foi apagado.");
        toast("Remoção cancelada.");
        return;
      }
      if(r.status===409 && d.alvo){
        // O servidor achou candidatos: redesenha o plano dele (com a pergunta) em
        // vez de inventar um diálogo aqui. A pessoa escolhe no mesmo lugar em que
        // já responde as outras perguntas.
        agEnviando=false; btn.disabled=false;
        if(d.plano){ agDesenhar(d.plano); }
        toast(d.error||"Escolha qual post.", true);
        return;
      }
      if(!r.ok || d.ok===false) throw new Error(d.error||("HTTP "+r.status));

      // Leva a grade até o post e destaca o card. A pergunta que importa depois
      // de um comando é sempre a mesma: "mexeu no post e no dia que eu quis?".
      var dt=d.post.data_publicacao;
      var y=+dt.slice(0,4), m=+dt.slice(5,7)-1;
      agPostDestaque=d.post.id;
      if(y!==view.getFullYear() || m!==view.getMonth()) view=new Date(y,m,1);
      // Se caiu em sábado/domingo com o fim de semana oculto, revela — "criado!"
      // com a grade inalterada é pior que mostrar o fim de semana sem pedir.
      var revelou=false;
      if(fimDeSemanaOculto(dt)){ showFds=true; $("#fFds").checked=true; revelou=true; }
      // Opção nova cadastrada => a lista mudou e os dropdowns precisam recarregar.
      if((d.opcoes_criadas||[]).length){ await loadListas(); populateFilters(); }
      await loadPosts();
      render();

      $("#ag-texto").value=""; agLimpar();
      // A grade mudou, então a vitrine envelheceu: o post que ela citava pode ter
      // acabado de sair, mudar de data ou de formato. Rebusca (é o único ponto em
      // que a vitrine vai à rede sem o contexto ter mudado).
      agSugestoes(0);
      var novas=(d.opcoes_criadas||[]).map(function(o){return o.nome;}).join(", ");
      // O "de onde saiu" não é enfeite: mesmo com o Desfazer ao lado, é o que diz
      // à pessoa o que exatamente mudou.
      var msg;
      if(d.acao==="mover") msg='“'+d.post.assunto+'” movido de '+agData(d.anterior.data_publicacao)+" para "+agData(dt);
      else if(d.acao==="status") msg='“'+d.post.assunto+'” agora está '+d.post.status+" (estava "+d.anterior.status+")";
      else if(d.acao==="remover") msg='“'+d.post.assunto+'” removido de '+agData(dt);
      else if(d.acao==="alterar"){
        // Diz o que mudou, campo a campo — é a conferência que importa num alterar.
        var quais=Object.keys(d.mudou||{}).map(function(k){ return agRotulo(k)+": "+d.mudou[k]; }).join(" · ");
        msg='“'+d.post.assunto+'” alterado — '+quais;
      }
      else msg="Post criado em "+dt;
      msg = msg
        +(novas?" · cadastrado nas listas: "+novas:"")
        +(revelou?" · mostrei o fim de semana para você ver o card":"")+".";

      // Desfazer no próprio toast (fase 4). É o que torna aceitável um comando que
      // apaga post: a volta tem de estar no caminho de quem acabou de agir, não
      // escondida num menu. Vale para as quatro ações — errar a data de um mover é
      // tão comum quanto errar o post de um remover.
      // O registro guarda o mesmo texto do toast. Não é duplicação inútil: o
      // toast some em 9 s e serve a quem está olhando; o registro responde
      // "o que eu já fiz nesta sessão?" cinco comandos depois — e é onde o
      // Desfazer continua alcançável depois de o toast sumir.
      agRegistrar("ok", comando, msg, d.log_id);
      if(d.log_id) toastAcao(msg, "Desfazer", agDesfazer);
      else toast(msg);
    }catch(e){
      agRegistrar("err", comando, "Não aplicou: "+e.message);
      toast("Não aplicou: "+e.message, true);
    }finally{
      agEnviando=false;
      if(agPlano) btn.disabled=false;
    }
  }

  /**
   * Reverte o último comando desta pessoa (fase 4). Não manda o que desfazer: o
   * servidor decide pelo LOG, que é a única fonte que sabe o estado anterior.
   */
  async function agDesfazer(){
    try{
      var r=await fetch(API+"/agenda/desfazer",{
        method:"POST", headers:{Accept:"application/json","Content-Type":"application/json"}, body:"{}"
      });
      var d=await r.json();
      if(!r.ok || d.ok===false) throw new Error(d.error||("HTTP "+r.status));

      // Leva a grade até o post restaurado e destaca — a pergunta depois de um
      // desfazer é "voltou para onde estava?".
      var dt=d.post && d.post.data_publicacao;
      if(dt){
        var y=+dt.slice(0,4), m=+dt.slice(5,7)-1;
        agPostDestaque=d.post.id;
        if(y!==view.getFullYear() || m!==view.getMonth()) view=new Date(y,m,1);
        if(fimDeSemanaOculto(dt)){ showFds=true; $("#fFds").checked=true; }
      }
      await loadPosts();
      render();
      var COMO={criar:"criação desfeita — o post saiu da grade", mover:"data devolvida",
                status:"status devolvido", remover:"post de volta na grade",
                alterar:"campo devolvido ao valor anterior"};
      // Risca a linha desfeita no registro e passa o botão para a anterior — que
      // é exatamente o que o servidor reverteria no próximo clique (a rota é uma
      // pilha, §6.2). A vitrine também envelheceu: o post voltou para a grade.
      agMarcarDesfeito();
      agSugestoes(0);
      toast("Desfeito: "+(COMO[d.desfeito.intencao]||d.desfeito.intencao)+".");
    }catch(e){
      toast("Não desfez: "+e.message, true);
    }
  }

  function agLimpar(){
    $("#ag-out").classList.remove("on");
    $("#ag-aplicar").style.display="none";
    // O rodapé vive no composer, fora da faixa do plano — some junto com ela, ou
    // ficaria dizendo "↵ Enter GRAVA" sobre um comando que já não existe.
    $("#ag-rodape").innerHTML="";
    agPlano=null; agUltimo=""; agResolucoes={};
    // O anel e os números pertenciam ao comando que acabou de sair de cena. Deixá-los
    // seria a grade apontando para um alvo que já não existe em lugar nenhum.
    agLimparMarcas();
    ilhaDesviou=false;
    agRenderSugestoes();   // campo vazio: a vitrine volta (do cache, sem ir à rede)
  }

  /**
   * @param texto              o comando
   * @param preservarResolucoes true quando a re-interpretação foi disparada por
   *   uma RESPOSTA (hoje: a escolha do post na fase 3). O texto é o mesmo, então
   *   as respostas continuam valendo — e é justamente para o servidor aplicá-las
   *   e devolver o plano já resolvido que se volta nele.
   */
  async function agInterpretar(texto, preservarResolucoes){
    var seq = ++agSeq;
    // Comando novo, perguntas novas: uma resolução da frase anterior pode
    // apontar para um trecho que já não existe.
    if(!preservarResolucoes) agResolucoes = {};
    agPostDestaque = null;   // o destaque pertence ao comando anterior
    try{
      var r = await fetch(API+"/agenda/interpretar",{
        method:"POST",
        headers:{Accept:"application/json","Content-Type":"application/json"},
        body:JSON.stringify({texto:texto, contexto:agContexto(), resolucoes:agResolucoes})
      });
      var d = await r.json();
      if(seq !== agSeq) return;                 // resposta velha: descarta
      if(!r.ok || d.ok===false) throw new Error(d.error||("HTTP "+r.status));
      agUi = d.ui || agUi;
      agDesenhar(d.plano);
    }catch(e){
      if(seq !== agSeq) return;
      toast("Agenda: "+e.message, true);
    }
  }

  function agAoDigitar(){
    var texto = $("#ag-texto").value.trim();
    clearTimeout(agTimer);
    ilhaSincronizar();   // a pílula cresce/encolhe junto com o campo ter conteúdo
    if(texto.length < AG_MIN){ agLimpar(); return; }
    if(texto === agUltimo) return;
    // ★ Texto novo, direito a um salto novo. O crédito é POR COMANDO: sem zerar
    // aqui, a ilha desviaria uma vez na vida; zerando a cada tecla, ela ficaria
    // saltando enquanto a pessoa digita — que é o risco anotado na maquete.
    ilhaDesviou = false;
    agTimer = setTimeout(function(){ agUltimo = texto; agInterpretar(texto); }, AG_DEBOUNCE);
  }

  function agBind(){
    $("#ag-texto").addEventListener("input", agAoDigitar);
    $("#ag-texto").addEventListener("keydown", function(e){
      if(e.key==="Enter"){
        e.preventDefault(); clearTimeout(agTimer);
        var t=$("#ag-texto").value.trim();
        if(t.length<AG_MIN) return;
        // Enter EXECUTA quando o plano na tela é deste mesmo texto. Se ainda não
        // é, só interpreta: nunca se executa um plano que a pessoa não viu — a
        // promessa dos chips, que vale ainda mais agora que criar/mover gravam.
        var pronto = agPlano && t===agUltimo;
        if(pronto && agPlano.consulta) agAplicar();
        else if(pronto && ESCREVEM[agPlano.intencao]) agExecutar();
        else { agUltimo=t; agInterpretar(t); }
      }
      if(e.key==="Escape"){ $("#ag-texto").value=""; agLimpar(); }
      // ★ Alternativa de TECLADO ao botão de canto (WCAG 2.5.7 pede um caminho
      // não-arrastável; aqui há dois). Alt evita brigar com a navegação do texto:
      // seta sozinha move o cursor, e é isso que ela tem de fazer.
      if(e.altKey && CANTO_SETA[e.key]){
        e.preventDefault();
        ilhaIrPara(CANTO_SETA[e.key][ilhaCanto]);
      }
    });

    // Foco/desfoque decidem a VITRINE — não a existência da ilha, que não fecha.
    $("#ag-texto").addEventListener("focus", function(){
      ilhaFocada = true;
      ilhaSincronizar();
      // Ao focar, a vitrine tem de falar do que está na grade AGORA. Só vai à rede
      // se o contexto mudou desde a última busca (mesma régua de agSugestoesSeMudou).
      if(!agSugCache.length) agSugestoes(0); else ilhaSincronizar();
    });
    // `focusout` no ASIDE, não `blur` no input: clicar numa sugestão, num botão de
    // pergunta ou no selo tira o foco do campo sem sair da ilha, e recolher ali
    // fecharia a vitrine debaixo do dedo de quem ia clicar nela.
    $("#ilha").addEventListener("focusout", function(){
      setTimeout(function(){
        if($("#ilha").contains(document.activeElement)) return;
        ilhaFocada = false;
        ilhaSincronizar();
      }, 0);
    });
    $("#ag-aplicar").onclick=function(){
      if(!agPlano) return;
      if(agPlano.consulta) agAplicar(); else agExecutar();
    };
    // Limpar zera o COMANDO, não o filtro já aplicado: o filtro sobrevive ao
    // texto de propósito (é o resultado, não o rascunho).
    $("#ag-limpar").onclick=function(){ $("#ag-texto").value=""; agLimpar(); $("#ag-texto").focus(); };

    // Selo: abre/fecha o REGISTRO da sessão. Ao abrir, rola até o fim — enquanto
    // escondido o elemento tem scrollHeight 0, então o scroll que agRenderHistorico
    // fez a cada comando não pegou e o registro abriria na primeira linha.
    $("#ilha-selo").onclick=function(){
      ilhaLogAberto=!ilhaLogAberto;
      ilhaSincronizar();
      if(ilhaLogAberto){ var c=$("#cop-corpo"); c.scrollTop=c.scrollHeight; }
    };
    // Desfazer na pílula: mesma rota e mesma pilha do botão do toast e do registro.
    $("#ilha-desfazer").onclick=agDesfazer;
    $("#ilha-canto").onclick=ilhaGirarCanto;

    ilhaSincronizar();
    agRenderHistorico();
  }

  async function init(){
    renderLegend(); bind(); agBind();
    await loadMe();
    await loadListas(); populateFilters();
    await loadPosts(); render();
  }
  init();
})();
</script>
</body>
</html>
