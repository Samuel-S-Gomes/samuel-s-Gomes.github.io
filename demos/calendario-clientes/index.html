<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Calendário de Clientes · Agenda Inteligente · Vetor (demo)</title>
<link rel="icon" href="brand/favicon.png" />
<script src="agenda/nucleo.js"></script>
<script src="mock-api.js"></script>
<style>
  :root{
    --azul:#0f9d6e; --azul-esc:#0b7a56; --ambar:#de8d13; --cinza:#777777;
    --bg:#f4f6f9; --card:#ffffff; --texto:#1f2733; --muted:#6b7683;
    --borda:#e4e8ee; --verde:#1a9e5f; --vermelho:#d4433a; --roxo:#7c3aed;
    --sombra:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
    --sombra-md:0 4px 16px rgba(16,24,40,.08);
    --radius:14px;
    /* cores por formato */
    --fmt-feed:#0072ce; --fmt-unico:#7c3aed; --fmt-carrossel:#de8d13;
    --fmt-reels:#d4433a; --fmt-stories:#1a9e5f;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--texto); line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--azul)}
  .wrap{max-width:1300px;margin:0 auto;padding:20px 20px 64px}
  header.top{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:16px 0 20px;border-bottom:1px solid var(--borda);margin-bottom:20px;
  }
  header.top img{height:34px;width:auto}
  .title h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.2px}
  .title p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .spacer{flex:1}
  select,button,input,textarea{font-family:inherit;font-size:14px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
  select,input,textarea{
    background:var(--card);color:var(--texto);border:1px solid var(--borda);
    border-radius:9px;padding:8px 11px;outline:none;
  }
  select:focus,input:focus,textarea:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(15,157,110,.15)}
  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;
    background:var(--azul);color:#fff;border-radius:9px;padding:9px 15px;
    font-weight:600;cursor:pointer;transition:background .15s,transform .05s;
  }
  .btn:hover{background:var(--azul-esc)} .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--texto);border-color:var(--borda)}
  .btn.ghost:hover{background:rgba(15,157,110,.07)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.danger{background:var(--vermelho)} .btn.danger:hover{filter:brightness(.92)}

  /* ---- Barra de controles ---- */
  .toolbar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .monthnav{display:flex;align-items:center;gap:10px}
  .monthnav .mlabel{font-size:17px;font-weight:700;min-width:170px;text-align:center;text-transform:capitalize}
  .navbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--borda);background:var(--card);cursor:pointer;font-size:16px;line-height:1}
  .navbtn:hover{background:rgba(15,157,110,.07)}
  /* ---- Multi-Select Dropdown (filtros Clientes e Redes) ---- */
  .msdd{position:relative;display:inline-block}
  .msdd-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:190px;
    background:var(--card);color:var(--texto);border:1px solid var(--borda);border-radius:9px;
    padding:8px 11px;cursor:pointer;font-size:14px;text-align:left}
  .msdd-btn:hover{border-color:var(--azul)}
  .msdd.open .msdd-btn{border-color:var(--azul);box-shadow:0 0 0 3px rgba(15,157,110,.15)}
  .msdd-caret{color:var(--muted);font-size:11px;transition:transform .15s}
  .msdd.open .msdd-caret{transform:rotate(180deg)}
  .msdd-panel{position:absolute;top:calc(100% + 5px);left:0;z-index:45;min-width:100%;
    background:var(--card);border:1px solid var(--borda);border-radius:10px;box-shadow:var(--sombra-md);
    padding:6px;display:none;max-height:300px;overflow:auto}
  .msdd.open .msdd-panel{display:block}
  .msdd-opt{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;cursor:pointer;
    font-size:13px;color:var(--texto);white-space:nowrap;user-select:none}
  .msdd-opt:hover{background:rgba(15,157,110,.07)}
  .msdd-opt input{width:auto;margin:0;flex:none}
  .msdd-opt.all{border-bottom:1px solid var(--borda);border-radius:0;margin-bottom:4px;font-weight:600}
  .switch{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .switch input{width:auto}

  /* ---- Legenda ---- */
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;color:var(--muted)}
  .legend .item{display:inline-flex;align-items:center;gap:6px}
  .legend .dot{width:12px;height:12px;border-radius:3px}

  /* ---- Grade ---- */
  .cal{background:var(--card);border:1px solid var(--borda);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sombra)}
  .cal .dow{display:grid;background:#fafbfc;border-bottom:1px solid var(--borda)}
  .cal .dow div{padding:9px 10px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;text-align:left}
  .cal .weeks{display:grid}
  .week{display:grid;border-bottom:1px solid var(--borda)}
  .week:last-child{border-bottom:none}
  .day{min-height:118px;border-right:1px solid var(--borda);padding:6px 6px 8px;position:relative;overflow:hidden}
  .day:last-child{border-right:none}
  .day.out{background:#fafbfc}
  .day .dn{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .day.today .dn{color:var(--azul)}
  .day.today .dn span{background:var(--azul);color:#fff;border-radius:50%;padding:1px 6px}
  .addday{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:6px;border:1px dashed var(--borda);background:transparent;color:var(--muted);cursor:pointer;line-height:1;font-size:14px;display:none}
  .day:hover .addday{display:inline-flex;align-items:center;justify-content:center}

  /* ---- Chip de post ---- */
  .chip{position:relative;display:block;width:100%;text-align:left;border:none;border-left:4px solid var(--cinza);
        background:#f2f4f7;border-radius:6px;padding:4px 7px 4px 9px;margin-bottom:4px;cursor:pointer;font-size:12px;line-height:1.3;color:var(--texto)}
  .chip:hover{filter:brightness(.97)}
  .chip .assunto{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip .meta{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.pub{opacity:.5;padding-left:32px}
  .chip:hover{padding-left:32px}
  .chip .imp{color:var(--ambar);font-weight:700}
  /* checkmark de status (aparece no hover) */
  .chip .ck{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;
            border:1.5px solid var(--verde);background:var(--card);color:var(--verde);display:none;align-items:center;
            justify-content:center;font-size:11px;cursor:pointer;padding:0;line-height:1}
  .chip:hover .ck{display:inline-flex}
  .chip.pub .ck{display:inline-flex;background:var(--verde);color:#fff}

  /* ---- Modal ---- */
  .modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .modal-bg.open{display:flex}
  .modal{background:var(--card);border-radius:16px;box-shadow:var(--sombra-md);width:100%;max-width:560px;max-height:92vh;overflow:auto}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--borda);display:flex;justify-content:space-between;align-items:center}
  .modal-head h3{margin:0;font-size:16px}
  .close-x{border:none;background:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
  .modal-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .modal-body .full{grid-column:1/-1}
  .modal-body label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
  .modal-body input,.modal-body textarea,.modal-body select{width:100%}
  .redepicker{display:flex;gap:6px;flex-wrap:wrap}
  .redepicker label{display:inline-flex;align-items:center;gap:5px;font-weight:500;color:var(--texto);margin:0;cursor:pointer}
  .redepicker input{width:auto}
  .modal-foot{padding:16px 20px;border-top:1px solid var(--borda);display:flex;justify-content:space-between;gap:10px;align-items:center}
  .err{color:var(--vermelho);font-size:13px}

  /* ---- Gerenciar listas ---- */
  .tabs{display:flex;gap:6px;padding:14px 20px 0;flex-wrap:wrap}
  .tab{padding:7px 12px;border-radius:9px 9px 0 0;border:1px solid var(--borda);border-bottom:none;background:#fafbfc;cursor:pointer;font-size:13px}
  .tab.on{background:var(--card);font-weight:700}
  .listbox{padding:16px 20px}
  .listadd{display:flex;gap:8px;margin-bottom:12px}
  .listadd input{flex:1}
  .litem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--borda)}
  .litem .nome{flex:1}
  .litem.off .nome{color:var(--muted);text-decoration:line-through}
  .minibtn{border:1px solid var(--borda);background:var(--card);border-radius:7px;padding:4px 8px;cursor:pointer;font-size:12px}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--texto);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--vermelho);color:#fff}
  /* Toast com ação (Desfazer, fase 4). `pointer-events` volta a ser auto só
     quando o toast está visível — no #toast ele é `none` para não interceptar
     cliques na grade enquanto está escondido. */
  #toast.show{pointer-events:auto}
  .toast-acao{margin-left:10px;background:transparent;border:1px solid currentColor;color:inherit;
    border-radius:7px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer}
  .toast-acao:hover{background:rgba(255,255,255,.16)}
  .empty{padding:40px;text-align:center;color:var(--muted)}

  /* ==========================================================================
     AGENDA INTELIGENTE (v2) — barra de comando + chips de interpretação ao vivo
     ========================================================================== */
  /* --------------------------------------------------------------------------
     ★ MEDIDAS DA ILHA — o que se ajusta ao revisar o layout mora AQUI.
     -------------------------------------------------------------------------- */
  :root{
    --ilha-rep:330px;    /* largura em REPOUSO — a pílula, só o campo de comando */
    --ilha-w:390px;      /* largura quando cresce (vitrine, plano, perguntas) */
    --ilha-marg:18px;    /* folga entre a ilha e as bordas da tela */
  }

  /* ==========================================================================
     ★ A ILHA ADAPTATIVA — terceira volta do layout (decisão do usuário, 2026-08-25)
     ==========================================================================
     A grade voltou a ser a página inteira: `.wrap` centrada em 1300px, sem shell,
     sem coluna reservada e sem `padding-right` calculado. A Agenda deixou de ser
     MÓVEL (um dock de 380px sempre presente) e virou MOMENTO: uma pílula
     flutuante de ~330×42 num canto, que cresce só o que o conteúdo exige.

     O que isso resolve e o dock do §8.6 não resolvia — a patologia está registrada
     lá: *o painel cresce justamente quando há algo a decidir, cobrindo a grade que
     a pessoa precisa olhar para decidir*. O dock TOLERAVA a colisão; a ilha DESVIA
     dela (ver `ilhaDesviar` no JS).

     ★ TRÊS SIMPLIFICAÇÕES CONCRETAS, não só um arranjo diferente:
       1. A reserva de 294px em `calc()` nas barras acima da grade MORREU. Ela
          existia porque o dock passava por cima de Portal / Minha conta /
          + Novo post / Gerenciar listas. A ilha mora num canto e nasce no
          INFERIOR: não alcança nenhum desses controles, e não há o que reservar.
       2. O grid `.shell` de duas colunas e o `@media (min-width:1700px)` que
          alternava entre "margem" e "sobreposto" morreram com ele.
       3. A grade fica com os mesmos 1260px em TODA largura e em TODO estado —
          antes isso só valia a partir de 1700px (modo margem) ou com o painel
          fechado.

     O custo em repouso é quase zero: a pílula cobre um pedaço de um cartão no
     canto — e é justamente esse pedaço que a anticolisão devolve quando o cartão
     em questão é o alvo do comando.
     ========================================================================== */

  /* --------------------------------------------------------------------------
     A ILHA. Não é um chat: é comando + interpretação + ação. A anatomia de chat
     que o dock emprestava (registro em cima, composer embaixo) continua aqui, só
     que **por demanda**: em repouso existe apenas o composer, e o registro/vitrine
     e a faixa do plano entram acima dele conforme fazem falta.

     ★ NÃO É ARRASTÁVEL — mantém a decisão do §8.6 (WCAG 2.5.7 exige alternativa
     não-arrastável; posição livre não sobrevive à troca de resolução; e só há
     quatro lugares úteis). Troca-se de canto pelo botão ou por Alt+seta.
     -------------------------------------------------------------------------- */
  .ilha{position:fixed;z-index:48;
    width:min(var(--ilha-rep), calc(100vw - var(--ilha-marg) * 2));
    max-height:calc(100dvh - var(--ilha-marg) * 2);
    display:flex;flex-direction:column;
    /* ★ FUNDO SÓLIDO, não translúcido (pergunta aberta nº 3 do §8.8). Translucidez
       em repouso custa legibilidade justamente onde a ilha mora: por cima dos
       cartões, que são COLORIDOS por formato. O que ela ganharia em leveza, o
       campo de comando perderia em contraste — e o campo é o que tem de estar
       legível sempre. A separação da grade fica por conta da sombra. */
    background:var(--card);
    border:1px solid var(--borda);border-radius:16px;overflow:hidden;
    box-shadow:0 10px 30px rgba(16,24,40,.15);
    /* A transição de canto É o rastro: o olho segue o movimento. Um fantasma
       deixado no canto antigo seria sujeira permanente para um ganho de um
       instante. */
    transition:width .18s ease, left .26s ease, right .26s ease,
               top .26s ease, bottom .26s ease}

  /* Cresce só o que o conteúdo exige — nunca em repouso. */
  .ilha.cresceu{width:min(var(--ilha-w), calc(100vw - var(--ilha-marg) * 2))}

  /* Os QUATRO cantos. b/c = baixo/cima · d/e = direita/esquerda. */
  .ilha[data-canto="bd"]{right:var(--ilha-marg);bottom:var(--ilha-marg);left:auto;top:auto}
  .ilha[data-canto="be"]{left:var(--ilha-marg);bottom:var(--ilha-marg);right:auto;top:auto}
  .ilha[data-canto="cd"]{right:var(--ilha-marg);top:var(--ilha-marg);left:auto;bottom:auto}
  .ilha[data-canto="ce"]{left:var(--ilha-marg);top:var(--ilha-marg);right:auto;bottom:auto}

  /* ★ O CAMPO DE COMANDO NÃO SE MOVE quando a ilha cresce.
     Nos cantos de BAIXO a âncora é o `bottom`: o conteúdo que entra acima do
     composer empurra o TOPO para cima e o campo fica parado. Nos cantos de CIMA a
     âncora é o `top` — sem inverter a ordem visual, o mesmo conteúdo empurraria o
     campo para BAIXO e o cursor fugiria do lugar onde a pessoa acabou de clicar.
     `column-reverse` resolve sem duplicar HTML: o composer passa a ser o primeiro
     de cima para baixo e o crescimento desce. */
  .ilha[data-canto^="c"]{flex-direction:column-reverse}
  /* Consequência: as duas linhas separadoras trocam de dono. Na ordem normal
     (corpo · plano · composer) elas são o `border-top` do plano e do composer; na
     invertida (composer · plano · corpo) o `border-top` do plano continua certo —
     é a linha entre ele e o composer — mas a do composer viraria um risco solto no
     topo da ilha, e a que falta é a de cima do corpo. */
  .ilha[data-canto^="c"] .cop-composer{border-top:none}
  .ilha[data-canto^="c"] .cop-corpo{border-top:1px solid var(--borda)}

  /* Faixa rolável: registro da sessão + vitrine de sugestões. Em repouso não
     existe — entra ao focar (vitrine) ou ao abrir o registro pelo selo. */
  .cop-corpo{display:none;flex:1 1 auto;min-height:0;overflow-y:auto;padding:11px 12px;
    flex-direction:column;gap:12px}
  .ilha.vitrine .cop-corpo,
  .ilha.log-aberto .cop-corpo{display:flex}

  /* Faixa do PLANO — chips, perguntas e avisos. Tem rolagem própria e teto de
     altura para nunca engolir o registro nem empurrar o composer para fora da
     tela quando o comando tem muitas perguntas. */
  .cop-plano{flex:0 1 auto;display:none;border-top:1px solid var(--borda);
    padding:11px 13px;max-height:44vh;overflow-y:auto;background:#fbfcfe}
  .cop-plano.on{display:block}

  /* Composer — É A ILHA EM REPOUSO: sozinho, ele é a pílula. E é SÓ a linha do
     campo, de altura fixa.

     ★ POR QUE os botões e o rodapé saíram daqui (bloco `.cop-acoes`, abaixo):
     eles nascem quando aparece um comando. Estando DENTRO do composer, e o
     composer ancorado pelo `bottom` nos cantos de baixo, o campo subia ~69px no
     instante em que a pessoa terminava de digitar — medido. É o deslocamento
     clássico: o ponteiro fica onde o campo estava e passa a pairar sobre um botão
     recém-nascido. Fora do composer, eles crescem para o lado de fora e a linha do
     campo fica pinada nos QUATRO cantos. O dock do §8.6 tinha o mesmo defeito;
     aqui ele dói mais, porque não mover o que a pessoa está usando é o motivo de a
     ilha existir. */
  .cop-composer{flex:none;border-top:1px solid var(--borda);padding:8px 9px}
  .ilha.com-texto .cop-composer{border-top:none}
  .cop-linha{display:flex;gap:6px;align-items:center}
  .cop-linha input{flex:1 1 auto;min-width:0;font-size:14px;padding:7px 10px;border-radius:10px}

  /* Ações do comando: os botões e o rodapé que diz se o Enter grava. Ficam FORA
     da faixa do plano (que tem rolagem própria) para nunca rolarem para fora de
     vista — é a exigência do §8.2, e ela continua valendo: a frase "↵ Enter GRAVA"
     não pode faltar na hora em que o dedo já está na tecla. */
  .cop-acoes{flex:none;display:none;border-top:1px solid var(--borda);padding:9px 10px}
  .ilha.com-texto .cop-acoes{display:block}

  /* ★ A ilha NÃO FECHA — ela repousa (pergunta aberta nº 5 do §8.8). Sendo do
     tamanho de um campo de texto, esconder e reabrir custaria mais do que
     economiza, e a FAB do §8.6 (que existia porque o dock desaparecia por
     inteiro) morreu junto: um elemento a menos na tela e um estado a menos para
     lembrar. Quando a pílula incomoda onde está, a resposta é trocar de canto —
     e quando ela incomoda em cima do ALVO, quem troca é a anticolisão, sozinha. */
  /* Marca da ilha: vetor no lugar do emoji (o usuário achou o emoji ruim). Um
     sparkle de 4 pontas — mesmo desenho usado por vários indicadores de
     "assistente" — em CINZA (`--cinza`, não `--muted`, que aqui é azulado), para
     ficar neutro perto do azul da marca em vez de competir com ele. */
  .ilha-mark{flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:15px;height:15px;margin-left:2px;color:var(--cinza)}
  .ilha-mark svg{width:100%;height:100%;display:block}
  .ilha-btn{flex:none;border:1px solid var(--borda);background:var(--card);color:var(--muted);
    border-radius:9px;min-width:27px;height:29px;padding:0 6px;font-size:11.5px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;font-weight:700;line-height:1}
  .ilha-btn:hover{border-color:var(--azul);color:var(--azul)}
  .ilha-btn[hidden]{display:none}
  /* ★ O Desfazer fica FORA do selo, no corpo da pílula. A regra do §8.4 é que a
     rede de segurança tem de estar no caminho de quem acabou de agir — atrás de um
     clique no registro ela viraria exatamente o "menu" que a fase 4.1 recusou.
     Continua sendo UM botão só (a rota é uma pilha, §6.2) e o toast segue com o
     dele; isto é o que sobra quando o toast some. */
  .ilha-btn.desfazer{border-color:rgba(15,157,110,.45);color:var(--azul)}
  .ilha-btn.selo[aria-expanded="true"]{border-color:var(--azul);color:var(--azul);
    background:rgba(15,157,110,.07)}

  /* Quem decide se os botões existem é `.cop-acoes` (só com comando escrito): em
     repouso um "Limpar" sobre campo vazio seria móvel sem função. */
  .cop-botoes{display:flex;gap:7px}
  .cop-botoes .btn{flex:1 1 auto;justify-content:center;padding:8px 12px}

  /* ---- Registro da sessão ----------------------------------------------------
     Some no F5, de propósito (decisão do usuário): é memória de trabalho, não
     histórico. O log de verdade continua no D1 desde a fase 4.1, para auditoria.
     -------------------------------------------------------------------------- */
  .cop-hist{display:flex;flex-direction:column;gap:8px}
  .hist-item{border:1px solid var(--borda);border-radius:11px;padding:8px 10px;background:#fbfcfe}
  .hist-item .cmd{font-size:12.5px;font-weight:600;line-height:1.35}
  .hist-item .res{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .hist-item.ok{border-left:3px solid var(--verde)}
  .hist-item.consulta{border-left:3px solid var(--azul)}
  .hist-item.err{border-left:3px solid var(--vermelho)}
  .hist-item.err .res{color:#a3302a}
  .hist-item.desfeito{opacity:.55}
  .hist-item.desfeito .cmd{text-decoration:line-through}
  .hist-desfazer{margin-top:6px;border:1px solid var(--borda);background:var(--card);
    color:var(--texto);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:600}
  .hist-desfazer:hover{border-color:var(--azul);color:var(--azul)}
  .cop-vazio{font-size:12.5px;color:var(--muted);line-height:1.5}

  /* ---- Vitrine de sugestões --------------------------------------------------
     Vêm do servidor JÁ VERIFICADAS (GET …/agenda/sugestoes): o que aparece aqui
     executa. Clicar PREENCHE o campo — nunca executa —, inclusive a de remover.
     -------------------------------------------------------------------------- */
  .cop-sug{display:flex;flex-direction:column;gap:6px}
  .cop-sug .cab{display:flex;align-items:center;gap:8px;
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .cop-sug .girar{margin-left:auto;border:1px solid var(--borda);background:var(--card);
    color:var(--muted);border-radius:20px;padding:3px 9px;font-size:11px;cursor:pointer;
    text-transform:none;letter-spacing:0;font-weight:600}
  .cop-sug .girar:hover{border-color:var(--azul);color:var(--azul)}
  .cop-sug button.sug{display:block;width:100%;text-align:left;cursor:pointer;
    border:1px dashed var(--borda);background:transparent;color:var(--texto);
    border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.35}
  .cop-sug button.sug:hover{border-color:var(--azul);background:rgba(15,157,110,.05)}
  .cop-sug button.sug .verbo{display:block;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:2px}
  .cop-sug button.sug.perigo{border-color:rgba(212,67,58,.4)}
  .cop-sug button.sug.perigo .verbo{color:#a3302a}
  .cop-sug button.sug.perigo:hover{border-color:var(--vermelho);background:rgba(212,67,58,.05)}

  .agenda-linha{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .intencao{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
  .medidor{height:6px;width:96px;background:#eef1f5;border-radius:99px;overflow:hidden}
  .medidor i{display:block;height:100%;width:0;background:var(--verde);transition:width .2s,background .2s}
  .medidor.media i{background:var(--ambar)} .medidor.baixa i{background:var(--vermelho)}
  .conf{font-size:12px;color:var(--muted)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  /* Um chip = um campo interpretado. Verde = certeza; âmbar = conferir;
     tracejado = pergunta em aberto. */
  .cchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.2;
    background:#f2f6fb;border:1px solid #d9e4f0;color:var(--texto);
    border-radius:20px;padding:5px 11px}
  .cchip b{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .cchip.ok{background:rgba(26,158,95,.09);border-color:rgba(26,158,95,.32)}
  .cchip.conferir{background:rgba(222,141,19,.11);border-color:rgba(222,141,19,.38)}
  .cchip.pergunta{background:transparent;border-style:dashed;border-color:var(--ambar);color:#8a5a06}
  .cchip.falta{background:rgba(212,67,58,.08);border-color:rgba(212,67,58,.35);color:#a3302a}
  /* Chip de MUDANÇA (fase 4.2): valor NOVO de um alterar. Azul da marca + borda
     cheia para se distinguir à primeira vista dos chips de critério, que são o
     que a busca usou. Os dois podem ser do mesmo campo na mesma frase. */
  .cchip.muda{background:rgba(15,157,110,.10);border-color:rgba(15,157,110,.42);color:#0b6b4d;font-weight:600}
  .cchip .x{cursor:pointer;color:var(--muted);font-weight:700;padding:0 1px;
    background:transparent;border:0;font-size:15px;line-height:1;border-radius:50%}
  .cchip .x:hover{color:var(--vermelho)}
  .cchip .x:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
  .agenda-perguntas{margin-top:8px;display:flex;flex-direction:column;gap:7px}
  .pergunta{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pergunta .opt{border:1px solid var(--borda);background:var(--card);border-radius:20px;
    padding:4px 11px;font-size:12.5px;cursor:pointer}
  .pergunta .opt:hover{border-color:var(--azul);background:rgba(15,157,110,.06)}
  /* Rodapé do composer: "não interpretado" + se o Enter grava. `:empty` porque em
     repouso ele é a diferença entre uma pílula e uma pílula com uma sobra de 8px. */
  .agenda-rodape{margin-top:8px;font-size:11.5px;color:var(--muted);
    display:flex;flex-direction:column;gap:3px;line-height:1.4}
  .agenda-rodape:empty{display:none}
  .agenda-rodape .resto{color:#a3302a}
  .agenda-rodape .grava{color:#a06407;font-weight:600}
  .agenda-aviso{margin-top:10px;font-size:12px;background:rgba(222,141,19,.09);
    border-left:3px solid var(--ambar);padding:8px 11px;border-radius:0 7px 7px 0;color:#7a5205}

  /* Card que o último comando da Agenda criou (fase 2) ou alterou (fase 3):
     pulsa duas vezes para responder "mexeu no post e no dia que eu quis?" sem a
     pessoa ter que procurar na grade. */
  @keyframes agNovo{
    0%{box-shadow:0 0 0 0 rgba(15,157,110,.5)}
    100%{box-shadow:0 0 0 13px rgba(15,157,110,0)}
  }
  .chip.novo{animation:agNovo 1.05s ease-out 2}
  @media (prefers-reduced-motion:reduce){
    .chip.novo{animation:none;outline:2px solid var(--azul);outline-offset:1px}
  }

  /* ---- O COMANDO NA GRADE (enxerto do prato 02 do estudo, §8.8) --------------
     O chip "Post encontrado" descreve em TEXTO um post que a grade pode MOSTRAR.
     Anel azul = o alvo resolvido. Números âmbar ① ② ③ = os candidatos, quando a
     Agenda precisa perguntar qual é — e clicar no cartão RESPONDE a pergunta, no
     lugar onde a decisão de verdade se toma: olhando os posts no mês, não uma
     lista de títulos parecidos dentro do painel.

     ★ Não substitui a lista de texto, soma a ela: o candidato pode estar em OUTRO
     mês, e aí não há cartão nenhum para marcar.

     ★ Anel por `box-shadow inset`, não por `outline`: `.day` tem `overflow:hidden`
     e recorta o que passa da borda da célula. Inset nunca sai do cartão. */
  .chip.alvo{box-shadow:inset 0 0 0 2px var(--azul)}
  .chip.cand{box-shadow:inset 0 0 0 2px var(--ambar);cursor:pointer}
  .chip .num{position:absolute;right:4px;top:4px;min-width:17px;height:17px;
    border-radius:50%;background:var(--ambar);color:#fff;font-size:10.5px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;padding:0 3px}
  .chip.alvo .num{background:var(--azul)}

  /* Barra de FILTRO ATIVO (fase 1) — o que a grade está mostrando agora.
     Some quando não há filtro nenhum. Cada critério é um chip removível, para
     desfazer uma dimensão sem ter que reescrever o comando. */
  .agfiltro{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;
    background:rgba(15,157,110,.05);border:1px solid rgba(15,157,110,.22);
    border-radius:var(--radius);padding:9px 12px}
  .agfiltro.on{display:flex}
  .agfiltro .rot{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    color:var(--azul)}
  .agfiltro .vazio{font-size:12.5px;color:var(--muted)}
  .agfiltro .limpar{margin-left:auto;border:1px solid var(--borda);background:var(--card);
    color:var(--muted);border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer}
  .agfiltro .limpar:hover{border-color:var(--vermelho);color:var(--vermelho)}
  /* ==========================================================================
     CELULAR — a ilha vira BARRA INFERIOR (pergunta aberta nº 6 do §8.8)
     ==========================================================================
     Em 375px não existem "quatro cantos": qualquer canto é a tela toda. Então a
     ilha larga a geometria de canto e vira uma barra colada embaixo, de largura
     cheia, e o botão de trocar de canto desaparece com ela — junto com a
     anticolisão, desligada no JS pelo mesmo motivo (não há para onde desviar).

     ★ A fórmula de reserva do §8.6 NÃO foi herdada porque ela morreu inteira: a
     ilha não passa por cima de controle nenhum. O que precisa de reserva aqui é
     só o FIM da página — senão a barra cobre a última semana da grade.

     ★ Especificidade: as regras de canto acima são `.ilha[data-canto="xx"]`
     (classe + atributo). Para vencê-las é preciso empatar e vir depois, e é o que
     `.ilha[data-canto]` faz — dentro do media query e mais abaixo no arquivo.
     Um `.ilha` seco perderia em silêncio.
     ========================================================================== */
  @media (max-width:700px){
    .ilha[data-canto]{
      left:8px;right:8px;bottom:8px;top:auto;
      width:auto;max-width:none;max-height:calc(100dvh - 16px);
      border-radius:14px;
      /* Barra: sem inversão de ordem, o crescimento é sempre para cima. */
      flex-direction:column}
    .ilha[data-canto].cresceu{width:auto}
    /* Desfaz a troca de separadores dos cantos de cima (aqui não há cantos) —
       mas sem ressuscitar a linha dupla logo acima do campo quando as ações estão
       na tela: `.cop-acoes` já traz a sua. */
    .ilha[data-canto] .cop-composer{border-top:1px solid var(--borda)}
    .ilha[data-canto].com-texto .cop-composer{border-top:none}
    .ilha[data-canto] .cop-corpo{border-top:none}
    .ilha-btn.canto{display:none}
    /* A barra come o pé da página: a última semana precisa de onde aparecer, e o
       toast não pode nascer debaixo dela. */
    .wrap{padding-bottom:112px}
    #toast{bottom:98px}
    .cop-botoes{flex-wrap:wrap}
    .agfiltro .limpar{margin-left:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--azul)">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--azul);color:#fff;font-size:15px;font-weight:800">V</span>
      vetor
    </div>
    <div class="title">
      <h1>Calendário de Clientes <span style="font-size:12px;color:var(--muted);font-weight:600">v2</span></h1>
      <p>Planejamento editorial de posts por marca · com <strong>Agenda Inteligente</strong>.</p>
    </div>
    <div class="spacer"></div>
    <a class="btn ghost sm" href="../../projetos.html" target="_top">← Portfólio</a>
  </header>
  <!-- A grade é a página inteira: a Agenda não é mais uma coluna do layout, é uma
       ilha flutuante fora da `.wrap` (ver o fim do arquivo). -->
  <main>
  <!-- Controles -->
  <div class="toolbar">
    <div class="monthnav">
      <button class="navbtn" id="prev" aria-label="Mês anterior">‹</button>
      <div class="mlabel" id="mlabel">—</div>
      <button class="navbtn" id="next" aria-label="Próximo mês">›</button>
      <button class="btn ghost sm" id="hoje">Hoje</button>
    </div>
    <div class="field">
      <label>Clientes</label>
      <div id="ddClientes"></div>
    </div>
    <div class="field">
      <label>Redes</label>
      <div id="ddRedes"></div>
    </div>
    <div class="spacer"></div>
    <label class="switch"><input type="checkbox" id="fFds" /> Mostrar fins de semana</label>
    <button class="btn ghost sm" id="btnListas" style="display:none">Gerenciar listas</button>
    <button class="btn" id="btnNovo" style="display:none">+ Novo post</button>
  </div>

  <!-- Filtro ativo (fase 1): espelha os dropdowns + as dimensões que só a
       Agenda aplica (formato, status, pilar, público, objetivo, período…).
       ★ Fica na GRADE, fora da ilha, de propósito: é o resumo do que a grade
       está mostrando e reflete também o que foi mexido nos dropdowns. Dentro do
       painel ele sumiria quando o painel fechasse — e aí a grade filtraria sem
       explicar por quê. -->
  <div class="agfiltro" id="ag-filtro"></div>

  <!-- Legenda -->
  <div class="legend" id="legend"></div>

  <!-- Grade -->
  <div class="cal">
    <div class="dow" id="dow"></div>
    <div class="weeks" id="weeks"></div>
  </div>
  </main>
</div>

<!-- ======================================================================
     A ILHA ADAPTATIVA — a Agenda Inteligente (§8.8 do doc). As SEIS intenções
     executam: CONSULTAR filtra a grade (não escreve); CRIAR, MOVER, TROCAR
     STATUS, ALTERAR e REMOVER gravam. Nos comandos sobre post existente o chip
     "Post encontrado" diz em QUAL post o comando vai mexer — e agora a GRADE
     também diz, com um anel no cartão; com mais de um candidato, a Agenda
     pergunta e numera ① ② ③ os cartões. Em ALTERAR, o "para" separa: antes dele
     os critérios (chips normais), depois o valor novo (chips azuis com seta).
     Remover pede confirmação nomeando o post, e todo comando que grava oferece
     Desfazer.

     ► FORA da `.wrap`, de propósito: ela é `position:fixed` e não participa mais
       do fluxo da página. A grade voltou a ser a página inteira.

     ► NÃO É UM CHAT, e a diferença é deliberada. Chat promete vocabulário
       aberto, turnos e memória; isto é um parser determinístico de vocabulário
       fechado (§2 do doc). A anatomia de chat continua emprestada — registro em
       cima, composer embaixo —, mas agora POR DEMANDA: em repouso existe só o
       campo, e o que entra acima dele é o PLANO ao vivo, que nenhum chat tem e é
       a decisão de produto central (§1).

     ► A ORDEM DO DOM É [corpo · plano · composer] e isso importa: nos cantos de
       cima o CSS a inverte com `column-reverse` para o campo não fugir do dedo.
     ====================================================================== -->
<aside class="ilha" id="ilha" data-canto="bd" aria-label="Agenda Inteligente">

  <!-- Faixa rolável: registro da sessão OU vitrine de sugestões verificadas.
       Em repouso não existe — entra ao focar o campo (vitrine, que é o momento em
       que a pessoa precisa saber o que dizer) ou ao abrir o registro pelo selo. -->
  <div class="cop-corpo" id="cop-corpo">
    <div class="cop-hist" id="cop-hist"></div>
    <div class="cop-sug" id="cop-sug" hidden></div>
  </div>

  <!-- Faixa do PLANO — só aparece quando há algo digitado. -->
  <div class="cop-plano" id="ag-out">
    <div class="agenda-linha">
      <span class="intencao" id="ag-intencao">—</span>
      <span class="medidor" id="ag-medidor"><i></i></span>
      <span class="conf" id="ag-conf"></span>
    </div>
    <div class="chips" id="ag-chips"></div>
    <div class="agenda-perguntas" id="ag-perguntas"></div>
    <div id="ag-avisos"></div>
  </div>

  <!-- Ações do comando: botões + o rodapé que avisa se o Enter grava. FORA do
       composer de propósito — dentro dele, nascer empurrava a linha do campo para
       cima nos cantos de baixo (~69px medidos). E fora da faixa do plano, que tem
       rolagem própria: o rodapé não pode rolar para fora de vista (§8.2). -->
  <div class="cop-acoes">
    <div class="cop-botoes">
      <button class="btn" id="ag-aplicar" type="button" style="display:none">Filtrar a grade</button>
      <button class="btn ghost" id="ag-limpar" type="button">Limpar</button>
    </div>
    <div class="agenda-rodape" id="ag-rodape"></div>
  </div>

  <!-- Composer. Sozinho, ELE É A ILHA em repouso — e é só a linha do campo, de
       altura fixa, para o cursor nunca fugir de onde a pessoa clicou. -->
  <div class="cop-composer">
    <div class="cop-linha">
      <span class="ilha-mark" title="Agenda Inteligente" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C12 6.627 17.373 12 24 12C17.373 12 12 17.373 12 24C12 17.373 6.627 12 0 12C6.627 12 12 6.627 12 0Z"/>
        </svg>
      </span>
      <input id="ag-texto" autocomplete="off" spellcheck="false"
             aria-label="Comando da Agenda Inteligente"
             placeholder="Escreva um comando…" />
      <!-- Desfazer FORA do selo: a rede de segurança não pode ficar atrás de um
           clique (§8.4). Um botão só — a rota é uma pilha (§6.2). -->
      <button class="ilha-btn desfazer" id="ilha-desfazer" type="button" hidden
              title="Desfazer o último comando">&#8630;</button>
      <button class="ilha-btn selo" id="ilha-selo" type="button" hidden
              aria-expanded="false" aria-controls="cop-hist">&#9776;</button>
      <button class="ilha-btn canto" id="ilha-canto" type="button">&#8689;</button>
    </div>
  </div>
</aside>

<!-- Modal post -->
<div class="modal-bg" id="modal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modal-title">Novo post</h3>
      <button class="close-x" id="modal-close" aria-label="Fechar">&times;</button>
    </div>
    <div class="modal-body">
      <div class="full">
        <label for="m-assunto">Assunto (título)</label>
        <input id="m-assunto" maxlength="200" />
      </div>
      <div>
        <label for="m-cliente">Cliente</label>
        <select id="m-cliente"></select>
      </div>
      <div>
        <label for="m-formato">Formato</label>
        <select id="m-formato"></select>
      </div>
      <div>
        <label for="m-datapub">Data de publicação</label>
        <input id="m-datapub" type="date" />
      </div>
      <!-- ★ "Data original (organização)" foi APOSENTADA em 2026-08-26 (decisão do
           usuário). Medido em produção: 76% dos posts a tinham IGUAL à data de
           publicação, e NADA no sistema a consumia — não posiciona o card, não
           filtra, não vai a relatório. Ela era a entrada do bloco "Dias em Atraso"
           da planilha, que o §3 do doc descartou como indicador derivado; e desde a
           fase 4.1 o log da Agenda mede atraso melhor (registra TODO deslocamento,
           com quem e quando).
           ★ A COLUNA CONTINUA NO BANCO com o histórico importado das planilhas — e
           por isso a chave saiu também do corpo enviado ao PATCH (ver readForm):
           mandar `data_original: null` é `null` EXPLÍCITO, que o servidor lê como
           "limpe este campo" e apagaria o histórico a cada edição de post.
           A Agenda também deixou de escrevê-la (passo 1.2 do parser). -->
      <div>
        <label for="m-horario">Horário (informativo)</label>
        <input id="m-horario" type="time" />
      </div>
      <div>
        <label for="m-status">Status</label>
        <select id="m-status"></select>
      </div>
      <div class="full">
        <label>Redes sociais</label>
        <div class="redepicker" id="m-redes"></div>
      </div>
      <div>
        <label for="m-pilar">Pilar de conteúdo</label>
        <select id="m-pilar"></select>
      </div>
      <div>
        <label for="m-publico">Para quem? (público)</label>
        <select id="m-publico"></select>
      </div>
      <div>
        <label for="m-objetivo">Objetivo do conteúdo</label>
        <select id="m-objetivo"></select>
      </div>
      <div>
        <label class="switch" style="margin-top:22px"><input type="checkbox" id="m-impulsionar" /> Impulsionar (patrocinado)</label>
      </div>
      <div class="full">
        <label for="m-conteudo">Conteúdo / observações (resumo ou link)</label>
        <textarea id="m-conteudo" rows="3" maxlength="2000"></textarea>
      </div>
      <div class="full err" id="modal-err"></div>
    </div>
    <div class="modal-foot">
      <button class="btn danger sm" id="modal-del" style="visibility:hidden">Excluir</button>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" id="modal-cancel">Cancelar</button>
        <button class="btn" id="modal-save">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal gerenciar listas -->
<div class="modal-bg" id="listas">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3>Gerenciar listas</h3>
      <button class="close-x" id="listas-close" aria-label="Fechar">&times;</button>
    </div>
    <div class="tabs" id="listas-tabs"></div>
    <div class="listbox">
      <div class="listadd">
        <input id="listas-input" placeholder="Adicionar novo…" />
        <button class="btn sm" id="listas-add">Adicionar</button>
      </div>
      <div id="listas-items"></div>
    </div>
    <div class="modal-foot"><div class="spacer"></div><button class="btn ghost" id="listas-done">Fechar</button></div>
  </div>
</div>

<!-- Modal escopo por cliente (Pilar/Público/Objetivo exclusivos a certas marcas) -->
<div class="modal-bg" id="scopebg">
  <div class="modal" role="dialog" aria-modal="true" style="max-width:440px">
    <div class="modal-head">
      <h3 id="scope-title">Exclusivo a quais clientes?</h3>
      <button class="close-x" id="scope-close" aria-label="Fechar">&times;</button>
    </div>
    <div class="listbox">
      <p style="color:var(--muted);font-size:12px;margin:0 0 12px">
        Marque os clientes aos quais este item é <strong>exclusivo</strong>.
        Nenhum marcado = visível para <strong>todos</strong> os clientes.</p>
      <div id="scope-list" style="display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost sm" id="scope-none">Deixar global</button>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" id="scope-cancel">Cancelar</button>
        <button class="btn" id="scope-save">Salvar</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";
  var API = "/api/calendario";
  var $ = function(s,r){return (r||document).querySelector(s);};
  var REDES = ["Instagram","LinkedIn","YouTube","TikTok"];
  var FORMATOS = [
    {nome:"Post no Feed", cor:"var(--fmt-feed)"},
    {nome:"Post Único",   cor:"var(--fmt-unico)"},
    {nome:"Carrossel",    cor:"var(--fmt-carrossel)"},
    {nome:"Reels",        cor:"var(--fmt-reels)"},
    {nome:"Stories",      cor:"var(--fmt-stories)"}
  ];
  var FMT_COR = {};
  FORMATOS.forEach(function(f){FMT_COR[f.nome]=f.cor;});
  var STATUSES = ["Não iniciado","Em produção","Não publicado","Publicado"];
  var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var DOW = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

  // Estado
  var view = new Date(); view.setDate(1);
  var me = {canEditCalendario:false, canToggleCalendarioStatus:false};
  var listas = {clientes:[], pilares:[], publicos:[], objetivos:[]};
  var posts = [];
  var clientesFiltro = [];         // vazio = todos os clientes (ids)
  var redesFiltro = [];            // vazio = todas
  var showFds = false;
  var editingId = null;            // id do post no modal (null = novo)
  // Filtro vindo da Agenda (fase 1). Só as dimensões que NÃO têm dropdown:
  // cliente e redes continuam morando em clientesFiltro/redesFiltro, para não
  // haver duas fontes de verdade do mesmo filtro. null = nenhum.
  var agFiltro = null;

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function toast(msg,isErr){ var t=$("#toast"); t.textContent=msg; t.className="show"+(isErr?" err":""); clearTimeout(t._t); t._t=setTimeout(function(){t.className="";},2600); }
  /**
   * Toast com uma AÇÃO — hoje só o Desfazer da Agenda (fase 4).
   *
   * O desfazer não pode viver escondido num menu: ele é o que torna aceitável um
   * comando que apaga post. Se a pessoa tem de procurar como voltar, a rede de
   * segurança não existe na prática. Fica mais tempo na tela que o toast comum,
   * porque exige uma decisão em vez de só informar.
   */
  function toastAcao(msg, rotulo, onClick){
    var t=$("#toast");
    t.textContent="";
    t.appendChild(document.createTextNode(msg+" "));
    var b=document.createElement("button");
    b.type="button"; b.className="toast-acao"; b.textContent=rotulo;
    b.onclick=function(){ t.className=""; onClick(); };
    t.appendChild(b);
    t.className="show";
    clearTimeout(t._t);
    t._t=setTimeout(function(){ t.className=""; }, 9000);
  }
  function pad(n){ return (n<10?"0":"")+n; }
  function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function lastDay(y,m){ return new Date(y,m+1,0).getDate(); }

  async function api(path, opts){
    var r = await fetch(API+path, Object.assign({headers:{Accept:"application/json","Content-Type":"application/json"}}, opts||{}));
    var data; try{ data = await r.json(); }catch(e){ data = {ok:false,error:"resposta inválida"}; }
    if(!r.ok || data.ok===false) throw new Error(data.error||("HTTP "+r.status));
    return data;
  }

  // ---- carregamento ----
  async function loadMe(){
    try{ me = await (await fetch("/api/me",{headers:{Accept:"application/json"}})).json(); }catch(e){}
    $("#btnNovo").style.display = me.canEditCalendario ? "" : "none";
    $("#btnListas").style.display = me.canEditCalendario ? "" : "none";
  }
  async function loadListas(){
    try{ listas = await api("/listas"); }catch(e){ toast("Falha ao carregar listas",true); }
  }
  async function loadPosts(){
    var y=view.getFullYear(), m=view.getMonth();
    var from=y+"-"+pad(m+1)+"-01", to=y+"-"+pad(m+1)+"-"+pad(lastDay(y,m));
    // Carrega todos os clientes do mês; os filtros (cliente/rede) são aplicados
    // no cliente por visiblePosts() — ambos são multi-seleção.
    var q="/posts?from="+from+"&to="+to;
    try{ var d=await api(q); posts=d.posts||[]; }catch(e){ posts=[]; toast("Falha ao carregar posts",true); }
  }

  // ---- filtros/populate ----
  function opcaoNome(lista,id){ var f=(listas[lista]||[]).filter(function(o){return o.id===id;})[0]; return f?f.nome:""; }

  // Uma opção é visível para um cliente se for global (sem escopo) ou se o
  // cliente estiver no seu escopo. `keepId` força manter a opção já atribuída.
  function optVisible(o, clienteId){
    var scoped = o.clientes && o.clientes.length;
    return !scoped || (clienteId && o.clientes.indexOf(Number(clienteId))>=0);
  }
  function fillOptSelect(sel, arr, clienteId, keepId){
    sel.innerHTML = '<option value="">—</option>';
    (arr||[]).forEach(function(o){
      var keep = keepId && o.id===keepId;
      if(o.ativo===false && !keep) return;
      if(!optVisible(o, clienteId) && !keep) return;
      var op=document.createElement("option"); op.value=o.id; op.textContent=o.nome; sel.appendChild(op);
    });
  }
  function refreshOptSelects(clienteId, keep){
    keep = keep || {};
    fillOptSelect($("#m-pilar"),    listas.pilares,   clienteId, keep.pilar);
    fillOptSelect($("#m-publico"),  listas.publicos,  clienteId, keep.publico);
    fillOptSelect($("#m-objetivo"), listas.objetivos, clienteId, keep.objetivo);
  }

  function fillSelect(sel, arr, withEmpty, emptyLabel){
    sel.innerHTML = withEmpty ? '<option value="">'+esc(emptyLabel||"—")+'</option>' : "";
    arr.forEach(function(o){
      if(o.ativo===false) return;
      var op=document.createElement("option"); op.value=o.id; op.textContent=o.nome; sel.appendChild(op);
    });
  }
  // Multi-Select Dropdown reutilizável: botão com resumo + painel de checkboxes,
  // primeiro item "Todos/Todas" que limpa a seleção. `selected` é o array de
  // estado (vazio = todos). `onchange` re-renderiza a grade.
  var _ddOpen = [];  // instâncias abertas (para fechar ao clicar fora / Esc)
  function makeMultiSelect(host, allLabel, selected, onchange){
    host.classList.add("msdd");
    host.innerHTML='<button type="button" class="msdd-btn"><span class="msdd-label"></span><span class="msdd-caret">▾</span></button><div class="msdd-panel"></div>';
    var btn=host.querySelector(".msdd-btn"), panel=host.querySelector(".msdd-panel"), lbl=host.querySelector(".msdd-label");
    var items=[];
    function summary(){
      if(!selected.length) return allLabel;
      if(selected.length===1){ var it=items.filter(function(i){return i.value===selected[0];})[0]; return it?it.label:"1 selecionado"; }
      return selected.length+" selecionados";
    }
    function drawLabel(){ lbl.textContent=summary(); }
    function drawPanel(){
      panel.innerHTML="";
      var all=document.createElement("label"); all.className="msdd-opt all";
      all.innerHTML='<input type="checkbox"'+(selected.length===0?" checked":"")+'/> '+esc(allLabel);
      var allInput=all.querySelector("input");
      allInput.onchange=function(){ selected.length=0; drawPanel(); drawLabel(); onchange(); };
      panel.appendChild(all);
      items.forEach(function(it){
        var o=document.createElement("label"); o.className="msdd-opt";
        o.innerHTML='<input type="checkbox"'+(selected.indexOf(it.value)>=0?" checked":"")+'/> '+esc(it.label);
        o.querySelector("input").onchange=function(){
          var i=selected.indexOf(it.value);
          if(i>=0) selected.splice(i,1); else selected.push(it.value);
          allInput.checked = selected.length===0;  // "Todos/Todas" reflete o estado
          drawLabel(); onchange();
        };
        panel.appendChild(o);
      });
    }
    btn.onclick=function(e){
      e.stopPropagation();
      var willOpen=!host.classList.contains("open");
      closeAllDropdowns();
      if(willOpen){ host.classList.add("open"); }
    };
    var api={ close:function(){ host.classList.remove("open"); },
      setItems:function(newItems){ items=newItems||[]; drawPanel(); drawLabel(); },
      refresh:function(){ drawPanel(); drawLabel(); } };
    _ddOpen.push(host);
    return api;
  }
  function closeAllDropdowns(){ _ddOpen.forEach(function(h){ h.classList.remove("open"); }); }

  var msClientes=null, msRedes=null;
  function populateFilters(){
    if(!msClientes) msClientes=makeMultiSelect($("#ddClientes"), "Todos os clientes", clientesFiltro, render);
    if(!msRedes)    msRedes   =makeMultiSelect($("#ddRedes"),    "Todas as redes",    redesFiltro,    render);
    msClientes.setItems((listas.clientes||[]).filter(function(c){return c.ativo!==false;}).map(function(c){return {value:c.id, label:c.nome};}));
    msRedes.setItems(REDES.map(function(r){return {value:r, label:r};}));
  }
  function renderLegend(){
    var el=$("#legend"); el.innerHTML="<strong style='color:var(--texto)'>Formato:</strong>";
    FORMATOS.forEach(function(f){
      var s=document.createElement("span"); s.className="item";
      s.innerHTML='<span class="dot" style="background:'+f.cor+'"></span>'+esc(f.nome);
      el.appendChild(s);
    });
    var s2=document.createElement("span"); s2.className="item"; s2.style.marginLeft="8px";
    s2.innerHTML='<span class="dot" style="background:#f2f4f7;border:1px solid var(--borda)"></span>Publicado (esmaecido)';
    el.appendChild(s2);
  }

  function visiblePosts(){
    return posts.filter(function(p){
      if(clientesFiltro.length && clientesFiltro.indexOf(p.cliente_id)<0) return false;
      if(redesFiltro.length && !p.redes.some(function(r){return redesFiltro.indexOf(r)>=0;})) return false;
      return agFiltroCasa(p);
    });
  }

  /**
   * O post existe no mês mas NÃO está desenhado por ser sábado/domingo com o
   * toggle de fim de semana desligado.
   *
   * Importa em dois lugares: contar sem isso faria a barra de filtro prometer
   * posts que a pessoa não vê, e criar um post num sábado oculto daria "criado!"
   * com a grade sem nenhuma mudança visível.
   *
   * O "T12:00:00" é obrigatório: `new Date("2026-08-15")` é meia-noite UTC, que
   * em BRT ainda é dia 14 — e o dia da semana sairia errado.
   */
  function fimDeSemanaOculto(dataStr){
    if(showFds) return false;
    var dow=new Date(dataStr+"T12:00:00").getDay();
    return dow===0 || dow===6;
  }

  // Comparação sem acento/caixa: quem digita "producao" tem de achar "produção".
  function semAcento(s){
    return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }

  // O post passa pelo filtro da Agenda? Cada campo nulo = "não filtrar por isto".
  function agFiltroCasa(p){
    var f=agFiltro; if(!f) return true;
    if(f.formato && p.formato!==f.formato) return false;
    if(f.status && p.status!==f.status) return false;
    if(f.pilar_id!=null && p.pilar_id!==f.pilar_id) return false;
    if(f.publico_id!=null && p.publico_id!==f.publico_id) return false;
    if(f.objetivo_id!=null && p.objetivo_id!==f.objetivo_id) return false;
    // impulsionar tem três estados: true, false e null ("não falou").
    if(f.impulsionar!=null && !!p.impulsionar!==f.impulsionar) return false;
    if(f.titulo && semAcento(p.assunto).indexOf(semAcento(f.titulo))<0) return false;
    if(f.de && p.data_publicacao<f.de) return false;
    if(f.ate && p.data_publicacao>f.ate) return false;
    return true;
  }

  // ---- grade ----
  function render(){
    var y=view.getFullYear(), m=view.getMonth();
    $("#mlabel").textContent = MESES[m]+" "+y;
    var cols = showFds ? [0,1,2,3,4,5,6] : [1,2,3,4,5];
    var tmpl = "repeat("+cols.length+",1fr)";
    $("#dow").style.gridTemplateColumns = tmpl;
    $("#dow").innerHTML = cols.map(function(c){return "<div>"+DOW[c]+"</div>";}).join("");

    // agrupa posts por dia
    var byDay={};
    visiblePosts().forEach(function(p){ (byDay[p.data_publicacao]=byDay[p.data_publicacao]||[]).push(p); });

    var first=new Date(y,m,1);
    var start=new Date(first); start.setDate(1-first.getDay()); // volta ao domingo
    var todayStr=ymd(new Date());
    var weeks=$("#weeks"); weeks.innerHTML="";
    var cursor=new Date(start);
    for(var w=0; w<6; w++){
      // se a semana inteira é de outro mês (após terminar), para
      if(w>0 && cursor.getMonth()!==m && cursor>first) {
        // ainda pode haver dias do mês; só quebra se já passou do fim
        if(cursor.getFullYear()>y || (cursor.getFullYear()===y && cursor.getMonth()>m)) break;
      }
      var row=document.createElement("div"); row.className="week"; row.style.gridTemplateColumns=tmpl;
      for(var i=0;i<7;i++){
        var d=new Date(cursor); cursor.setDate(cursor.getDate()+1);
        if(cols.indexOf(d.getDay())<0) continue;
        var inMonth=(d.getMonth()===m);
        var cell=document.createElement("div");
        cell.className="day"+(inMonth?"":" out")+(ymd(d)===todayStr?" today":"");
        var dn=document.createElement("div"); dn.className="dn";
        dn.innerHTML=(ymd(d)===todayStr?"<span>"+d.getDate()+"</span>":d.getDate());
        cell.appendChild(dn);
        if(inMonth && me.canEditCalendario){
          var add=document.createElement("button"); add.className="addday"; add.textContent="+";
          (function(ds){ add.onclick=function(e){ e.stopPropagation(); openPost(null, ds); }; })(ymd(d));
          cell.appendChild(add);
        }
        var dayPosts = byDay[ymd(d)]||[];
        dayPosts.forEach(function(p){ cell.appendChild(chipEl(p)); });
        row.appendChild(cell);
      }
      weeks.appendChild(row);
    }
    // A barra de filtro ativo é desenhada aqui de propósito: assim ela reflete
    // também as mudanças feitas direto nos dropdowns, não só as da Agenda.
    agRenderFiltro();
    // A vitrine fala do que está NA GRADE, então segue o mesmo gancho. Só vai à
    // rede quando mês ou cliente realmente mudaram — render() roda a cada mexida
    // de filtro, e uma requisição por clique aqui seria caro à toa.
    agSugestoesSeMudou();
    // A grade foi redesenhada do zero: as marcas do comando atual (anel do alvo,
    // números dos candidatos) morreram com os cartões antigos. Repõe — senão
    // navegar de mês ou mexer num filtro apagaria em silêncio o alvo que a pessoa
    // está conferindo. Barato: é uma consulta por id, não um novo interpretar.
    if(typeof agPlano !== "undefined" && agPlano) agMarcarNaGrade(agPlano);
  }

  function chipEl(p){
    var pub = (p.status==="Publicado");
    var b=document.createElement("button");
    b.className="chip"+(pub?" pub":"")+(p.id===agPostDestaque?" novo":"");
    // O id no DOM é o que deixa a Agenda achar o cartão para pôr o anel do alvo
    // (ou o número do candidato) sem varrer a grade nem redesenhá-la.
    b.dataset.postId = p.id;
    b.style.borderLeftColor = FMT_COR[p.formato]||"var(--cinza)";
    var meta=[];
    if(clientesFiltro.length!==1 && p.cliente_nome) meta.push(esc(p.cliente_nome));
    meta.push(esc(p.formato));
    if(p.horario) meta.push(esc(p.horario));
    var impMark = p.impulsionar ? ' <span class="imp" title="Impulsionar">▲</span>' : '';
    b.innerHTML =
      (me.canToggleCalendarioStatus ? '<span class="ck" title="Alternar publicado">✓</span>' : '')+
      '<span class="assunto">'+esc(p.assunto)+impMark+'</span>'+
      '<span class="meta">'+meta.join(" · ")+'</span>';
    b.onclick=function(){
      // Cartão NUMERADO responde a pergunta "qual post?" em vez de abrir o modal
      // (§8.8). Fica aqui, e não num listener posto ao marcar, para o comportamento
      // normal voltar sozinho quando a marca sai — sem guardar o onclick antigo.
      if(b.classList.contains("cand")){ agResponderAlvoPeloCartao(p.id); return; }
      openPost(p.id);
    };
    if(me.canToggleCalendarioStatus){
      var ck=$(".ck",b);
      if(ck) ck.onclick=function(e){ e.stopPropagation(); toggleStatus(p); };
    }
    return b;
  }

  async function toggleStatus(p){
    var novo = (p.status==="Publicado") ? "Não publicado" : "Publicado";
    try{
      await api("/posts/"+p.id+"/status",{method:"PATCH",body:JSON.stringify({status:novo})});
      p.status=novo; render();
      toast('Status: '+novo);
    }catch(e){ toast(e.message,true); }
  }

  // ---- modal post ----
  // Cliente sugerido ao criar post: o único selecionado no filtro (se houver
  // exatamente um) ou o primeiro cliente da lista.
  function defaultCliente(){
    return clientesFiltro.length===1 ? clientesFiltro[0] : ((listas.clientes[0]&&listas.clientes[0].id)||0);
  }
  function openPost(id, dateStr){
    if(id && !me.canToggleCalendarioStatus && !me.canEditCalendario) return;
    editingId = id;
    var p = id ? posts.filter(function(x){return x.id===id;})[0] : null;
    var canEdit = me.canEditCalendario;
    $("#modal-title").textContent = id ? (canEdit?"Editar post":"Detalhes do post") : "Novo post";

    fillSelect($("#m-cliente"), listas.clientes, false);
    $("#m-formato").innerHTML = FORMATOS.map(function(f){return '<option>'+esc(f.nome)+'</option>';}).join("");
    $("#m-status").innerHTML = STATUSES.map(function(s){return '<option>'+esc(s)+'</option>';}).join("");
    // Selects de Pilar/Público/Objetivo filtrados pelo cliente do post (opções
    // exclusivas de outra marca não aparecem); mantém a opção já atribuída.
    var cliId = p ? p.cliente_id : defaultCliente();
    refreshOptSelects(cliId, p ? {pilar:p.pilar_id, publico:p.publico_id, objetivo:p.objetivo_id} : {});
    var rp=$("#m-redes"); rp.innerHTML="";
    REDES.forEach(function(r){
      var checked = p && p.redes.indexOf(r)>=0;
      var lab=document.createElement("label");
      lab.innerHTML='<input type="checkbox" value="'+r+'"'+(checked?" checked":"")+'/> '+r;
      rp.appendChild(lab);
    });

    $("#m-assunto").value = p?p.assunto:"";
    $("#m-cliente").value = p?p.cliente_id:(defaultCliente()||"");
    $("#m-formato").value = p?p.formato:"Stories";
    $("#m-datapub").value = p?p.data_publicacao:(dateStr||ymd(new Date()));
    $("#m-horario").value = p&&p.horario?p.horario:"";
    $("#m-status").value = p?p.status:"Não iniciado";
    $("#m-pilar").value = p&&p.pilar_id?p.pilar_id:"";
    $("#m-publico").value = p&&p.publico_id?p.publico_id:"";
    $("#m-objetivo").value = p&&p.objetivo_id?p.objetivo_id:"";
    $("#m-impulsionar").checked = !!(p&&p.impulsionar);
    $("#m-conteudo").value = p&&p.conteudo?p.conteudo:"";
    $("#modal-err").textContent="";

    // Permissões: quem não edita só pode mexer no status (se puder).
    var inputs = document.querySelectorAll("#modal .modal-body input, #modal .modal-body select, #modal .modal-body textarea");
    inputs.forEach(function(el){ el.disabled = !canEdit && el.id!=="m-status"; });
    if(!canEdit){ $("#m-status").disabled = !me.canToggleCalendarioStatus; }
    $("#modal-save").style.display = (canEdit || me.canToggleCalendarioStatus) ? "" : "none";
    $("#modal-del").style.visibility = (id && canEdit) ? "visible" : "hidden";

    $("#modal").classList.add("open");
  }
  function closePost(){ $("#modal").classList.remove("open"); editingId=null; }

  function readForm(){
    var redes=[]; document.querySelectorAll("#m-redes input:checked").forEach(function(c){redes.push(c.value);});
    return {
      cliente_id: Number($("#m-cliente").value)||null,
      assunto: $("#m-assunto").value.trim(),
      formato: $("#m-formato").value,
      data_publicacao: $("#m-datapub").value,
      horario: $("#m-horario").value||null,
      status: $("#m-status").value,
      pilar_id: $("#m-pilar").value?Number($("#m-pilar").value):null,
      publico_id: $("#m-publico").value?Number($("#m-publico").value):null,
      objetivo_id: $("#m-objetivo").value?Number($("#m-objetivo").value):null,
      impulsionar: $("#m-impulsionar").checked,
      conteudo: $("#m-conteudo").value.trim()||null,
      redes: redes
    };
  }
  async function savePost(){
    // Sem permissão de edição: só grava o status (perfil calendario-status).
    if(!me.canEditCalendario){
      if(!editingId){ closePost(); return; }
      var p=posts.filter(function(x){return x.id===editingId;})[0];
      try{ await api("/posts/"+editingId+"/status",{method:"PATCH",body:JSON.stringify({status:$("#m-status").value})});
        if(p)p.status=$("#m-status").value; render(); closePost(); toast("Status atualizado");
      }catch(e){ $("#modal-err").textContent=e.message; }
      return;
    }
    var body=readForm();
    if(!body.assunto){ $("#modal-err").textContent="Informe o assunto."; return; }
    if(!body.cliente_id){ $("#modal-err").textContent="Selecione o cliente."; return; }
    if(!body.data_publicacao){ $("#modal-err").textContent="Informe a data de publicação."; return; }
    try{
      if(editingId){ await api("/posts/"+editingId,{method:"PATCH",body:JSON.stringify(body)}); }
      else{ await api("/posts",{method:"POST",body:JSON.stringify(body)}); }
      // ★ `editingId` tem de ser lido ANTES de closePost(), que o zera — senão o
      // toast dizia "Post criado" em toda EDIÇÃO. Defeito antigo, achado ao
      // exercitar a remoção do campo Data original (2026-08-26).
      var eraEdicao = !!editingId;
      closePost(); await loadPosts(); render(); toast(eraEdicao?"Post atualizado":"Post criado");
    }catch(e){ $("#modal-err").textContent=e.message; }
  }
  async function delPost(){
    if(!editingId) return;
    if(!confirm("Excluir este post?")) return;
    try{ await api("/posts/"+editingId,{method:"DELETE"}); closePost(); await loadPosts(); render(); toast("Post excluído"); }
    catch(e){ $("#modal-err").textContent=e.message; }
  }

  // ---- gerenciar listas ----
  var listaTab="clientes";
  var TAB_DEF=[{k:"clientes",label:"Clientes",cat:null},{k:"pilares",label:"Pilar",cat:"pilar"},
               {k:"publicos",label:"Público",cat:"publico"},{k:"objetivos",label:"Objetivo",cat:"objetivo"}];
  function openListas(){ listaTab="clientes"; renderTabs(); renderListaItems(); $("#listas").classList.add("open"); }
  function closeListas(){ $("#listas").classList.remove("open"); }
  function renderTabs(){
    $("#listas-tabs").innerHTML="";
    TAB_DEF.forEach(function(t){
      var b=document.createElement("button"); b.className="tab"+(t.k===listaTab?" on":""); b.textContent=t.label;
      b.onclick=function(){ listaTab=t.k; renderTabs(); renderListaItems(); }; $("#listas-tabs").appendChild(b);
    });
  }
  function curTabDef(){ return TAB_DEF.filter(function(t){return t.k===listaTab;})[0]; }
  function scopeLabel(o){
    var n = (o.clientes||[]).length;
    if(!n) return "Todos os clientes";
    if(n===1) return opcaoNome("clientes", o.clientes[0]) || "1 cliente";
    return n+" clientes";
  }
  function renderListaItems(){
    var box=$("#listas-items"); box.innerHTML="";
    var isCliente = listaTab==="clientes";
    (listas[listaTab]||[]).forEach(function(o){
      var row=document.createElement("div"); row.className="litem"+(o.ativo===false?" off":"");
      row.innerHTML='<span class="nome">'+esc(o.nome)+'</span>';
      if(!isCliente){
        var sc=document.createElement("button"); sc.className="minibtn scope"; sc.textContent="👥 "+scopeLabel(o);
        sc.title="Definir a quais clientes este item é exclusivo";

        row.appendChild(sc);
      }
      var ren=document.createElement("button"); ren.className="minibtn"; ren.textContent="Renomear";
      ren.onclick=function(){ renameItem(o); };
      var tog=document.createElement("button"); tog.className="minibtn"; tog.textContent=o.ativo===false?"Ativar":"Ocultar";
      tog.onclick=function(){ toggleItem(o); };

      del.onclick=function(){ deleteItem(o); };

    });

  // ---- escopo por cliente (Pilar/Público/Objetivo exclusivos a certas marcas) ----
  var scopeItem=null;
  function openScope(o){
    scopeItem=o;
    $("#scope-title").textContent='Exclusivo a quais clientes? — "'+o.nome+'"';
    var box=$("#scope-list"); box.innerHTML="";

      box.appendChild(lab);
