/* Spotlight — o KR ampliado e centralizado, com o resto do dashboard desfocado.
   Navega ← →, sai com ✕ / Esc / clique no fundo.
   Ampliação dinâmica: o card é medido no tamanho natural e escalado (CSS `zoom`,
   que re-rasteriza — texto nítido) para PREENCHER o espaço livre da tela. Assim
   aproveita a área vazia e deixa até os textos pequenos legíveis numa TV. */
const SPOTLIGHT_MAX_ZOOM = 2.2;   // teto p/ cards curtos não ficarem gigantes
function KRSpotlight({ kr, pos, total, onPrev, onNext, onClose }) {
  const btn = { borderRadius: 999, display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.panel, border: `1px solid ${C.border}`, color: C.grayMid, cursor: 'pointer', flexShrink: 0 };

  // Base do card (largura natural antes do zoom). Base menor => mais folga p/ ampliar.
  const cardRef = useRef(null);
  const [zoom, setZoom] = useState(null);   // null = ainda não medido -> renderiza natural

  // Ao trocar de KR ou redimensionar, remede no tamanho natural (zoom 1).
  useLayoutEffect(() => { setZoom(null); }, [kr]);
  useEffect(() => {
    const onResize = () => setZoom(null);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  // Passo de medição: só roda quando zoom===null (card renderizado em escala 1,
  // então offsetHeight/Width são os naturais). Calcula o fator que preenche a área
  // disponível (altura e largura) e reaplica antes da pintura (useLayoutEffect).
  useLayoutEffect(() => {
    if (zoom !== null) return;
    const el = cardRef.current;
    if (!el) return;
    const nh = el.offsetHeight, nw = el.offsetWidth;
    if (!nh || !nw) return;
    const availH = window.innerHeight - 104;   // respiro p/ contador/topo + margem
    const availW = window.innerWidth - 240;     // espaço p/ as setas laterais
    setZoom(Math.min(availH / nh, availW / nw, SPOTLIGHT_MAX_ZOOM));
  }, [zoom, kr]);

  return (
    <div
      className="id-fade-in id-focus-ui"
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
      style={{ position: 'fixed', inset: 0, zIndex: 60, background: 'rgba(20,20,20,0.45)', backdropFilter: 'blur(6px)', WebkitBackdropFilter: 'blur(6px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '24px 96px' }}
    >
      <button onClick={onClose} className="id-nav-item" title="Fechar (Esc)" style={{ ...btn, position: 'absolute', top: 22, right: 24, width: 44, height: 44, zIndex: 2 }}><X size={22} /></button>
      <button onClick={onPrev} className="id-nav-item" title="Anterior (←)" style={{ ...btn, position: 'absolute', left: 26, top: '50%', transform: 'translateY(-50%)', width: 52, height: 52, zIndex: 2 }}><ChevronLeft size={28} /></button>
      <div
        ref={cardRef}
        className="id-fade-up"
        onClick={(e) => e.stopPropagation()}
        style={{ width: 'min(680px, 90vw)', zoom: zoom ?? 1, visibility: zoom === null ? 'hidden' : 'visible' }}
      >
        <KRCard kr={kr} index={0} variant="spotlight" />
      </div>
      <button onClick={onNext} className="id-nav-item" title="Próximo (→)" style={{ ...btn, position: 'absolute', right: 26, top: '50%', transform: 'translateY(-50%)', width: 52, height: 52, zIndex: 2 }}><ChevronRight size={28} /></button>
      <div className="mono text-[14px]" style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', color: '#fff', background: 'rgba(20,20,20,0.5)', padding: '6px 18px', borderRadius: 999, fontWeight: 600 }}>{pos} / {total}</div>
    </div>
  );
}

/* ============================================================
   MODAL DE EDIÇÃO DE KR (pendência 3)
   ------------------------------------------------------------
   Criar/editar um KR "ao vivo": título, subtítulo, responsável, squad, seção,
   unidade, meta trimestral, os 3 valores mensais e o tipo de progressão
   (maior é melhor / menor é melhor). Salva via /api/okr/krs (POST/PATCH) e pode
   excluir (DELETE). Autocontido: guarda o rascunho localmente e chama
   onSubmit(draft)/onDelete(draft), que devolvem { ok, error }.
   ============================================================ */
/* Combobox de pessoas por chips com avatar. multi=true (Squad) marca vários;
   multi=false (Responsável) escolhe um (clicar de novo limpa). */
function PersonChips({ people, selected, multi, onChange }) {
  const isSel = (n) => multi ? (selected || []).includes(n) : selected === n;
  const toggle = (n) => {
    if (multi) {
      const cur = selected || [];
      onChange(cur.includes(n) ? cur.filter((x) => x !== n) : [...cur, n]);
    } else {
      onChange(selected === n ? '' : n);
    }
  };
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
      {people.map((n) => {
        const on = isSel(n);
        return (
          <button key={n} type="button" onClick={() => toggle(n)} className="id-nav-item"
            style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '5px 12px 5px 5px', borderRadius: 999, cursor: 'pointer',
              background: on ? C.blueSoft : C.panel2, border: `1.5px solid ${on ? C.blue : C.border}`, color: on ? C.blueText : C.grayMid, fontWeight: 600, fontSize: 14 }}>
            <Avatar name={n} size={24} ring />
            <span>{n}</span>
            {on && <Check size={15} strokeWidth={2.6} />}
          </button>
        );
      })}
    </div>
  );
}

function KREditorModal({ mode, initial, monthsLabels, quarterLabel, onSubmit, onDelete, onClose }) {
  // Sem o nível `config`, o modal vira um lançador de valores mensais: os campos
  // de estrutura nem são renderizados (e o backend poda o PATCH de todo jeito).
  const okrEdit = useOkrEdit();
  const showConfig = okrEdit.canEditConfig;
  const [draft, setDraft] = useState(initial);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const [confirmDel, setConfirmDel] = useState(false);
  const set = (k, v) => setDraft((d) => ({ ...d, [k]: v }));

  /* Meses de trabalho do KR. Nem todo KR roda o trimestre inteiro (projetos
     começam no 2º mês, ou vivem num único mês) — desmarcar um mês tira ele da
     conta do objetivo mensal e do veredito ✓/✗ do card, além de zerar o valor
     (mês fora do escopo não guarda número). Pelo menos um mês fica sempre
     marcado: um KR sem mês nenhum não tem como ser medido. */
  const ativos = activeMonthsOf(draft.mesesAtivos);
  const nAtivos = activeCount(ativos);
  const toggleMes = (i) => {
    if (ativos[i] && nAtivos === 1) return;         // não deixa zerar a janela
    const next = ativos.map((v, k) => (k === i ? !v : v));
    setDraft((d) => ({
      ...d,
      mesesAtivos: next,
      // Desmarcou => zera o valor daquele mês (o backend zera de todo jeito).
      [`mes${i + 1}`]: next[i] ? d[`mes${i + 1}`] : 0,
    }));
  };

  /* Checkbox "Período personalizado" — sem ela, os interruptores de mês nem
     aparecem (o KR roda o trimestre inteiro, comportamento padrão). Desligar
     a checkbox reativa os 3 meses de uma vez: não faria sentido guardar uma
     janela customizada "escondida" atrás de uma checkbox desmarcada. */
  const setPeriodoPersonalizado = (on) => {
    setDraft((d) => ({ ...d, periodoPersonalizado: on, ...(on ? {} : { mesesAtivos: [true, true, true] }) }));
  };

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape' && !saving) { e.preventDefault(); onClose(); } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose, saving]);

  const save = async () => {
    if (!String(draft.titulo || '').trim()) { setError('Informe um título.'); return; }
    if (!String(draft.secao || '').trim()) { setError('Informe a seção.'); return; }
    const t = Number(draft.target);
    if (!Number.isFinite(t) || t < 0) { setError('Meta trimestral inválida.'); return; }
    setSaving(true); setError('');
    const res = await onSubmit(draft);
    setSaving(false);
    if (!res || !res.ok) setError((res && res.error) || 'Não foi possível salvar.');
  };

  const del = async () => {
    setSaving(true); setError('');
    const res = await onDelete(draft);
    setSaving(false);
    if (!res || !res.ok) setError((res && res.error) || 'Não foi possível excluir.');
  };

  const fieldS = { width: '100%', background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 12, padding: '11px 13px', fontSize: 15, color: C.ink, outline: 'none', fontFamily: 'inherit' };
  const labelS = { fontSize: 12, textTransform: 'uppercase', letterSpacing: '0.12em', color: C.gray, fontWeight: 700, marginBottom: 7, display: 'block' };
  const num = (v) => (v === '' || v === null || v === undefined) ? '' : v;

  // Comboboxes de pessoas: equipe + quaisquer nomes já gravados fora dela.
  const squadSel = splitSquad(draft.squad);
  const ownerPeople = withExtras(TEAM, draft.owner ? [draft.owner] : []);
  const squadPeople = withExtras(TEAM, squadSel);

  return ReactDOM.createPortal(
    <div
      className="id-fade-in id-focus-ui"
      onClick={(e) => { if (e.target === e.currentTarget && !saving) onClose(); }}
      style={{ position: 'fixed', inset: 0, zIndex: 70, background: 'rgba(20,20,20,0.45)', backdropFilter: 'blur(6px)', WebkitBackdropFilter: 'blur(6px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}
    >
      <div className="id-fade-up" onClick={(e) => e.stopPropagation()} style={{ width: '100%', maxWidth: 640, background: C.panel, border: `1px solid ${C.border}`, borderRadius: 20, padding: 28, boxShadow: '0 16px 50px rgba(20,20,20,0.20)', maxHeight: '90vh', overflowY: 'auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 22 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <Pencil size={18} style={{ color: C.blue }} />
            <span style={{ fontSize: 18, fontWeight: 700 }}>{mode === 'new' ? 'Novo KR' : 'Editar KR'}</span>
            {quarterLabel && <span className="text-[12px] uppercase tracking-widest" style={{ color: C.gray, fontWeight: 700 }}>· {quarterLabel}</span>}
          </div>
          <button onClick={() => !saving && onClose()} className="id-nav-item" style={{ width: 36, height: 36, borderRadius: 999, display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.panel2, border: `1px solid ${C.border}`, color: C.grayMid, cursor: 'pointer' }} title="Fechar (Esc)"><X size={18} /></button>
        </div>

        {showConfig && <>
        {/* Título + subtítulo */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 16 }}>
          <div>
            <label style={labelS}>Título</label>
            <input value={draft.titulo} onChange={(e) => set('titulo', e.target.value)} placeholder="Ex.: Beemore" maxLength={120} style={{ ...fieldS, fontWeight: 600 }} />
          </div>
          <div>
            <label style={labelS}>Subtítulo / métrica</label>
            <input value={draft.sub} onChange={(e) => set('sub', e.target.value)} placeholder="Ex.: Seguidores" maxLength={160} style={fieldS} />
          </div>
        </div>

        {/* Responsável — combobox de uma pessoa */}
        <div style={{ marginBottom: 16 }}>
          <label style={labelS}>Responsável <span style={{ textTransform: 'none', letterSpacing: 0, color: C.grayLight, fontWeight: 500 }}>· escolha uma pessoa</span></label>
          <PersonChips people={ownerPeople} selected={draft.owner} multi={false} onChange={(v) => set('owner', v)} />
        </div>

        {/* Squad — combobox de várias pessoas */}
        <div style={{ marginBottom: 16 }}>
          <label style={labelS}>Squad <span style={{ textTransform: 'none', letterSpacing: 0, color: C.grayLight, fontWeight: 500 }}>· marque quem participa</span></label>
          <PersonChips people={squadPeople} selected={squadSel} multi={true} onChange={(arr) => set('squad', joinSquad(arr))} />
        </div>

        {/* Seção + unidade */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 16 }}>
          <div>
            <label style={labelS}>Seção</label>
            <input value={draft.secao} onChange={(e) => set('secao', e.target.value)} placeholder="Ex.: Redes Sociais" maxLength={120} style={fieldS} />
          </div>
          <div>
            <label style={labelS}>Unidade (rótulo)</label>
            <input value={draft.unidade} onChange={(e) => set('unidade', e.target.value)} placeholder="Ex.: seguidores, leads…" maxLength={40} style={fieldS} />
          </div>
        </div>

        {/* Meta trimestral */}
        <div style={{ marginBottom: 16 }}>
          <label style={labelS}>Meta trimestral</label>
          <input type="number" value={num(draft.target)} onChange={(e) => set('target', e.target.value)} placeholder="Ex.: 500" step="any" style={{ ...fieldS, maxWidth: 220 }} className="mono" />
        </div>

        </>}

        {/* Sem permissão de configuração, o card em edição precisa ficar
            identificado — senão a pessoa vê três campos numéricos sem contexto. */}
        {!showConfig && (
          <div style={{ marginBottom: 18, padding: '12px 14px', borderRadius: 12, background: C.panel2, border: `1px solid ${C.border}` }}>
            <div style={{ fontSize: 17, fontWeight: 700, color: C.ink }}>{draft.titulo || '—'}</div>
            {draft.sub && <div style={{ fontSize: 14, color: C.grayMid, marginTop: 2 }}>{draft.sub}</div>}
            <div style={{ fontSize: 12, color: C.grayLight, marginTop: 6 }}>
              Meta trimestral: <span className="mono" style={{ color: C.dim, fontWeight: 700 }}>{num(draft.target)}</span>
              {draft.unidade ? ` ${draft.unidade}` : ''}
            </div>
          </div>
        )}

        {/* Valores mensais + MESES DE TRABALHO
            O rótulo de cada mês é o botão que liga/desliga o mês: com config, o
            cabeçalho da coluna vira um interruptor; sem config, é só rótulo (a
            janela é estrutura, e o backend poda o PATCH de quem só lança valor). */}
        <div style={{ marginBottom: 18 }}>
          <label style={labelS}>
            Valores mensais
            {showConfig && draft.periodoPersonalizado && (
              <span style={{ textTransform: 'none', letterSpacing: 0, color: C.grayLight, fontWeight: 500 }}>
                {' '}· clique no mês para tirá-lo do escopo deste KR
              </span>
            )}
          </label>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12 }}>
            {['mes1', 'mes2', 'mes3'].map((k, i) => {
              const on = ativos[i];
              const rotulo = monthsLabels[i] || `Mês ${i + 1}`;
              const metaKey = `metaMes${i + 1}`;
              return (
                <div key={k}>
                  {showConfig && draft.periodoPersonalizado ? (
                    <button
                      type="button"
                      onClick={() => toggleMes(i)}
                      className="id-nav-item"
                      title={on ? 'Mês de trabalho — clique para tirar do escopo' : 'Fora do escopo — clique para incluir'}
                      style={{
                        width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
                        marginBottom: 6, padding: '6px 8px', borderRadius: 9, cursor: 'pointer',
                        background: on ? C.blueSoft : C.panel2,
                        border: `1.5px ${on ? 'solid' : 'dashed'} ${on ? C.blue : C.borderStrong}`,
                        color: on ? C.blueText : C.grayLight,
                        fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.12em',
                      }}
                    >
                      {on ? <Check size={12} strokeWidth={3} /> : <X size={12} strokeWidth={3} />}
                      {rotulo}
                    </button>
                  ) : (
                    <div className="text-[11px] uppercase tracking-widest mb-1.5" style={{ color: on ? C.grayLight : C.borderStrong, fontWeight: 700 }}>
                      {rotulo}{!on && ' · fora'}
                    </div>
                  )}
                  <input
                    type="number"
                    disabled={!on}
                    value={on ? num(draft[k]) : ''}
                    placeholder={on ? '' : '—'}
                    onChange={(e) => set(k, e.target.value)}
                    step="any"
                    className="mono"
                    style={{ ...fieldS, opacity: on ? 1 : 0.45, cursor: on ? 'text' : 'not-allowed', borderStyle: on ? 'solid' : 'dashed' }}
                  />
                  {/* Meta personalizada por mês: um campo a mais logo abaixo do
                      valor lançado. Vazio = usa o objetivo derivado (target ÷
                      meses) NESTE mês — não precisa preencher os 3. */}
                  {showConfig && draft.metaPersonalizada && (
                    <input
                      type="number"
                      disabled={!on}
                      value={on ? num(draft[metaKey]) : ''}
                      placeholder={on ? 'meta do mês' : '—'}
                      onChange={(e) => set(metaKey, e.target.value)}
                      step="any"
                      title={`Meta de ${rotulo} — vazio usa a meta derivada da trimestral`}
                      className="mono"
                      style={{ ...fieldS, marginTop: 6, padding: '8px 13px', fontSize: 13, opacity: on ? 1 : 0.45, cursor: on ? 'text' : 'not-allowed', borderStyle: 'dashed', color: C.grayMid }}
                    />
                  )}
                </div>
              );
            })}
          </div>
          {/* A janela muda a conta do objetivo mensal — deixar isso explícito é
              o que evita a pergunta "por que a meta/mês não é a meta ÷ 3?". */}
          {nAtivos < 3 && (
            <p style={{ fontSize: 12, color: C.grayMid, marginTop: 9, display: 'flex', alignItems: 'center', gap: 6 }}>
              <Calendar size={13} style={{ color: C.blue, flexShrink: 0 }} />
              <span>
                KR de {plural(nAtivos, 'mês de trabalho', 'meses de trabalho')}
                {` (${monthsLabels.filter((_, i) => ativos[i]).join(' · ')})`}
                {Number(draft.target) > 0 && !draft.percentValue
                  ? ` — meta/mês = ${fmt(Math.round((Number(draft.target) / nAtivos) * 10) / 10)}`
                  : ''}
              </span>
            </p>
          )}
        </div>

        {showConfig && <>
        {/* Tipo de progressão */}
        <div style={{ marginBottom: 16 }}>
          <label style={labelS}>Tipo de progressão</label>
          <div style={{ display: 'flex', gap: 10 }}>
            {[
              { v: false, label: 'Maior é melhor', Icon: TrendingUp, hint: 'meta = atingir' },
              { v: true, label: 'Menor é melhor', Icon: TrendingDown, hint: 'meta = ficar abaixo' },
            ].map((opt) => {
              const on = !!draft.lowerIsBetter === opt.v;
              const Ico = opt.Icon;
              return (
                <button key={String(opt.v)} onClick={() => set('lowerIsBetter', opt.v)} className="id-nav-item"
                  style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 3, padding: '11px 14px', borderRadius: 12, cursor: 'pointer',
                    background: on ? C.blueSoft : C.panel2, border: `1.5px solid ${on ? C.blue : C.border}`, color: on ? C.blueText : C.grayMid }}>
                  <span style={{ display: 'flex', alignItems: 'center', gap: 7, fontWeight: 700, fontSize: 14 }}><Ico size={16} strokeWidth={2.3} /> {opt.label}</span>
                  <span style={{ fontSize: 11, color: C.grayLight }}>{opt.hint}</span>
                </button>
              );
            })}
          </div>
        </div>

        {/* Valores em % (agrega por média) */}
        <label style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', marginBottom: 6 }}>
          <input type="checkbox" checked={!!draft.percentValue} onChange={(e) => set('percentValue', e.target.checked)} style={{ width: 16, height: 16, accentColor: C.blue }} />
          <span style={{ fontSize: 14, color: C.dim, fontWeight: 500 }}>Valores em porcentagem (%)</span>
        </label>
        <p style={{ fontSize: 12, color: C.grayLight, margin: '0 0 14px 26px' }}>Agrega por média dos meses. O progresso é derivado dos valores mensais ÷ meta trimestral.</p>

        {/* Período personalizado — sem ela o KR roda o trimestre inteiro (padrão);
            ligada, revela os interruptores de mês na seção "Valores mensais"
            acima, para tirar um ou dois meses do escopo do KR. */}
        <label style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', marginBottom: 6 }}>
          <input type="checkbox" checked={!!draft.periodoPersonalizado} onChange={(e) => setPeriodoPersonalizado(e.target.checked)} style={{ width: 16, height: 16, accentColor: C.blue }} />
          <span style={{ fontSize: 14, color: C.dim, fontWeight: 500 }}>Período personalizado</span>
        </label>
        <p style={{ fontSize: 12, color: C.grayLight, margin: '0 0 14px 26px' }}>Marque em qual período o KR estará ativo.</p>

        {/* Meta personalizada por mês — sem ela, o objetivo mensal é sempre a
            meta trimestral ÷ meses de trabalho (igual nos 3 meses). Ligada, cada
            mês ganha um campo de meta próprio logo abaixo do valor lançado. */}
        <label style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', marginBottom: 6 }}>
          <input type="checkbox" checked={!!draft.metaPersonalizada} onChange={(e) => set('metaPersonalizada', e.target.checked)} style={{ width: 16, height: 16, accentColor: C.blue }} />
          <span style={{ fontSize: 14, color: C.dim, fontWeight: 500 }}>Meta personalizada por mês</span>
        </label>
        <p style={{ fontSize: 12, color: C.grayLight, margin: '0 0 8px 26px' }}>Define o valor de meta de cada mês.</p>
        </>}

        {error && <div style={{ color: C.redText, fontSize: 14, marginTop: 14, fontWeight: 600 }}>{error}</div>}

        {/* Ações */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 22, paddingTop: 18, borderTop: `1px solid ${C.border}` }}>
          {mode === 'edit' && okrEdit.canCreate ? (
            confirmDel ? (
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 13, color: C.redText, fontWeight: 600 }}>Excluir?</span>
                <button onClick={del} disabled={saving} className="id-nav-item" style={{ padding: '8px 14px', borderRadius: 10, border: `1px solid ${C.red}`, background: C.redSoft, color: C.redText, fontWeight: 700, cursor: 'pointer' }}>Sim, excluir</button>
                <button onClick={() => setConfirmDel(false)} disabled={saving} className="id-nav-item" style={{ padding: '8px 14px', borderRadius: 10, border: `1px solid ${C.border}`, background: C.panel2, color: C.grayMid, fontWeight: 600, cursor: 'pointer' }}>Cancelar</button>
              </span>
            ) : (
              <button onClick={() => setConfirmDel(true)} disabled={saving} className="id-nav-item" style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px', borderRadius: 10, border: `1px solid ${C.border}`, background: C.panel2, color: C.redText, fontWeight: 600, cursor: 'pointer' }}>
                <Trash2 size={16} /> Excluir
              </button>
            )
          ) : <span />}
          <div style={{ display: 'flex', gap: 10 }}>
            <button onClick={() => !saving && onClose()} disabled={saving} className="id-nav-item" style={{ padding: '10px 18px', borderRadius: 10, border: `1px solid ${C.border}`, background: C.panel2, color: C.grayMid, fontWeight: 600, cursor: 'pointer' }}>Cancelar</button>
            <button onClick={save} disabled={saving} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 22px', borderRadius: 10, border: `1px solid ${C.blue}`, background: C.blue, color: '#fff', fontWeight: 700, cursor: 'pointer', opacity: saving ? 0.7 : 1 }}>
              <Check size={16} /> {saving ? 'Salvando…' : 'Salvar'}
            </button>
          </div>
        </div>
      </div>
    </div>,
    document.body,
  );
}

function SectionPage({ section }) {
  const okrEdit = useOkrEdit();
  const canEditHere = okrEdit.canEdit && okrEdit.editable;
  // "Novo KR" é nível estrutura; editar valores é bem mais amplo.
  const canCreateHere = okrEdit.canCreate && okrEdit.editable;
  const filterCfg = FILTER_CONFIG[section.id] || null;
  // Página sem nenhum KR (páginas fixas do trimestre editável) não mostra a barra
  // de filtro: não há o que filtrar, e o espaço é do convite a cadastrar.
  const hasFilter = !!filterCfg && section.krs.length > 0;

  // Opções do filtro = valores únicos do campo configurado, na ordem de aparição.
  const options = useMemo(() => {
    if (!filterCfg) return [];
    const seen = [];
    section.krs.forEach(k => {
      const v = k[filterCfg.field];
      if (v && !seen.includes(v)) seen.push(v);
    });
    return seen;
  }, [section, filterCfg]);

  // Conjunto vazio = "todos"
  const [selected, setSelected] = useState(() => new Set());

  // Modo foco / Spotlight do KR em análise (índice dentro de visibleKRs).
  const [focusIdx, setFocusIdx] = useState(null);
  const [spotlight, setSpotlight] = useState(false);

  const toggle = (name) => {
    setSelected(prev => {
      const next = new Set(prev);
      next.has(name) ? next.delete(name) : next.add(name);
      return next;
    });
  };
  const showAll = selected.size === 0;

  const visibleKRs = useMemo(() => {
    if (!filterCfg || showAll) return section.krs;
    return section.krs.filter(k => selected.has(k[filterCfg.field]));
  }, [section, filterCfg, selected, showAll]);

  // Mudou o filtro → some o foco (os índices deixam de valer).
  useEffect(() => { setFocusIdx(null); setSpotlight(false); }, [selected]);
  // Mantém o foco dentro do alcance se a lista encolher.
  useEffect(() => {
    if (focusIdx !== null && focusIdx >= visibleKRs.length) { setFocusIdx(null); setSpotlight(false); }
  }, [visibleKRs.length, focusIdx]);

  // Teclado no modo foco: ← → troca de KR · F abre/fecha a tela cheia ·
  // Esc fecha a tela cheia (ou sai do foco).
  useEffect(() => {
    if (focusIdx === null) return;
    const n = visibleKRs.length;
    const onKey = (e) => {
      // Ignora quando o foco está num campo de formulário (ex.: modal de edição
      // aberto) — senão digitar 'f'/'e' dispararia os atalhos do modo foco.
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === 'ArrowRight') { e.preventDefault(); setFocusIdx(i => (i + 1) % n); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); setFocusIdx(i => (i - 1 + n) % n); }
      else if (e.key === 'Escape') { e.preventDefault(); if (spotlight) setSpotlight(false); else setFocusIdx(null); }
      else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); setSpotlight(s => !s); }
      else if ((e.key === 'e' || e.key === 'E') && canEditHere && !spotlight && visibleKRs[focusIdx]) { e.preventDefault(); okrEdit.openEdit(visibleKRs[focusIdx]); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [focusIdx, spotlight, visibleKRs.length, canEditHere, okrEdit, visibleKRs]);

  // Clicar fora de um card de KR (e fora da UI de foco — barra/Spotlight) sai do
  // modo foco. O clique que ENTRA no foco não dispara aqui: o listener só é
  // anexado depois, quando focusIdx deixa de ser null.
  useEffect(() => {
    if (focusIdx === null) return;
    const onDocClick = (e) => {
      const t = e.target;
      if (t && t.closest && (t.closest('.id-card') || t.closest('.id-focus-ui'))) return;
      setFocusIdx(null);
    };
    document.addEventListener('click', onDocClick);
    return () => document.removeEventListener('click', onDocClick);
  }, [focusIdx]);

  const avg = visibleKRs.length ? visibleKRs.reduce((a, k) => a + k.progress, 0) / visibleKRs.length : 0;
  const batidos = visibleKRs.filter(k => k.progress >= 0.7).length;
  const Icon = section.icon;

  return (
    <div className="id-fade-in">
      {/* header */}
      <div className="mb-8">
        <div className="flex items-center gap-2 mb-3">
          <Icon size={18} style={{ color: C.blue }} />
          <span className="text-[13px] uppercase tracking-[0.3em]" style={{ color: C.orangeText, fontWeight: 700 }}>
            Página
          </span>
        </div>
        <div className="flex items-end justify-between flex-wrap gap-6">
          <div>
            <h1 className="text-[56px] tracking-tight mb-2" style={{ color: C.ink, fontWeight: 500, lineHeight: 1 }}>
              {section.name}
            </h1>
            <p className="text-[18px] max-w-2xl" style={{ color: C.grayMid }}>
              {section.blurb}
            </p>
          </div>

          <div className="flex items-center gap-4 flex-wrap">
            {canCreateHere && (
              <button onClick={() => okrEdit.openCreate({ secao: section.secao || section.name })} className="id-nav-item"
                style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '13px 20px', borderRadius: 12, background: C.blue, color: '#fff', border: `1px solid ${C.blue}`, fontWeight: 700, fontSize: 15, cursor: 'pointer', boxShadow: '0 2px 8px rgba(0,114,206,0.25)' }}
                title="Criar um novo KR nesta seção">
                <Plus size={18} strokeWidth={2.5} /> Novo KR
              </button>
            )}
            <div className="flex items-center gap-8 px-8 py-5 rounded-xl" style={{ background: C.panel, border: `1px solid ${C.border}` }}>
              <div>
                <div className="text-[11px] uppercase tracking-widest mb-1" style={{ color: C.gray, fontWeight: 600 }}>{hasFilter && !showAll ? 'Média (filtro)' : 'Média da área'}</div>
                <div className="mono text-[40px] leading-none" style={{ color: statusTextColor(statusOf(avg)), fontWeight: 600 }}>
                  {Math.round(avg * 100)}<span style={{ fontSize: 20 }}>%</span>
                </div>
              </div>
              <div className="w-px h-12" style={{ background: C.border }} />
              <div>
                <div className="text-[11px] uppercase tracking-widest mb-1" style={{ color: C.gray, fontWeight: 600 }}>KRs batidos</div>
                <div className="mono text-[40px] leading-none" style={{ color: C.ink, fontWeight: 500 }}>
                  {batidos}<span style={{ color: C.grayLight, fontSize: 20 }}>/{visibleKRs.length}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Filtro por aba (Revendas/Instagram por nome, Projetos por responsável) */}
      {hasFilter && (
        <div className="mb-8 rounded-xl p-5" style={{ background: C.panel, border: `1px solid ${C.border}` }}>
          <div className="flex items-center gap-2 mb-3">
            <Filter size={16} style={{ color: C.blue }} strokeWidth={2.4} />
            <span className="text-[13px] uppercase tracking-widest" style={{ color: C.grayMid, fontWeight: 700 }}>
              Filtrar por {filterCfg.label}
            </span>
            {!showAll && (
              <span className="text-[13px] ml-1" style={{ color: C.gray }}>
                · {selected.size} de {options.length} selecionado{selected.size > 1 ? 's' : ''}
              </span>
            )}
          </div>
          <div className="flex flex-wrap gap-2.5">
            <button
              onClick={() => setSelected(new Set())}
              className="id-tag rounded-full flex items-center gap-2"
              style={{
                padding: '10px 20px',
                fontSize: 16, fontWeight: 700,
                background: showAll ? C.blue : C.panel2,
                color: showAll ? '#fff' : C.grayMid,
                border: `1.5px solid ${showAll ? C.blue : C.border}`,
              }}
            >
              {showAll && <CheckCircle2 size={18} strokeWidth={2.5} />}
              {filterCfg.all}
            </button>
            {options.map(name => {
              const on = selected.has(name);
              return (
                <button
                  key={name}
                  onClick={() => toggle(name)}
                  className="id-tag rounded-full flex items-center gap-2"
                  style={{
                    padding: '10px 20px',
                    fontSize: 16, fontWeight: 700,
                    background: on ? C.blueSoft : C.panel2,
                    color: on ? C.blueText : C.grayMid,
                    border: `1.5px solid ${on ? C.blue : C.border}`,
                  }}
                >
                  {on && <X size={16} strokeWidth={2.6} style={{ opacity: 0.7 }} />}
                  {name}
                </button>
              );
            })}

          {section.krs.length === 0 ? (
            <>

                {canCreateHere
                  ? 'Esta página ainda não tem KRs. Use "Novo KR" para cadastrar o primeiro.'

              {canCreateHere && (
                <button onClick={() => okrEdit.openCreate({ secao: section.secao || section.name })} className="id-nav-item"

                  title="Criar o primeiro KR desta seção">
                  <Plus size={18} strokeWidth={2.5} /> Novo KR

            <span className="text-[16px]" style={{ color: C.gray }}>{filterCfg ? filterCfg.empty : 'Nenhum item para exibir.'}</span>
          )}
        </div>
      )}

      {/* Modo foco: barra de navegação flutuante (←/→, tela cheia, sair).
          Portada p/ o <body> — assim escapa do `zoom` da área de conteúdo e
          fica sempre no tamanho real da tela (como o Modo Apresentação). */}
      {focusIdx !== null && !spotlight && visibleKRs[focusIdx] && ReactDOM.createPortal(
        <FocusToolbar
          pos={focusIdx + 1}
          total={visibleKRs.length}
          onPrev={() => setFocusIdx((focusIdx - 1 + visibleKRs.length) % visibleKRs.length)}
          onNext={() => setFocusIdx((focusIdx + 1) % visibleKRs.length)}
          onSpotlight={() => setSpotlight(true)}
          onClose={() => setFocusIdx(null)}
          canEdit={canEditHere}
          onEdit={() => okrEdit.openEdit(visibleKRs[focusIdx])}
        />, document.body
      )}

      {/* Spotlight: KR ampliado com fundo desfocado (também portado p/ o body,
          para caber inteiro mesmo com o zoom das informações em "Máximo"). */}
      {focusIdx !== null && spotlight && visibleKRs[focusIdx] && ReactDOM.createPortal(
        <KRSpotlight
          kr={visibleKRs[focusIdx]}
          pos={focusIdx + 1}
          total={visibleKRs.length}
          onPrev={() => setFocusIdx((focusIdx - 1 + visibleKRs.length) % visibleKRs.length)}
          onNext={() => setFocusIdx((focusIdx + 1) % visibleKRs.length)}
          onClose={() => setSpotlight(false)}
        />, document.body
      )}
    </div>
  );
}

/* ============================================================
   MODO APRESENTAÇÃO — abertura da reunião setorial
   ------------------------------------------------------------
   Três momentos em sequência: Destaques · Desafios · Avisos.
   - Destaques/Desafios são slides-título FIXOS (sem conteúdo:
     cada um fala e compartilha na mesa).
   - Avisos é uma sequência de slides EDITÁVEIS pelo gestor, dentro
     do próprio dashboard. São carregados de /api/avisos (Cloudflare
     KV) e persistem entre sessões. Editáveis só por admin/gestor.
   ============================================================ */

// Capas fixas (não editáveis). A capa de "Avisos" abre o bloco editável.
const COVER_SLIDES = [
  { type: 'cover', id: 'destaques', title: 'Destaques', subtitle: 'O que foi bem nesta semana — cada um compartilha um ponto positivo.', icon: Sparkles, accent: C.blue, soft: C.blueSoft },
  { type: 'cover', id: 'desafios', title: 'Desafios', subtitle: 'As dificuldades da semana — o que travou ou pode melhorar.', icon: Flame, accent: C.orange, soft: C.orangeSoft },
];
const AVISOS_COVER = { type: 'cover', id: 'avisos', title: 'Avisos', subtitle: 'Novidades, regulamentos e notícias do setor.', icon: Megaphone, accent: C.blueText, soft: C.blueSoft };

// Monta o deck completo: capas fixas + capa de avisos + avisos dinâmicos.
function buildDeck(avisos) {
  return [
    ...COVER_SLIDES,
    AVISOS_COVER,
    ...(avisos || []).map(a => ({ type: 'aviso', kicker: 'Aviso', ...a })),
  ];
}

// Layout do slide de aviso, derivado do conteúdo (sem o editor escolher).
function avisoLayout(a) {
  if (a.image && (a.title || a.body)) return 'image-text';
  if (a.image) return 'image';
  return 'text';
}

// Reduz a imagem no navegador antes de salvar (base64 leve no KV).
function fileToDownscaledDataURL(file, maxDim = 1280, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Arquivo de imagem inválido.'));
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function newAvisoId() {
  return (crypto.randomUUID ? crypto.randomUUID() : 'a' + Date.now() + Math.random().toString(36).slice(2, 7));

// Tela cheia (Fullscreen API) — usada na apresentação e na área externa.
function useFullscreen() {
  const [isFs, setIsFs] = useState(false);
  useEffect(() => {
    const onFs = () => setIsFs(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange', onFs);
    return () => document.removeEventListener('fullscreenchange', onFs);
  }, []);
  const toggle = useCallback(() => {
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } else if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  }, []);
  return { isFs, toggle };
}

function Presentation({ avisos, canEdit, onPersist, onExit }) {
  const deck = useMemo(() => buildDeck(avisos), [avisos]);
  const total = deck.length;
  const [i, setI] = useState(0);
  const { isFs, toggle: toggleFullscreen } = useFullscreen();
  const [editing, setEditing] = useState(null); // null | { mode:'edit'|'new', draft }
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState('');

  // Mantém o índice válido se a lista encolher (ex.: excluir aviso).
  useEffect(() => { if (i > total - 1) setI(Math.max(0, total - 1)); }, [total, i]);

  const idx = Math.min(i, total - 1);
  const slide = deck[idx];
  const inAvisosArea = idx >= AVISOS_COVER_INDEX;
  const currentAviso = idx >= AVISOS_START ? avisos[idx - AVISOS_START] : null;

  const go = useCallback((d) => setI(prev => Math.min(total - 1, Math.max(0, prev + d))), [total]);

  // --- Edição de avisos ---
  const startEdit = useCallback(() => { if (currentAviso) { setSaveError(''); setEditing({ mode: 'edit', draft: { ...currentAviso } }); } }, [currentAviso]);
  const startNew = useCallback(() => { setSaveError(''); setEditing({ mode: 'new', draft: { id: newAvisoId(), title: '', body: '', image: null } }); }, []);
  const onField = useCallback((k, v) => setEditing(e => ({ ...e, draft: { ...e.draft, [k]: v } })), []);
  const onPickImage = useCallback(async (file) => {
    try { const url = await fileToDownscaledDataURL(file); setEditing(e => ({ ...e, draft: { ...e.draft, image: url } })); }
    catch (err) { setSaveError(err.message || 'Falha ao processar a imagem.'); }
  }, []);
  const onRemoveImage = useCallback(() => setEditing(e => ({ ...e, draft: { ...e.draft, image: null } })), []);

  const persist = useCallback(async (next, gotoId) => {
    setSaving(true); setSaveError('');
    const res = await onPersist(next);
    setSaving(false);
    if (!res || !res.ok) { setSaveError((res && res.error) || 'Não foi possível salvar.'); return; }
    setEditing(null);
    if (gotoId) {
      const newIdx = buildDeck(next).findIndex(s => s.type === 'aviso' && s.id === gotoId);
      if (newIdx >= 0) setI(newIdx);
    }
  }, [onPersist]);

  const saveEdit = useCallback(() => {
    const d = editing.draft;
    if (!d.title && !d.body && !d.image) { setSaveError('Adicione um texto ou uma imagem.'); return; }
    const next = editing.mode === 'new' ? [...avisos, d] : avisos.map(a => a.id === d.id ? d : a);
    persist(next, d.id);
  }, [editing, avisos, persist]);

  const deleteAviso = useCallback(() => {
    if (!editing || editing.mode === 'new') return;
    persist(avisos.filter(a => a.id !== editing.draft.id));
  }, [editing, avisos, persist]);

  // Reordena o aviso em edição (troca com o vizinho) e grava — junto de
  // qualquer alteração pendente de título/texto/imagem. O editor segue aberto
  // no mesmo aviso, agora na nova posição.
  const moveAviso = useCallback(async (dir) => {
    if (!editing || editing.mode !== 'edit') return;
    const d = editing.draft;
    const base = avisos.map(a => a.id === d.id ? d : a);
    const from = base.findIndex(a => a.id === d.id);
    const to = from + dir;
    if (from < 0 || to < 0 || to >= base.length) return;
    const next = base.slice();
    [next[from], next[to]] = [next[to], next[from]];
    setSaving(true); setSaveError('');
    const res = await onPersist(next);
    setSaving(false);
    if (!res || !res.ok) { setSaveError((res && res.error) || 'Não foi possível salvar.'); return; }
    const newIdx = buildDeck(next).findIndex(s => s.type === 'aviso' && s.id === d.id);
    if (newIdx >= 0) setI(newIdx);
  }, [editing, avisos, onPersist]);

  const editIndex = (editing && editing.mode === 'edit') ? avisos.findIndex(a => a.id === editing.draft.id) : -1;

  useEffect(() => {
    const onKey = (e) => {
      if (editing) { if (e.key === 'Escape') { e.preventDefault(); setEditing(null); } return; }
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
      else if (e.key === 'Home') setI(0);
      else if (e.key === 'End') setI(total - 1);
      else if (e.key.toLowerCase() === 'f') toggleFullscreen();
      else if (e.key === 'Escape' && !document.fullscreenElement) onExit();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [editing, go, onExit, total, toggleFullscreen]);

  // Auto-ocultar os controles: somem com o mouse parado; reaparecem ao mover.
  const [showControls, setShowControls] = useState(true);
  const hideTimer = useRef(null);
  const IDLE_MS = 2500;
  const revealControls = useCallback((keepOpen) => {
    setShowControls(true);
    if (hideTimer.current) clearTimeout(hideTimer.current);
    if (!keepOpen) hideTimer.current = setTimeout(() => setShowControls(false), IDLE_MS);
  }, []);
  useEffect(() => {
    revealControls(false);
    return () => { if (hideTimer.current) clearTimeout(hideTimer.current); };
  }, [revealControls]);
  const onMouseMove = useCallback((e) => {
    revealControls(e.clientY > window.innerHeight - 150 || e.clientY < 90);
  }, [revealControls]);

  const navBtn = { width: 48, height: 48, borderRadius: 999, display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.panel, border: `1px solid ${C.border}`, color: C.grayMid, cursor: 'pointer' };
  // Enquanto edita, controles ficam sempre visíveis (mas escondemos a navegação).
  const controlsOn = showControls || !!editing;
  const fade = { transition: 'opacity 0.35s ease', opacity: controlsOn ? 1 : 0, pointerEvents: controlsOn ? 'auto' : 'none' };
  const emptyAvisos = canEdit && avisos.length === 0 && idx === AVISOS_COVER_INDEX;

  return (
    <div className="id-app id-fade-in" onMouseMove={onMouseMove} style={{ position: 'fixed', inset: 0, zIndex: 60, background: C.bg, color: C.ink, display: 'flex', flexDirection: 'column' }}>
      {/* Fundo decorativo sutil */}
      <div className="absolute inset-0 id-grid-bg pointer-events-none" style={{ opacity: 0.35 }} />
      <div className="absolute top-0 left-0 w-full pointer-events-none" style={{ height: 320, background: `radial-gradient(ellipse at top, ${C.blueSoft} 0%, transparent 60%)` }} />

      {/* Barra superior */}
      <div className="relative" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '18px 28px', ...fade }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
          <div style={{ width: 14, height: 14, borderRadius: 4, background: C.blue }} />
          <span style={{ fontSize: 16, fontWeight: 700, letterSpacing: '-0.01em' }}>Intelidata</span>
          <span style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.18em', color: C.gray, fontWeight: 600 }}>Reunião setorial</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <button onClick={toggleFullscreen} title={isFs ? 'Sair da tela cheia (F)' : 'Tela cheia (F)'} className="id-nav-item" style={{ ...navBtn, width: 40, height: 40 }}>
            {isFs ? <Minimize size={18} /> : <Maximize size={18} />}
          </button>
          <button onClick={onExit} title="Encerrar apresentação (Esc)" className="id-nav-item" style={{ ...navBtn, width: 40, height: 40 }}>
            <X size={20} />
          </button>
        </div>
      </div>

      {/* Área do slide (ou editor) */}
      <div key={editing ? 'edit' : idx} className="relative" style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 0, padding: '12px 72px 24px' }}>
        {editing ? (
          <AvisoEditor
            draft={editing.draft} mode={editing.mode} saving={saving} error={saveError}
            onField={onField} onPickImage={onPickImage} onRemoveImage={onRemoveImage}
            onSave={saveEdit} onCancel={() => setEditing(null)} onDelete={deleteAviso}
            onMoveBack={() => moveAviso(-1)} onMoveForward={() => moveAviso(1)}
            canMoveBack={editIndex > 0} canMoveForward={editIndex >= 0 && editIndex < avisos.length - 1}
            posLabel={editIndex >= 0 ? `Posição ${editIndex + 1} de ${avisos.length}` : ''}
          />
        ) : emptyAvisos ? (
          <div className="id-fade-up" style={{ textAlign: 'center', maxWidth: 720, padding: '0 24px' }}>
            <CoverSlide slide={slide} />
            <button onClick={startNew} style={{ marginTop: 8, display: 'inline-flex', alignItems: 'center', gap: 8, padding: '12px 22px', borderRadius: 12, border: `1px solid ${C.blue}`, background: C.blue, color: '#fff', fontWeight: 700, cursor: 'pointer' }}>
              <Plus size={18} /> Adicionar primeiro aviso
            </button>
          </div>
        ) : (
          slide.type === 'cover' ? <CoverSlide slide={slide} /> : <AvisoSlide slide={slide} />
        )}
      </div>

      {/* Controles inferiores — anterior/próximo (+ lápis/＋ para editores) */}
      {!editing && (
        <div className="relative" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 16, padding: '16px 28px 28px', ...fade }}>
          <button onClick={() => go(-1)} disabled={idx === 0} className="id-nav-item" style={{ ...navBtn, opacity: idx === 0 ? 0.35 : 1, cursor: idx === 0 ? 'default' : 'pointer' }} title="Anterior (←)">
            <ChevronLeft size={24} />
          </button>

          {canEdit && inAvisosArea && (
            <>
              <button onClick={startEdit} disabled={!currentAviso} className="id-nav-item" style={{ ...navBtn, opacity: currentAviso ? 1 : 0.35, cursor: currentAviso ? 'pointer' : 'default', color: C.blueText }} title="Editar este aviso">
                <Pencil size={20} />
              </button>
              <button onClick={startNew} className="id-nav-item" style={{ ...navBtn, color: C.blueText }} title="Adicionar aviso">
                <Plus size={22} />
              </button>
            </>
          )}

          <button onClick={() => go(1)} disabled={idx === total - 1} className="id-nav-item" style={{ ...navBtn, opacity: idx === total - 1 ? 0.35 : 1, cursor: idx === total - 1 ? 'default' : 'pointer' }} title="Próximo (→)">
            <ChevronRight size={24} />
          </button>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */

function Dashboard() {
  const [active, setActive] = useState('overview');
  const [collapsed, setCollapsed] = useState(false);
  const [presenting, setPresenting] = useState(false);

  const { isFs, toggle: toggleFullscreen } = useFullscreen();

  // Botão de tela cheia: oculto por padrão, aparece quando o mouse se
  // aproxima do canto superior-direito da área externa.
  const [showFsBtn, setShowFsBtn] = useState(false);
  const onAreaMouseMove = useCallback((e) => {
    setShowFsBtn(e.clientY < 140 && e.clientX > window.innerWidth - 240);
  }, []);

  // Trimestre ativo (DEFAULT_QUARTER). Q1 é estático (planilha); Q2 vem ao vivo
  // do proxy; Q3 vem do D1 e é o editável; Q4 ainda não tem dados.
  const [quarterId, setQuarterId] = useState(DEFAULT_QUARTER);
  const qRuntime = QUARTER_BY_ID[quarterId] || QUARTER_BY_ID[DEFAULT_QUARTER];

  const live = useOkrData();                                   // Q2 ao vivo
  const q1 = useMemo(() => transformar(OKR_Q1, QUARTER_BY_ID.Q1), []); // Q1 estático
  const q3 = useOkrQuarter('Q3');                              // Q3 editável (D1)

  const dataByQ = {
    Q1: { sections: q1.sections, okrGeral: q1.okrGeral, atualizadoEm: q1.atualizadoEm, loading: false, erro: null },
    Q2: { sections: live.sections, okrGeral: live.okrGeral, atualizadoEm: live.atualizadoEm, loading: live.loading, erro: live.erro },
    // Q3 é editável: as páginas do trimestre são fixas (QUARTER_PAGES), então
    // existem no menu mesmo antes do primeiro KR ser cadastrado.
    Q3: { sections: withQuarterPages(q3.sections, 'Q3'), okrGeral: q3.okrGeral, atualizadoEm: q3.atualizadoEm, loading: q3.loading, erro: q3.erro },
    Q4: { sections: [], okrGeral: 0, atualizadoEm: null, loading: false, erro: null },
  };
  const cur = dataByQ[quarterId] || dataByQ[DEFAULT_QUARTER];
  const { sections, okrGeral, atualizadoEm } = cur;

  const changeQuarter = useCallback((id) => { setQuarterId(id); setActive('overview'); }, []);

  // --- Edição de KRs (pendência 3) ---
  // Trimestres cujos KRs vêm do D1 e são editáveis no dashboard (hoje só o Q3).
  const EDITABLE_QUARTERS = { Q3: true };
  const [canEditOkr, setCanEditOkr] = useState(false);
  const [canCreateOkr, setCanCreateOkr] = useState(false);
  const [canEditOkrConfig, setCanEditOkrConfig] = useState(false);
  const [canStartMeeting, setCanStartMeeting] = useState(false);
  const [canExportOkr, setCanExportOkr] = useState(false);
  const [editingKr, setEditingKr] = useState(null); // null | { mode:'new'|'edit', initial }

  const openCreate = useCallback((prefill) => {
    setEditingKr({ mode: 'new', initial: {
      dbId: null, secao: (prefill && prefill.secao) || '', titulo: '', sub: '', owner: '', squad: '',
      unidade: '', target: '', mes1: 0, mes2: 0, mes3: 0, mesesAtivos: [true, true, true],
      lowerIsBetter: false, percentValue: false,
      periodoPersonalizado: false, metaPersonalizada: false, metaMes1: '', metaMes2: '', metaMes3: '',
    } });
  }, []);
  const openEdit = useCallback((kr) => {
    if (!kr) return;
    const janela = activeMonthsOf(kr.activeMonths);
    setEditingKr({ mode: 'edit', initial: {
      dbId: kr.dbId, secao: kr.secao || '', titulo: kr.title || '', sub: kr.sub || '', owner: kr.owner || '',
      squad: kr.squad || '', unidade: kr.unidade || '', target: kr.target ?? '',
      mes1: kr.months[0] ?? 0, mes2: kr.months[1] ?? 0, mes3: kr.months[2] ?? 0,
      mesesAtivos: janela,
      lowerIsBetter: !!kr.lowerIsBetter, percentValue: !!kr.percentValue,
      // Checkbox nasce marcada quando o KR já tem janela/meta customizada
      // (ex.: gravada antes de as checkboxes existirem) — nunca esconde dado já salvo.
      periodoPersonalizado: activeCount(janela) < 3,
      metaPersonalizada: !!kr.metaPersonalizada,
      metaMes1: (kr.metaMeses && kr.metaMeses[0] != null) ? kr.metaMeses[0] : '',
      metaMes2: (kr.metaMeses && kr.metaMeses[1] != null) ? kr.metaMeses[1] : '',
      metaMes3: (kr.metaMeses && kr.metaMeses[2] != null) ? kr.metaMeses[2] : '',
    } });
  }, []);

  // Monta o corpo da API a partir do rascunho + trimestre/ano atuais.
  const draftToBody = useCallback((d) => ({
    quarter: quarterId, ano: OKR_YEAR,
    secao: d.secao, titulo: d.titulo, sub: d.sub, owner: d.owner, squad: d.squad, unidade: d.unidade,
    target: Number(d.target) || 0,
    mes1: Number(d.mes1) || 0, mes2: Number(d.mes2) || 0, mes3: Number(d.mes3) || 0,
    mesesAtivos: activeMonthsOf(d.mesesAtivos),
    lowerIsBetter: !!d.lowerIsBetter, percentValue: !!d.percentValue,
    metaPersonalizada: !!d.metaPersonalizada,
    metaMes1: (d.metaMes1 === '' || d.metaMes1 == null) ? null : Number(d.metaMes1),
    metaMes2: (d.metaMes2 === '' || d.metaMes2 == null) ? null : Number(d.metaMes2),
    metaMes3: (d.metaMes3 === '' || d.metaMes3 == null) ? null : Number(d.metaMes3),
  }), [quarterId]);

  const submitKr = useCallback(async (draft) => {
    try {
      const isNew = !draft.dbId;
      const url = isNew ? '/api/okr/krs' : `/api/okr/krs/${draft.dbId}`;
      const r = await fetch(url, {
        method: isNew ? 'POST' : 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(draftToBody(draft)),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) return { ok: false, error: j.error || ('Erro ' + r.status) };
      await q3.recarregar();
      setEditingKr(null);
      return { ok: true };
    } catch {
      return { ok: false, error: 'Falha de rede ao salvar.' };
    }
  }, [draftToBody, q3]);

  const deleteKr = useCallback(async (draft) => {
    try {
      if (!draft.dbId) return { ok: false, error: 'KR sem identificador.' };
      const r = await fetch(`/api/okr/krs/${draft.dbId}`, { method: 'DELETE' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) return { ok: false, error: j.error || ('Erro ' + r.status) };
      await q3.recarregar();
      setEditingKr(null);
      return { ok: true };
    } catch {
      return { ok: false, error: 'Falha de rede ao excluir.' };
    }
  }, [q3]);

  const okrEditValue = {
    canEdit: canEditOkr,
    canCreate: canCreateOkr,
    canEditConfig: canEditOkrConfig,
    editable: !!EDITABLE_QUARTERS[quarterId],
    quarter: quarterId,
    ano: OKR_YEAR,
    openCreate,
    openEdit,
  };

  // Avisos da reunião (do Worker/KV) + se o usuário atual pode editá-los.
  const [avisos, setAvisos] = useState([]);
  const [canEditAvisos, setCanEditAvisos] = useState(false);

  useEffect(() => {
    let alive = true;
    const opts = { headers: { Accept: 'application/json' } };
    fetch('/api/me', opts).then(r => r.ok ? r.json() : null).then(d => { if (alive && d) { setCanEditAvisos(!!d.canEditAvisos); setCanEditOkr(!!d.canEditOkr); setCanCreateOkr(!!d.canCreateOkr); setCanEditOkrConfig(!!d.canEditOkrConfig); setCanStartMeeting(!!d.canStartMeeting); setCanExportOkr(!!d.isSuper); } }).catch(() => {});
    fetch('/api/avisos', opts).then(r => r.ok ? r.json() : null).then(d => { if (alive && d && Array.isArray(d.avisos)) setAvisos(d.avisos); }).catch(() => {});
    return () => { alive = false; };
  }, []);

  const persistAvisos = useCallback(async (next) => {
    try {
      const r = await fetch('/api/avisos', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ avisos: next }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) return { ok: false, error: d.error || ('Erro ' + r.status) };
      setAvisos(Array.isArray(d.avisos) ? d.avisos : next);
      return { ok: true };
    } catch {
      return { ok: false, error: 'Falha de rede ao salvar.' };
    }
  }, []);

  const activeSection = sections.find(s => s.id === active);
  const noData = !cur.loading && !cur.erro && sections.length === 0;

  // Exportação (só admin/gestor) — um .md com cada KR (atual, meta mensal,
  // meses batidos/falhos, % atual) e o valor geral do OKR do trimestre aberto.
  const exportOkrMarkdown = useCallback(() => {
    const monthLabels = (qRuntime.months || []).map(m => (m || '').toUpperCase());
    const isMonthOver = (active, i) =>
      active[i] && (qRuntime.phase === 'past' || (qRuntime.phase === 'current' && i < qRuntime.currentMonthIndex));

    const linhas = [];
    linhas.push(`# OKR Marketing — ${quarterId} ${qRuntime.year}`);
    linhas.push('');
    linhas.push(`- **Resultado geral do OKR:** ${Math.round(okrGeral * 100)}%`);
    linhas.push(`- **Atualizado em:** ${formatAtualizadoEm(atualizadoEm)}`);
    linhas.push('');

    sections.forEach((sec) => {
      linhas.push(`## ${sec.name}`);
      linhas.push('');
      sec.krs.forEach((kr) => {
        const active = kr.activeMonths || [true, true, true];
        const lancados = kr.months.filter((m, i) => active[i] && m > 0);
        const aggregate = kr.percentValue
          ? (lancados.length ? lancados.reduce((a, b) => a + b, 0) / lancados.length : 0)
          : kr.months.reduce((a, m, i) => a + (active[i] ? m : 0), 0);
        const targetNorm = (kr.percentValue && kr.target != null && kr.target <= 1) ? kr.target * 100 : kr.target;
        const monthlyGoals = monthlyGoalsOf(kr, targetNorm, activeCount(active), active);
        const monthHits = kr.months.map((_, i) => (isMonthOver(active, i) ? monthHitOf(kr.months[i], monthlyGoals[i], kr.lowerIsBetter) : null));
        const batidos = monthHits.filter((h) => h === true).length;
        const falhos = monthHits.filter((h) => h === false).length;
        const metaMensalTexto = monthlyGoalValueText(monthlyGoals, (v) => kr.percentValue ? `${monthlyGoalShown(v)}%` : fmt(monthlyGoalShown(v))) || '—';
        const atualTexto = kr.percentValue ? `${Math.round(aggregate)}%` : fmt(aggregate);
        const metaTrimestreTexto = kr.target != null ? (kr.percentValue ? `${Math.round(targetNorm)}%` : fmt(kr.target)) : '—';
        const mesesDetalhe = monthLabels.map((m, i) => `${m}: ${monthHits[i] === true ? 'batido' : monthHits[i] === false ? 'falhou' : '—'}`).join(' · ');

        linhas.push(`### ${kr.title}${kr.sub ? ' — ' + kr.sub : ''}`);
        linhas.push(`- Owner: ${kr.owner || '—'}${kr.squad ? ` · Squad: ${kr.squad}` : ''}`);
        linhas.push(`- Valor atual: ${atualTexto}${kr.unit ? ` ${kr.unit}` : ''}`);
        linhas.push(`- Meta do trimestre: ${metaTrimestreTexto}`);
        linhas.push(`- Meta mensal: ${metaMensalTexto}`);
        linhas.push(`- % atual: ${Math.round(kr.progress * 100)}%`);
        linhas.push(`- Meses batidos/falhos: ${batidos}/${falhos} (${mesesDetalhe})`);
        linhas.push('');
      });
    });

    const blob = new Blob([linhas.join('\n')], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `okr-${quarterId.toLowerCase()}-${qRuntime.year}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, [sections, okrGeral, atualizadoEm, quarterId, qRuntime]);

  return (
    <QuarterCtx.Provider value={qRuntime}>
    <OkrEditCtx.Provider value={okrEditValue}>
    <div className="id-app" style={{ minHeight: '100vh', background: C.bg, color: C.ink }}>
      <GlobalStyles />
      {presenting && <Presentation avisos={avisos} canEdit={canEditAvisos} onPersist={persistAvisos} onExit={() => setPresenting(false)} />}
      {editingKr && (
        <KREditorModal
          mode={editingKr.mode}
          initial={editingKr.initial}
          monthsLabels={(qRuntime.months || []).map(m => (m || '').toUpperCase())}
          quarterLabel={`${quarterId} · ${qRuntime.year}`}
          onSubmit={submitKr}
          onDelete={deleteKr}
          onClose={() => setEditingKr(null)}
        />
      )}
      <div className="flex h-screen">
        <Sidebar
          active={active}
          onSelect={setActive}
          sections={sections}
          overall={okrGeral}
          atualizadoEm={atualizadoEm}
          collapsed={collapsed}
          onToggle={() => setCollapsed(c => !c)}
          onStartMeeting={() => setPresenting(true)}
          canStartMeeting={canStartMeeting}
          quarterId={quarterId}
          onQuarter={changeQuarter}
          canExport={canExportOkr}
          onExport={exportOkrMarkdown}
        />

        <main className="flex-1 overflow-y-auto relative" onMouseMove={onAreaMouseMove} onMouseLeave={() => setShowFsBtn(false)}>
          {/* Decorative grid bg */}
          <div className="absolute inset-0 id-grid-bg pointer-events-none" style={{ opacity: 0.4 }} />
          <div
            className="absolute top-0 left-0 w-full h-64 pointer-events-none"
            style={{ background: `radial-gradient(ellipse at top, ${C.blueSoft} 0%, transparent 60%)` }}
          />

          {/* Tela cheia da área externa (o dashboard inteiro) */}
          <button
            onClick={toggleFullscreen}
            title={isFs ? 'Sair da tela cheia' : 'Tela cheia'}
            className="id-nav-item flex items-center justify-center rounded-lg"
            style={{ position: 'fixed', top: 20, right: 22, zIndex: 30, width: 40, height: 40, background: C.panel, border: `1px solid ${C.border}`, color: C.gray, boxShadow: '0 2px 10px rgba(20,20,20,0.08)', opacity: showFsBtn ? 1 : 0, pointerEvents: showFsBtn ? 'auto' : 'none', transition: 'opacity 0.3s ease' }}
          >
            {isFs ? <Minimize size={18} /> : <Maximize size={18} />}
          </button>

          <div className="relative px-10 py-10 2xl:px-14" style={{ zoom: CONTENT_ZOOM }}>
            {cur.loading ? (
              <div className="id-fade-in" style={{ minHeight: '60vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <div style={{ textAlign: 'center' }}>
                  <div className="w-4 h-4 rounded-sm mx-auto mb-4" style={{ background: C.blue }} />
                  <div className="text-[15px]" style={{ color: C.gray, fontWeight: 600 }}>Carregando OKRs…</div>
                </div>
              </div>
            ) : cur.erro ? (
              <div className="id-fade-in" style={{ minHeight: '60vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <div className="rounded-xl p-8" style={{ background: C.panel, border: `1px solid ${C.border}`, textAlign: 'center', maxWidth: 440 }}>
                  <AlertCircle size={28} style={{ color: C.redText, margin: '0 auto 12px' }} />
                  <div className="text-[16px] mb-1" style={{ color: C.ink, fontWeight: 700 }}>Não foi possível carregar os dados</div>
                  <div className="text-[13px] mb-5" style={{ color: C.gray }}>{cur.erro}</div>
                  <button onClick={live.recarregar} className="id-tag rounded-full" style={{ padding: '10px 22px', fontSize: 14, fontWeight: 700, background: C.blue, color: '#fff', border: `1.5px solid ${C.blue}` }}>
                    Tentar novamente
                  </button>
                </div>
              </div>
            ) : noData ? (
              <div className="id-fade-in" style={{ minHeight: '60vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <div className="rounded-xl p-10" style={{ background: C.panel, border: `1px dashed ${C.borderStrong}`, textAlign: 'center', maxWidth: 480 }}>
                  <Calendar size={30} style={{ color: C.grayLight, margin: '0 auto 14px' }} />
                  <div className="text-[18px] mb-1" style={{ color: C.ink, fontWeight: 700 }}>{quarterId} · {qRuntime.year}</div>
                  <div className="text-[14px]" style={{ color: C.gray }}>
                    {qRuntime.phase === 'future'
                      ? 'Trimestre ainda não iniciado — sem dados para exibir.'
                      : 'Ainda não há dados cadastrados para este trimestre.'}
                  </div>
                  {canCreateOkr && EDITABLE_QUARTERS[quarterId] && (
                    <button onClick={() => openCreate({ secao: 'Redes Sociais' })}
                      style={{ marginTop: 18, display: 'inline-flex', alignItems: 'center', gap: 8, padding: '12px 22px', borderRadius: 12, border: `1px solid ${C.blue}`, background: C.blue, color: '#fff', fontWeight: 700, cursor: 'pointer', boxShadow: '0 2px 8px rgba(0,114,206,0.25)' }}>
                      <Plus size={18} strokeWidth={2.5} /> Criar primeiro KR
                    </button>
                  )}
                </div>
              </div>
            ) : active === 'overview' ? (
              <OverviewPage sections={sections} overall={okrGeral} />
            ) : activeSection ? (
              <SectionPage key={activeSection.id} section={activeSection} />
            ) : null}

            <div className="mt-16 pt-6 text-[10px] flex items-center justify-between" style={{ borderTop: `1px solid ${C.border}`, color: C.grayLight }}>
              <div style={{ fontWeight: 600 }}>Intelidata · Dashboard de Reunião OKR · {quarterId} · {qRuntime.year}</div>
              <div className="flex items-center gap-2">
                <span className="w-1.5 h-1.5 rounded-full" style={{ background: C.blue }} />
                <span>
                  Atualizado em {formatAtualizadoEm(atualizadoEm)} · {
                    qRuntime.phase === 'current' ? `${qRuntime.daysRemaining} dias para fechar o trimestre`
                    : qRuntime.phase === 'past' ? 'trimestre encerrado'
                    : 'trimestre ainda não iniciado'
                  }
                </span>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    </OkrEditCtx.Provider>
    </QuarterCtx.Provider>
  );
}

/* ====== mount ====== */
ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
</html>
