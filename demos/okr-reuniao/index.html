<html lang="pt-BR">
<head>

<title>Dashboard de Reunião OKR · 2026 (demo)</title>
<meta name="description" content="Dashboard de acompanhamento de OKRs para reuniões semanais — demonstração com dados fictícios.">
<meta name="robots" content="noindex">
<!-- Demo: dados fictícios em memória no lugar do backend (Worker/D1/KV) -->
<script src="mock-api.js"></script>
<!-- React + ReactDOM (UMD, produção) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>

<!-- Babel Standalone: transforma o JSX no navegador (mesmo padrão dos outros dashboards) -->

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
/* ====== globais UMD -> bindings locais (substituem os imports do .jsx) ====== */
const { useState, useMemo, useEffect, useLayoutEffect, useCallback, useRef, createContext, useContext } = React;
const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, Cell, ComposedChart, Area, Line, PieChart, Pie, ReferenceLine } = Recharts;
const { LayoutDashboard, Store, Megaphone, Ticket, FolderKanban, Instagram, TrendingUp, TrendingDown, CheckCircle2, AlertTriangle, Target, Sparkles, Award, Flame, Zap, Calendar, Users, ArrowUpRight, ArrowDownRight, Activity, AlertCircle, PanelLeftClose, PanelLeftOpen, Filter, X, Play, ChevronLeft, ChevronRight, Maximize, Minimize, Pencil, Plus, Trash2, ImagePlus, Check, Type, Download } = LucideReact;

/* ====== Dashboard (gerado a partir de intelidata-okr-dashboard.jsx) ====== */
/* ============================================================
   CAMADA DE DADOS — OKR via JSON publicado (GitHub raw)  [Anexo C]
   ------------------------------------------------------------
   1) define a URL do JSON publicado pelo Power Automate;
   2) transforma o JSON (formato do Office Script) na estrutura
      SECTIONS que o Dashboard já consome;
   3) expõe um hook useOkrData() com loading / erro / atualizadoEm.

   Requisitos do JSON de entrada (gerado pelo Office Script):
     {
       atualizadoEm: ISOString,
       okrGeral: number,
       secoes: [{ nome, krs: [{ owner, squad, titulo, sub,
                                target, progress, meses:[abr,mai,jun] }] }]
     }
   ============================================================ */

// Servido pelo Worker (proxy ao repo privado Dados, atrás de login + RBAC).
const OKR_JSON_URL = '/dados/okr-data.json';

/* ---- Mapa: nome da seção na planilha -> metadados do Dashboard ---- */
const SECTION_META = {
  'Revendas': {
    id: 'revendas', icon: Store,
    blurb: 'Geração de leads, seguidores e visualizações para clientes revendedores.',
  },
  'Funil ADS Intelidata': {
    id: 'ads', icon: Megaphone,
    // Era "Funil ADS Beemore" (no Q2 a seção tinha só o KR da Beemore). A partir
    // do Q3 ela abriga também o SAL da Uniplus, então o nome volta a ser geral.
    name: 'Funil ADS',
    blurb: 'Performance paga e captação de leads pelos funis oficiais da Beemore e da Uniplus.',
    // O funil ADS é, por definição, um KR de leads. Se o texto da KR não casar
    // com a heurística (cair no default "% concluído"), tratamos como leads —
    // assim ele ganha o mesmo gráfico/ritmo diário dos demais KRs de leads.
    unitFallback: 'leads',
  },
  'Tickets Internos': {
    id: 'tickets', icon: Ticket,
    blurb: 'Demandas internas entregues pela squad de marketing.',
  },
  // Seções que aparecem no Q1 (a planilha muda de estrutura entre trimestres).
  'Geração de Leads': {
    id: 'geracao-leads', icon: Megaphone,
    blurb: 'Ações de captação de leads fora do funil das revendas.',
    unitFallback: 'leads',
  },
  'Site': {
    id: 'site', icon: Zap,
    blurb: 'Evolução das entregas dos sites (texto, técnico e visual).',
  },
  'Projetos': {
    id: 'projetos', icon: FolderKanban,
    blurb: 'Iniciativas estratégicas medidas em % de conclusão.',
  },
  'Instagram': {
    id: 'instagram', icon: Instagram,
    blurb: 'Performance orgânica das contas de Instagram gerenciadas.',
  },
  // Seção dos KRs editáveis no próprio dashboard (pendência 3, começa no Q3).
  'Redes Sociais': {
    id: 'redes-sociais', icon: Instagram,
    blurb: 'Resultados de redes sociais acompanhados e editados direto no dashboard.',
  },
};

/* ---- Helpers (camada de dados) ---- */
const slug = (s) =>
  (s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '') // remove acentos
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');

// Deriva a "unit" (usada em rótulos) a partir do subtítulo da KR.
const unitFromSub = (sub, titulo) => {
  const s = (sub || titulo || '').toLowerCase();
  if (s.includes('lead')) return 'leads';
  if (s.includes('seguidor')) return 'seguidores';
  if (s.includes('visualiza')) return 'visualizações';
  if (s.includes('intera')) return 'interações';
  if (s.includes('ticket') || s.includes('entregue')) return 'tickets';
  if (s.includes('retenção') || s.includes('retencao')) return '% retenção';
  return '% concluído'; // projetos e afins
};

const pct = (n) => Math.round((n || 0) * 100);

/* ---- OBJETIVO MENSAL ------------------------------------------------------
   O cadastro guarda só a META TRIMESTRAL (`target`) — o objetivo mensal não é um
   campo, é DERIVADO dela, do mesmo jeito que o negócio informa ("MQL mensal: 20,
   total: 60"). Duas regras, porque as métricas não agregam igual:
     - métrica de FLUXO (leads, seguidores, visualizações): a meta trimestral é a
       SOMA dos meses, então o objetivo mensal é `target ÷ 3`;
     - métrica de TAXA (`percentValue`, ex.: conversão/retenção): a meta trimestral
       é a MÉDIA dos meses, então o objetivo mensal é a PRÓPRIA meta — 20% no
       trimestre quer dizer 20% em cada mês, não 6,7% por mês.
   `normalizedTarget` já vem normalizada p/ a escala 0–100 nas taxas (ver aggTarget
   no KRCard): a planilha guarda retenção como fração (0,5) e os meses como 49/88/99. */
const monthlyGoalOf = (kr, normalizedTarget, monthCount) => {
  if (kr.target == null || !(kr.target > 0)) return null;
  return kr.percentValue ? normalizedTarget : kr.target / (monthCount || 3);
};

/* Arredondamento SÓ PARA EXIBIR: `target ÷ 3` produz dízima (80.000/3 =
   26.666,667). A COMPARAÇÃO continua com o valor exato — arredondar o número
   usado no teste mudaria o veredito de meses na fronteira. */
const monthlyGoalShown = (goal) => (goal >= 100 ? Math.round(goal) : Math.round(goal * 10) / 10);

/* Um mês bateu o objetivo? `null` = não avaliável (sem meta, ou mês sem dado —
   convenção do dashboard: 0/null no slot do mês = ainda não lançado). Respeita
   "quanto menor melhor" (a meta é um TETO). */
const monthHitOf = (value, goal, lowerIsBetter) => {
  if (goal == null || !(value > 0)) return null;
  return lowerIsBetter ? value <= goal : value >= goal;
};

/* ---- META PERSONALIZADA POR MÊS -------------------------------------------
   Por padrão o objetivo mensal é ÚNICO (monthlyGoalOf, derivado da meta
   trimestral) — mesmo valor nos 3 meses. Quando o KR liga `metaPersonalizada`
   (checkbox no editor, migration 0034), cada mês de trabalho pode ter seu
   próprio alvo (`kr.metaMeses`, 3 posições); mês sem valor próprio ainda cai
   no derivado, e mês fora da janela nunca tem meta. */
const monthlyGoalsOf = (kr, normalizedTarget, monthCount, active) => {
  const uniform = monthlyGoalOf(kr, normalizedTarget, monthCount);
  return [0, 1, 2].map((i) => {
    if (!active[i]) return null;
    if (!kr.metaPersonalizada || !kr.metaMeses) return uniform;
    const v = kr.metaMeses[i];
    return (v === null || v === undefined || v === '') ? uniform : Number(v);
  });
};

/* Texto do valor de "meta/mês" pronto p/ exibir: um número só quando as metas
   ATIVAS forem todas iguais (caso comum); senão lista uma por mês, na ordem —
   é o que a meta personalizada por mês pede para não mentir com um único
   número. `null` quando não há meta alguma (KR sem meta trimestral). */
const monthlyGoalValueText = (goals, fmtOne) => {
  const vals = (goals || []).filter((v) => v != null);
  if (!vals.length) return null;
  const uniq = [...new Set(vals.map((v) => Math.round(v * 100) / 100))];
  return uniq.length === 1 ? fmtOne(uniq[0]) : vals.map(fmtOne).join(' · ');
};

// Crescimento percentual entre dois meses (null-safe).
const growthPct = (from, to) => {
  if (from === null || to === null) return null;
  if (from === 0) return to > 0 ? Infinity : 0;
  return Math.round(((to - from) / from) * 100);
};

/* ---- MESES DE TRABALHO DO KR -----------------------------------------------
   Nem todo KR roda os 3 meses do trimestre (projetos costumam começar no 2º mês
   ou viver num único mês). O D1 guarda a janela em `mesesAtivos` (migration
   0028); Q1/Q2 vêm de planilha e não têm o campo -> trimestre inteiro.
   A janela muda três leituras: o objetivo mensal (target ÷ meses DE TRABALHO,
   não ÷ 3), o veredito ✓/✗ (mês fora da janela não é fracasso) e o insight. */
const activeMonthsOf = (raw) => {
  if (Array.isArray(raw) && raw.length === 3) {
    const a = raw.map((v) => !!v);
    return a.some(Boolean) ? a : [true, true, true];
  }
  if (typeof raw === 'string' && /^[01]{3}$/.test(raw) && raw !== '000') {
    return [raw[0] === '1', raw[1] === '1', raw[2] === '1'];
  }
  return [true, true, true];
};
const activeCount = (a) => (a || []).filter(Boolean).length;
// Rótulo da janela ("jul–set", "ago", "jul/set") para a faixa de meta/mês.
const windowLabel = (active, labels) => {
  const on = labels.filter((_, i) => active[i]);
  if (on.length === labels.length) return '';
  if (on.length === 1) return on[0];
  const idx = labels.map((_, i) => i).filter((i) => active[i]);
  const seguido = idx.every((v, k) => k === 0 || v === idx[k - 1] + 1);
  return seguido ? `${on[0]}–${on[on.length - 1]}` : on.join('/');
};

/* ---- Geração automática de insight a partir dos números ----
   O insight é a LEITURA que o número não dá sozinho. Antes o corpo caía quase
   sempre na mesma frase ("faltam N pp para os 70%"), que é justamente o que a
   barra de progresso e o "%" gigante já dizem — repetição em todos os cards.
   Agora o corpo escolhe, entre várias leituras, a que ainda não está na tela:
     - KR que não começou  -> quando começa e qual é o objetivo mensal;
     - meta já batida      -> de quanto foi a folga (e se ainda há mês por vir);
     - janela encerrada    -> em quanto fechou e o que faltou;
     - trimestre em curso  -> quanto falta POR MÊS restante vs. o ritmo atual;
     - métrica de taxa (%) -> qual média os meses restantes precisam ter;
     - "menor é melhor"    -> distância até o teto.
   O headline continua sendo o MOVIMENTO (mês anterior -> mês em foco), que é o
   que muda a cada reunião. Ambos respeitam a janela de meses do KR. */
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const plural = (n, sing, plur) => `${n} ${n === 1 ? sing : plur}`;

/* Rótulo da unidade DENTRO de uma frase. Métricas em % são medidas em pontos
   percentuais; as demais usam a própria unidade ("leads", "seguidores"…). */
const unitWord = (unit) => {
  if (!unit) return '';
  if (unit === '% concluído' || unit === '% retenção') return 'pp';
  return unit;
};

const buildInsight = (ctx) => {
  const meses    = ctx.meses || [null, null, null];
  const progress = ctx.progress ?? 0;          // valor real (pode passar de 1)
  const lower    = !!ctx.lowerIsBetter;        // ex.: retenção — menor é melhor
  const isPct    = !!ctx.percentValue;         // valores exibidos como %
  const labels   = ctx.monthLabels || ['abr', 'mai', 'jun'];  // rótulos do trimestre
  const active   = ctx.activeMonths || [true, true, true];    // janela do KR
  const unit     = unitWord(ctx.unit);
  const phase    = ctx.phase || 'current';
  const cmi      = (ctx.currentMonthIndex == null) ? 2 : ctx.currentMonthIndex;
  // Meta já na escala dos meses (taxas guardam a meta em fração: 0,5 -> 50).
  const target   = (ctx.targetNorm != null && ctx.targetNorm > 0) ? ctx.targetNorm : null;
  const monthlyGoal = ctx.monthlyGoal ?? null;

  /* ---------- situação de cada mês DE TRABALHO ---------- */
  const idx = [0, 1, 2];
  const isClosed = (i) => active[i] && (phase === 'past' || (phase === 'current' && i < cmi));
  const ativos    = idx.filter((i) => active[i]);
  const fechados  = ativos.filter(isClosed);
  const restantes = ativos.filter((i) => !isClosed(i));   // mês corrente + futuros
  const lancados  = ativos.filter((i) => meses[i] > 0);
  const somaDe = (arr) => arr.reduce((a, i) => a + (meses[i] || 0), 0);

  // Agregado: SOMA nos fluxos, MÉDIA dos meses com valor nas taxas — sempre só
  // dentro da janela do KR (o mesmo número que o card mostra em "Atual/Meta").
  const agg = (ctx.aggregate != null) ? ctx.aggregate
    : (isPct
        ? (lancados.length ? somaDe(lancados) / lancados.length : 0)
        : somaDe(ativos));

  const fIdx = (ctx.focusIdx != null) ? ctx.focusIdx : 2;
  const pIdx = (ctx.prevIdx != null) ? ctx.prevIdx : (fIdx - 1);
  const cur  = (fIdx >= 0 && fIdx < meses.length) ? meses[fIdx] : null;
  const prev = (pIdx >= 0 && pIdx < meses.length) ? meses[pIdx] : null;
  const curLabel = cap(labels[fIdx] || '');
  const curTem  = cur !== null && cur !== undefined && cur !== 0;
  const prevTem = prev !== null && prev !== undefined;

  const pReal = Math.round(progress * 100);    // % real (pode ser > 100)

  // Formata um valor na unidade certa (% quando aplicável).
  const f = (n) => (n === null || n === undefined) ? '—' : (isPct ? `${Math.round(n)}%` : fmt(n));
  // Idem, arredondando ANTES: "faltam 1.500/7" viraria "214,2857/mês", que não
  // se lê numa reunião. Acima de 100 vai inteiro; abaixo, uma decimal.
  const fn = (n) => (n === null || n === undefined) ? '—'
    : f(Math.abs(n) >= 100 ? Math.round(n) : Math.round(n * 10) / 10);
  const u = unit ? ` ${unit}` : '';
  // Quantidade absoluta ("300 leads", "50%") e DISTÂNCIA entre dois valores
  // ("20 leads", "10 pp"). Separados porque numa taxa a distância se mede em
  // pontos percentuais: "10% pp de folga" não existe.
  const qty = (n) => isPct ? f(n) : `${f(n)}${u}`;
  const gap = (n) => isPct ? `${fn(n).replace('%', '')} pp` : `${fn(n)}${u}`;

  const naoComecou = lancados.length === 0 && restantes.length > 0;

  /* ---------- tom (status) ----------
     70% é a meta de aprovação do trimestre: a partir daí o KR é uma vitória;
     >= 100% (superou a própria meta cheia) vira destaque. Duas exceções para não
     pintar de vermelho quem ainda não teve como pontuar: KR que não começou fica
     "aguardando", e KR no PRIMEIRO mês (nenhum mês fechado) não passa de
     "no caminho". */
  let tone;
  if (naoComecou)                                          tone = 'espera';
  else if (progress >= 1)                                  tone = 'star';
  else if (progress >= 0.7)                                tone = 'win';
  // Janela encerrada abaixo da meta: não há mais mês para reagir, então não é
  // "no caminho" — é o resultado final.
  else if (restantes.length === 0)                         tone = progress >= 0.5 ? 'warn' : 'critical';
  else if (progress >= 0.6)                                tone = 'near';
  else if (fechados.length === 0)                          tone = 'caminho';
  else if (progress >= 0.5)                                tone = 'caminho';
  else if (progress >= 0.3)                                tone = 'warn';
  else                                                     tone = 'critical';

  /* ---------- headline: movimento {mês anterior} → {mês em foco} ---------- */
  let headline;
  if (lower && curTem && prevTem) {
    // Quanto menor melhor: subir é piorar, cair é melhorar.
    const delta = cur - prev;
    if (delta === 0)      headline = `Estável em ${f(cur)} (${labels[pIdx]} → ${labels[fIdx]})`;
    else if (delta < 0)   headline = `Melhorou: caiu de ${f(prev)} para ${f(cur)}`;
    else                  headline = `Piorou: subiu de ${f(prev)} para ${f(cur)}`;
  } else if (curTem && prevTem) {
    const delta = cur - prev;
    if (delta === 0) {
      headline = `Estável: ${f(cur)} em ${labels[pIdx]} e ${labels[fIdx]}`;
    } else if (prev === 0) {
      headline = `Saiu do zero: ${f(cur)} em ${labels[fIdx]}`;
    } else {
      const sobe = delta > 0;
      // Base pequena => o % engana (1→11 vira "+1000%"); use o absoluto.
      const basePequena = Math.min(Math.abs(prev), Math.abs(cur)) < 10;
      const rel = growthPct(prev, cur);
      headline = (basePequena || rel === Infinity || Math.abs(rel) >= 1000)
        ? `${sobe ? 'Subiu' : 'Caiu'} de ${f(prev)} para ${f(cur)} (${labels[pIdx]} → ${labels[fIdx]})`
        : `${rel > 0 ? '+' : ''}${rel}% de ${labels[pIdx]} para ${labels[fIdx]}`;
    }
  } else if (curTem && !prevTem) {
    headline = `Arrancou em ${labels[fIdx]}: ${f(cur)}`;
  } else if (prevTem && !curTem) {
    headline = `${curLabel} ainda sem dado · ${f(prev)} em ${labels[pIdx]}`;
  } else if (ativos.length && ativos[0] > cmi && phase !== 'past') {
    // A janela do KR ainda não chegou: isto não é atraso, é agenda.
    headline = `Começa em ${cap(labels[ativos[0]])}`;
  } else if (restantes.length === 0) {
    headline = 'Encerrou sem lançamento';
  } else {
    headline = `${curLabel} ainda sem lançamento`;
  }

  /* ---------- body: a leitura que ainda NÃO está na tela ---------- */
  let body;
  const nRest = restantes.length;
  const restLabel = restantes.map((i) => labels[i]).join('/');

  if (lower) {
    // Quanto menor melhor: "atual" = mês mais recente com dado.
    const atual = curTem ? cur : (prevTem ? prev : null);
    if (atual !== null && target != null) {
      body = atual <= target
        ? `Dentro da meta: ${f(atual)} (alvo ≤ ${f(target)})${nRest ? `, com ${plural(nRest, 'mês', 'meses')} por manter` : ''}.`
        : `Acima do alvo de ${f(target)} — precisa cair ${gap(atual - target)}.`;
    } else {
      body = target != null ? `Meta: ficar abaixo de ${f(target)}.` : `${pReal}% da meta.`;
    }
  } else if (target == null) {
    body = lancados.length
      ? `Sem meta trimestral cadastrada: somou ${qty(agg)} em ${plural(lancados.length, 'mês', 'meses')}.`
      : 'Sem meta trimestral cadastrada — o progresso não pode ser derivado.';
  } else if (naoComecou) {
    body = `Ainda sem lançamento: ${qty(target)} para entregar em ${plural(ativos.length, 'mês de trabalho', 'meses de trabalho')}`
      + `${(monthlyGoal != null && ativos.length > 1) ? ` (${fn(monthlyGoal)}/mês)` : ''}.`;
  } else if (agg >= target) {
    const sobra = agg - target;
    body = isPct
      ? `Média de ${f(agg)} contra alvo de ${f(target)}${sobra > 0 ? ` — ${gap(sobra)} de folga` : ' — no alvo'}.`
      : `Meta de ${f(target)}${u} batida com ${f(agg)}`
        + `${sobra > 0 ? ` — ${fn(sobra)} de folga` : ''}`
        + `${nRest ? ` e ainda ${plural(nRest, 'mês', 'meses')} por vir` : ''}.`;
  } else if (nRest === 0) {
    // Janela encerrada: o que importa é o placar final, não o que "falta".
    body = `Fechou em ${Math.round((agg / target) * 100)}% da meta — faltaram ${gap(target - agg)}.`;
  } else if (isPct) {
    // Taxa: para a MÉDIA do trimestre fechar no alvo, os meses restantes têm de
    // compensar os que já fecharam.
    const need = (target * ativos.length - somaDe(fechados)) / nRest;
    body = need > 100
      ? `Média de ${f(agg)} contra alvo de ${f(target)} — o alvo já não é alcançável pela média do trimestre.`
      // `fn` já põe o '%' nas métricas de taxa — repetir dava "90%%".
      : `Média de ${f(agg)} contra alvo de ${f(target)} — precisa de ${fn(need)} em ${restLabel} para fechar no alvo.`;
  } else {
    const falta = target - agg;
    const need = falta / nRest;
    const ritmo = fechados.length ? somaDe(fechados) / fechados.length : null;
    // A comparação com o ritmo já realizado é o que diz se "faltar tanto" é
    // rotina ou virada de jogo.
    const comp = (ritmo && ritmo > 0)
      ? (need <= ritmo
          ? ` — dentro do ritmo já feito (${fn(ritmo)}/mês).`
          : ` — ${Math.round(((need / ritmo) - 1) * 100)}% acima do ritmo já feito (${fn(ritmo)}/mês).`)
      : '.';
    body = nRest === 1
      ? `Faltam ${fn(falta)}${u} para a meta, tudo em ${labels[restantes[0]]}${comp}`
      : `Faltam ${fn(falta)}${u}: ${fn(need)}/mês em ${restLabel}${comp}`;
  }

  return { tone, headline, body };
};

/* Índice do mês em foco (último com dado) e o anterior, para o insight.
   Só considera meses DE TRABALHO: num KR que roda ago–set, o "mês anterior" de
   agosto é nada — e não julho, que está fora da janela.
   Fallback: mês corrente (trimestre em andamento) ou o último da janela. */
function focusIndices(months, qMeta, active) {
  const act = active || [true, true, true];
  const ativos = months.map((_, i) => i).filter((i) => act[i]);
  if (!ativos.length) return { focusIdx: months.length - 1, prevIdx: -1 };

  let last = -1;
  ativos.forEach((i) => {
    const v = months[i];
    if (v !== null && v !== undefined && v !== 0) last = i;
  });

  let focusIdx;
  if (last >= 0) focusIdx = last;
  else if (qMeta && qMeta.phase === 'current') {
    // Mês corrente, se ele for de trabalho; senão o último já iniciado; senão
    // o primeiro que ainda vem (KR que começa mais adiante).
    const jaIniciados = ativos.filter((i) => i <= qMeta.currentMonthIndex);
    focusIdx = jaIniciados.length ? jaIniciados[jaIniciados.length - 1] : ativos[0];
  } else focusIdx = ativos[ativos.length - 1];

  let prevIdx = -1;
  for (let i = focusIdx - 1; i >= 0; i--) if (act[i]) { prevIdx = i; break; }
  return { focusIdx, prevIdx };
}

/* ---- Transformação principal: JSON -> SECTIONS ----
   `qMeta` (opcional) leva os rótulos de mês e a fase do trimestre para o insight
   ficar dinâmico (não cravar maio/junho). Sem ele, cai no default Q2. */
function transformar(data, qMeta) {
  if (!data || !Array.isArray(data.secoes)) return { sections: [], okrGeral: 0, atualizadoEm: null };
  const monthLabels = (qMeta && qMeta.months) || ['abr', 'mai', 'jun'];

  const sections = data.secoes
    .map((sec) => {
      const meta = SECTION_META[sec.nome] || {
        id: slug(sec.nome), icon: FolderKanban, blurb: '',
      };

      const krs = (sec.krs || []).map((kr) => {
        const progress = kr.progress ?? 0;
        // Janela de meses de trabalho do KR (o campo só existe nos KRs do D1).
        const activeMonths = activeMonthsOf(kr.mesesAtivos);
        // Dashboard espera months com 3 posições; null vira 0 para os gráficos.
        // Mês fora da janela entra como 0 mesmo que tenha valor gravado antes de
        // ser desmarcado — o backend zera na leitura, aqui é cinto de segurança.
        const months = (kr.meses || [null, null, null])
          .map((m) => (m === null ? 0 : m))
          .map((m, i) => (activeMonths[i] ? m : 0));
        // Unidade: usa a explícita (KRs editáveis do D1 trazem `unidade`); senão
        // heurística pelo texto da KR e, se não casar, herda a padrão da seção
        // (ex.: Funil ADS → leads).
        const explicitUnit = kr.unidade ? String(kr.unidade).trim() : '';
        let unit = explicitUnit || unitFromSub(kr.sub, kr.titulo);
        if (!explicitUnit && unit === '% concluído' && meta.unitFallback) unit = meta.unitFallback;
        // Taxa de retenção: "quanto menor, melhor". Não é fluxo acumulável —
        // o número exibido em Atual/Meta é a MÉDIA dos meses, não a soma, e
        // tanto Atual quanto Meta são percentuais (valores guardados em fração).
        const isRetention = unit === '% retenção';
        // KRs editáveis carregam flags EXPLÍCITAS (do modal); os demais (Q1/Q2)
        // não as têm e caem na regra da retenção — comportamento inalterado.
        const lowerIsBetter = kr.lowerIsBetter != null ? !!kr.lowerIsBetter : isRetention;
        const percentValue = kr.percentValue != null ? !!kr.percentValue : isRetention;

        // Números que o insight precisa ver com os MESMOS critérios do card.
        const insTarget = (percentValue && kr.target != null && kr.target <= 1) ? kr.target * 100 : (kr.target ?? null);
        const lancadosNaJanela = months.filter((m, i) => activeMonths[i] && m > 0);
        const insAgg = percentValue
          ? (lancadosNaJanela.length ? lancadosNaJanela.reduce((a, b) => a + b, 0) / lancadosNaJanela.length : 0)
          : months.reduce((a, m, i) => a + (activeMonths[i] ? m : 0), 0);

        return {
          id: slug(`${sec.nome}-${kr.titulo}-${kr.sub}`),
          dbId: kr.dbId ?? null,       // id numérico no D1 (só KRs editáveis, ex.: Q3); null nos demais
          secao: sec.nome,             // seção de origem (usada na edição)
          title: kr.titulo || '—',
          sub: kr.sub || '',
          owner: kr.owner || '',
          squad: kr.squad || '',
          target: kr.target ?? null,
          unit,
          unidade: explicitUnit,       // rótulo cru (para preencher o editor)
          months,
          metaPersonalizada: !!kr.metaPersonalizada,  // liga a meta mês a mês (migration 0034)
          metaMeses: kr.metaMeses || null,            // [mes1, mes2, mes3] quando personalizada
          displayMode: percentValue ? 'average' : 'sum',
          percentValue,                // exibe Atual/Meta como %
          lowerIsBetter,               // meta é ficar ABAIXO do alvo
          progress: Math.min(progress, 1),   // barra não passa de 100%
          progressRaw: progress,             // valor real (pode ser >1)
          activeMonths,               // janela de meses de trabalho (ver activeMonthsOf)
          insight: buildInsight({
            meses: months,
            progress,
            lowerIsBetter,
            percentValue,
            unit,
            monthLabels,
            activeMonths,
            phase: qMeta && qMeta.phase,
            currentMonthIndex: qMeta && qMeta.currentMonthIndex,
            // Meta e agregado JÁ normalizados (mesma conta do card): taxas
            // guardam a meta em fração e agregam por média dos meses lançados.
            targetNorm: insTarget,
            aggregate: insAgg,
            monthlyGoal: monthlyGoalOf({ target: kr.target, percentValue }, insTarget, activeCount(activeMonths)),
            ...focusIndices(months, qMeta, activeMonths),
          }),
        };
      });

      // `secao` = nome de ORIGEM (coluna `secao` no D1). Guardado separado de
      // `name` porque o SECTION_META pode renomear a página na exibição (ex.:
      // "Funil ADS Intelidata" -> "Funil ADS") e um KR novo tem que nascer com
      // o nome de origem, senão cai numa seção nova e some da página.
      return { id: meta.id, secao: sec.nome, name: meta.name || sec.nome, icon: meta.icon, blurb: meta.blurb, krs };
    })
    .filter((s) => s.krs.length > 0);

  return {
    sections,
    okrGeral: data.okrGeral ?? 0,
    atualizadoEm: data.atualizadoEm ?? null,
  };
}

/* ---- PÁGINAS FIXAS DO TRIMESTRE ------------------------------------------
   Nos trimestres que vêm de planilha (Q1/Q2) o conjunto de páginas é o que o
   JSON traz — seção sem KR simplesmente não existe. Nos trimestres EDITÁVEIS
   (Q3, do D1) o dashboard é a própria ferramenta de cadastro, então as páginas
   precisam existir ANTES do primeiro KR: é nelas que fica o botão "Novo KR".

   Este registro fixa quais páginas o trimestre tem e em que ORDEM — o backend
   devolve as seções em ordem alfabética, o que não bate com a ordem da planilha.
   Nomes = nome da seção no D1 (coluna `secao`), igual ao usado no SECTION_META. */
const QUARTER_PAGES = {
  // Q3 = as páginas do Q2, com uma diferença: "Redes Sociais" ocupa o lugar do
  // "Instagram" (é a mesma frente, com o nome novo). "Tickets Internos" voltou
  // ao Q3 em 2026-08-10 (KR "Entregues" reintroduzido — ver migration 0018).
  Q3: ['Revendas', 'Funil ADS Intelidata', 'Tickets Internos', 'Projetos', 'Redes Sociais'],
};

/* Aplica o registro acima: devolve as páginas na ordem definida, criando as que
   ainda não têm nenhum KR (`krs: []`), e mantém no fim as seções que existem no
   D1 mas não estão no registro (ex.: "Redes Sociais") — nada desaparece. */
function withQuarterPages(sections, quarterId) {
  const nomes = QUARTER_PAGES[quarterId];
  if (!nomes) return sections;
  // A seção já transformada perde o nome de origem, então casamos pelo id.
  const byId = new Map(sections.map((s) => [s.id, s]));
  const fixas = nomes.map((nome) => {
    const meta = SECTION_META[nome] || { id: slug(nome), icon: FolderKanban, blurb: '' };
    return byId.get(meta.id) || { id: meta.id, secao: nome, name: meta.name || nome, icon: meta.icon, blurb: meta.blurb, krs: [] };
  });
  const idsFixos = new Set(fixas.map((s) => s.id));
  return [...fixas, ...sections.filter((s) => !idsFixos.has(s.id))];
}

   aba Q1) ---- Q1 é um trimestre FECHADO, então os números não mudam; ficam
   embutidos aqui (mesmo formato do okr-data.json) e passam pelo transformar().
   Q2 continua vindo ao vivo do proxy; Q3/Q4 ainda não têm dados. */
const OKR_Q1 = window.DEMO_OKR_Q1;

/* ---- Hook de carregamento ----
   Uso no componente:
     const { sections, okrGeral, atualizadoEm, loading, erro, recarregar } = useOkrData();
*/
function useOkrData() {
  const [state, setState] = useState({
    sections: [], okrGeral: 0, atualizadoEm: null, loading: true, erro: null,
  });

  const recarregar = useCallback(async () => {
    setState((s) => ({ ...s, loading: true, erro: null }));
    try {
      // ?t= evita cache do CDN do GitHub raw
      const res = await fetch(`${OKR_JSON_URL}?t=${Date.now()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const { sections, okrGeral, atualizadoEm } = transformar(json, QUARTER_BY_ID.Q2);
      setState({ sections, okrGeral, atualizadoEm, loading: false, erro: null });
    } catch (e) {
      setState((s) => ({ ...s, loading: false, erro: e.message }));
    }
  }, []);

  useEffect(() => { recarregar(); }, [recarregar]);

  return { ...state, recarregar };
}

/* ---- Hook dos KRs editáveis (pendência 3) ----
   Busca /api/okr/krs?quarter=Qx (D1, via Worker) e passa pelo MESMO transformar()
   do okr-data.json. Usado hoje só pelo Q3; Q1/Q2 seguem em suas fontes. */
function useOkrQuarter(quarter, ano = OKR_YEAR) {
  const [state, setState] = useState({
    sections: [], okrGeral: 0, atualizadoEm: null, loading: true, erro: null,
  });

  const recarregar = useCallback(async () => {
    setState((s) => ({ ...s, loading: true, erro: null }));
    try {
      const res = await fetch(`/api/okr/krs?quarter=${quarter}&ano=${ano}&t=${Date.now()}`, {
        headers: { Accept: 'application/json' },
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const { sections, okrGeral, atualizadoEm } = transformar(json, QUARTER_BY_ID[quarter]);
      setState({ sections, okrGeral, atualizadoEm, loading: false, erro: null });
    } catch (e) {
      setState((s) => ({ ...s, loading: false, erro: e.message }));
    }
  }, [quarter, ano]);

  useEffect(() => { recarregar(); }, [recarregar]);

  return { ...state, recarregar };
}

/* ---- Formata o carimbo de atualização para exibição ---- */
function formatAtualizadoEm(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}

// Normalize a name (strip accents, remove spaces) to AVATARS key
const avatarKey = (name) => {
  if (!name) return null;
  const k = name.trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '');
  return k;
};
const getAvatar = (name) => {
  const key = avatarKey(name);
  return key && AVATARS[key] ? AVATARS[key] : null;
};

// Divide o valor de squad ("A · B") em nomes; junta de volta com " · ".
const splitSquad = (s) => (s || '').split(/[·\n]/).map((x) => x.trim()).filter(Boolean);
const joinSquad = (arr) => (arr || []).join(' · ');
// União preservando ordem (equipe primeiro, depois quaisquer nomes já gravados
// fora da lista — ex.: alguém sem foto — para não perder seleção existente).
const withExtras = (base, extras) => {
  const out = [...base];
  (extras || []).forEach((n) => { if (n && !out.includes(n)) out.push(n); });
  return out;
};

// Compact number formatter for chart labels
const fmtCompact = (n) => {
  if (n === null || n === undefined) return '';
  if (n === 0) return '0';
  const abs = Math.abs(n);
  if (abs >= 1_000_000) return (n / 1_000_000).toFixed(1).replace('.', ',') + 'M';
  if (abs >= 10_000) return Math.round(n / 1000) + ' mil';
  if (abs >= 1000) return (n / 1000).toFixed(1).replace('.', ',') + ' mil';
  return Number.isInteger(n) ? n.toString() : n.toFixed(1).replace('.', ',');
};

/* ============================================================
   TRIMESTRES (Q1–Q4 de 2026)
   ------------------------------------------------------------
   Cada trimestre tem seus meses e um "runtime" derivado de HOJE:
   fase (passado / corrente / futuro), dias decorridos/restantes e o
   índice do mês corrente. Um QuarterContext leva esse runtime aos
   componentes (gráfico, cards, ritmo de leads) — que antes usavam as
   constantes fixas de Q2. Assim o mesmo componente serve qualquer Q.
   ============================================================ */
const MS_DAY = 86_400_000;
const TODAY = new Date();
const OKR_YEAR = 2026;
const QUARTER_DEFS = [
  { id: 'Q1', months: ['jan', 'fev', 'mar'], startMonth: 0 },
  { id: 'Q2', months: ['abr', 'mai', 'jun'], startMonth: 3 },
  { id: 'Q3', months: ['jul', 'ago', 'set'], startMonth: 6 },
  { id: 'Q4', months: ['out', 'nov', 'dez'], startMonth: 9 },
];
function quarterRuntime(def) {
  const start = new Date(OKR_YEAR, def.startMonth, 1);
  const end = new Date(OKR_YEAR, def.startMonth + 3, 0); // último dia do 3º mês
  const totalDays = Math.round((end - start) / MS_DAY) + 1;
  let phase, daysElapsed, daysRemaining, currentMonthIndex;
  if (TODAY > end) {                 // trimestre encerrado
    phase = 'past'; daysElapsed = totalDays; daysRemaining = 0; currentMonthIndex = 2;
  } else if (TODAY < start) {        // ainda não começou
    phase = 'future'; daysElapsed = 0; daysRemaining = totalDays; currentMonthIndex = -1;
  } else {                            // em andamento
    phase = 'current';
    daysElapsed = Math.min(totalDays, Math.max(1, Math.floor((TODAY - start) / MS_DAY) + 1));
    daysRemaining = Math.max(0, totalDays - daysElapsed);
    currentMonthIndex = Math.min(2, Math.max(0, TODAY.getMonth() - def.startMonth));
  }
  return { ...def, year: OKR_YEAR, start, end, totalDays, daysElapsed, daysRemaining, currentMonthIndex, phase };
}
const QUARTERS = QUARTER_DEFS.map(quarterRuntime);

// Último mês de cada trimestre, por extenso — usado no rodapé ("trimestre fecha
// em setembro"), que antes cravava "junho" (fim do Q2) em qualquer trimestre.
const QUARTER_END_MONTH = { Q1: 'março', Q2: 'junho', Q3: 'setembro', Q4: 'dezembro' };

// Trimestre que o dashboard abre por padrão. Fica numa constante só porque o
// default aparece em 4 lugares (estado inicial + 3 fallbacks) e antes estava

// NÃO confundir com o Q2 em useOkrData(): lá é o trimestre DA PLANILHA
// (okr-data.json), não um default, e não muda junto.
const DEFAULT_QUARTER = 'Q3';
const QUARTER_BY_ID = Object.fromEntries(QUARTERS.map(q => [q.id, q]));

// Contexto do trimestre ativo (DEFAULT_QUARTER). useQuarter() dá meses/dias/fase.

   Leva para os componentes internos (SectionPage, FocusToolbar) se o usuário

   o modal de criar/editar. `editable` só é true no(s) trimestre(s) vindos do D1
   (hoje o Q3). */
/* `canEdit`     = pode mexer em ALGO (nível "valores mensais") -> mostra o lápis.
   `canCreate`   = pode criar/excluir KR (nível "estrutura") -> mostra "Novo KR".
   `canEditConfig` = pode editar título/responsável/meta/seção… -> mostra esses
                     campos no modal. Sem ele, o modal fica só com os 3 meses.
   Os três vêm de /api/me e são reforçados no BACKEND (src/okr/krs.js). */
const OkrEditCtx = createContext({
  canEdit: false, canCreate: false, canEditConfig: false,
  editable: false, quarter: null, ano: OKR_YEAR,
  openCreate: () => {}, openEdit: () => {},
});

/* ---------- helpers ---------- */
const fmt = (n) => {
  if (n === null || n === undefined) return '—';
  if (n >= 1000) return n.toLocaleString('pt-BR');
  return Number.isInteger(n) ? n.toString() : n.toFixed(1).replace('.', ',');
};
const growth = (from, to) => {
  if (!from || from === 0) return to > 0 ? Infinity : 0;
  return (to - from) / from;
};
const statusOf = (progress) => {
  // Classifica pelo percentual ARREDONDADO (mesmo número exibido na tela), para
  // o status casar com o "%". Ex.: 0,695 exibe "70%" e agora conta como batido
  // (azul) em vez de ficar amarelo por 0,695 < 0,7.
  const pct = Math.round(progress * 100);
  if (pct >= 70) return 'batido';
  if (pct >= 50) return 'caminho';
  return 'risco';
};
const statusColor = (s) => s === 'batido' ? C.blue : s === 'caminho' ? C.orange : C.red;
const statusTextColor = (s) => s === 'batido' ? C.blueText : s === 'caminho' ? C.orangeText : C.redText;

function StatusPillReal({ progress }) {

  const bg = s === 'batido' ? C.blueSoft : s === 'caminho' ? C.orangeSoft : C.redSoft;
  const color = statusTextColor(s);
  const borderColor = s === 'batido' ? 'rgba(0,114,206,0.2)' : s === 'caminho' ? 'rgba(222,141,19,0.25)' : 'rgba(220,38,38,0.2)';

    <div className="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-[12px] uppercase tracking-wider"
      style={{ background: bg, color, border: `1px solid ${borderColor}` }}>
      <Icon size={13} strokeWidth={2.5} />

function ProgressTrack({ progress, target = 0.7, height = 8, showLabel = true }) {
  const s = statusOf(progress);
  const color = statusColor(s);
  const display = Math.min(progress, 1);
  return (
    <div className="relative w-full" style={{ height }}>
      <div className="absolute inset-0 rounded-full" style={{ background: C.panel3 }} />
      <div
        className="absolute top-0 left-0 h-full rounded-full id-bar"
        style={{
          width: `${display * 100}%`,
          background: `linear-gradient(90deg, ${color}, ${color}d9)`,
        }}
      />
      <div
        className="absolute top-1/2 -translate-y-1/2 w-px"
        style={{
          left: `${target * 100}%`,
          height: height + 8,

  );
}

function MonthlyChart({ months, color, valueSuffix = '', monthlyGoals = null, monthHit = null, activeMonths = null, fmtGoal = null }) {
  const q = useQuarter();
  // Meses fora da janela do KR não são plotados nem julgados (ver activeMonthsOf).
  const active = activeMonths || [true, true, true];
  const MONTHS = q.months;
  const CURRENT_MONTH_INDEX = q.currentMonthIndex;
  // Um mês é "futuro" (sem dado) só se o trimestre ainda não chegou nele:
  // trimestre passado = todos os meses reais; corrente = meses após o atual.
  // MAS: se um mês (mesmo futuro) já tem valor lançado, ele deixa de ser "vazio"
  // e é plotado normalmente — assim editar um valor adiantado preenche o gráfico.
  const hasValue = (i) => months[i] !== null && months[i] !== undefined && months[i] !== 0;
  const isFutureMonth = (i) => (q.phase === 'future' || (q.phase === 'current' && i > CURRENT_MONTH_INDEX)) && !hasValue(i);
  // Só julga (✓/✗) mês que já VIROU — o mês corrente ainda está em andamento
  // (ver mesma lógica/motivo em KRCard).
  const isMonthOver = (i) => q.phase === 'past' || (q.phase === 'current' && i < CURRENT_MONTH_INDEX);
  const data = MONTHS.map((m, i) => {
    const out = !active[i];
    const future = !out && isFutureMonth(i);
    return {
      name: m,
      // Mês fora da janela vira buraco na série (connectNulls=false), do mesmo
      // jeito que um mês futuro — mas sem rótulo e sem veredito.
      value: (out || future) ? null : (months[i] || 0),
      // Objetivo mensal DESTE mês — pode variar mês a mês (meta personalizada
      // por mês); vira degrau na régua tracejada, não mais uma linha reta.
      meta: out ? null : (monthlyGoals ? monthlyGoals[i] : null),
      isFuture: future,
      isOut: out,
      label: (out || future) ? '' : fmtCompact(months[i] || 0) + valueSuffix,
      hit: (out || !isMonthOver(i) || !monthHit) ? null : monthHit(i),
    };
  });
  // A linha do objetivo mensal entra no cálculo do topo: senão, num KR ainda sem
  // resultado (todos os meses em 0) ela cairia fora da área visível do gráfico.
  const max = Math.max(...months, ...(monthlyGoals || []).filter((v) => v != null), 1);
  const goalLabel = fmtGoal
    ? monthlyGoalValueText(monthlyGoals, (v) => fmtGoal(monthlyGoalShown(v)))
    : monthlyGoalValueText(monthlyGoals, (v) => fmtCompact(v) + valueSuffix);

  // O tick do eixo recebe o NOME do mês, não o índice — daí os mapas.
  const hitByMonth = {};
  const outByMonth = {};
  data.forEach((d) => { hitByMonth[d.name] = d.hit; outByMonth[d.name] = d.isOut; });

  // Rótulo numérico acima de cada ponto. Os pontos das pontas (abr / jun) ficam
  // na borda do gráfico: ancoramos o 1º à esquerda e o último à direita para que
  // o número não seja cortado pela margem. O mês corrente sai maior, em negrito e
  // na cor do KR — destaque que troca sozinho conforme o mês.
  const lastIdx = data.length - 1;
  const ValueLabel = ({ x, y, value, index }) => {
    if (value === null || value === undefined) return null;
    const anchor = index === 0 ? 'start' : index === lastIdx ? 'end' : 'middle';
    const isCurrent = q.phase === 'current' && index === CURRENT_MONTH_INDEX;
    // Afasta o rótulo do ponto e dá um halo branco (contorno) — assim o número
    // continua legível mesmo quando a linha passa logo atrás dele.
    return (
      <text
        x={x}
        y={y - (isCurrent ? 24 : 20)}
        fill={isCurrent ? color : C.ink}
        fontSize={isCurrent ? 19 : 15}
        fontFamily="JetBrains Mono"
        fontWeight={isCurrent ? 700 : 600}
        textAnchor={anchor}
        stroke={C.panel}
        strokeWidth={4}
        strokeLinejoin="round"
        paintOrder="stroke"
      >
        {data[index].label}
      </text>
    );
  };

  // Ponto: cheio nos meses reais, oco/tracejado no mês futuro. O mês corrente
  // ganha um halo + ponto sólido maior para se destacar na série.
  const Dot = (props) => {
    const { cx, cy, payload, index } = props;
    if (cx === null || cx === undefined || payload.value === null) return null;
    if (q.phase === 'current' && index === CURRENT_MONTH_INDEX) {
      return (
        <g>
          <circle cx={cx} cy={cy} r={9} fill={color} opacity={0.18} />
          <circle cx={cx} cy={cy} r={5.5} fill={color} stroke={C.panel} strokeWidth={2.5} />
        </g>
      );
    }
    return <circle cx={cx} cy={cy} r={4} fill={C.panel} stroke={color} strokeWidth={2.5} />;
  };

  // Rótulo do eixo X: o mês corrente em negrito + cor do KR — marca "você está
  // aqui" mesmo quando o mês ainda não tem dado.
  const MonthTick = ({ x, y, payload }) => {
    const isOut = outByMonth[payload.value];
    const isCurrent = !isOut && q.phase === 'current' && payload.value === MONTHS[CURRENT_MONTH_INDEX];
    return (
      <text
        x={x}
        y={y}
        dy={12}
        textAnchor="middle"
        opacity={isOut ? 0.45 : 1}
        fill={isCurrent ? color : C.gray}
        fontSize={isCurrent ? 12 : 10}
        fontFamily="Bricolage Grotesque"
        fontWeight={isCurrent ? 700 : 500}
        style={{ textTransform: 'uppercase', letterSpacing: '0.1em' }}
      >
        {payload.value}
        {/* Veredito do mês contra o objetivo mensal: ✓ bateu, ✗ não bateu.
            Vai no TICK, não no rótulo do ponto: o rótulo do ponto é desenhado
            só quando a animação do Recharts termina, e num preview headless
            (rAF throttlado) ele nunca aparece. O tick é imune a isso. */}
        {hitByMonth[payload.value] != null && (
          <tspan
            fill={hitByMonth[payload.value] ? C.blueText : C.redText}
            fontWeight={800}
            style={{ letterSpacing: 0 }}
          >
            {hitByMonth[payload.value] ? ' ✓' : ' ✗'}
          </tspan>
        )}
      </text>
    );
  };

  const gid = `grad-${color.replace('#', '')}`;

  return (
    <div style={{ width: '100%', height: 150, position: 'relative' }}>
      {/* "meta/mês" centralizado no TOPO da área do gráfico — não depende da
          altura da meta (uma régua em degrau não tem uma altura só) nem do
          Recharts, então nunca fica torto quando a meta varia por mês. */}
      {goalLabel && (
        <div
          className="mono"
          style={{
            position: 'absolute', top: 2, left: '50%', transform: 'translateX(-50%)',
            fontSize: 10, fontWeight: 700, color: C.gray, letterSpacing: '0.02em',
            whiteSpace: 'nowrap', pointerEvents: 'none', zIndex: 1,
          }}
        >
          meta/mês {goalLabel}
        </div>
      )}
      <ResponsiveContainer>
        <ComposedChart data={data} margin={{ top: 38, right: 16, left: 16, bottom: 6 }}>
          <defs>
            <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity={0.22} />
              <stop offset="100%" stopColor={color} stopOpacity={0.02} />
            </linearGradient>
          </defs>
          <XAxis
            dataKey="name"
            axisLine={false}
            tickLine={false}
            tick={<MonthTick />}
          />
          <YAxis hide domain={[0, max * 1.52]} />
          {/* Objetivo mensal: régua tracejada em DEGRAU (stepAfter), não mais uma
              linha reta — a meta personalizada por mês pode variar de mês a mês.
              O número (goalLabel) NÃO vai mais aqui: é um overlay HTML centralizado
              no topo da área do gráfico (ver abaixo do ResponsiveContainer),
              pedido do usuário 2026-09-02 p/ legibilidade — um <text> preso à
              régua ficava ancorado na ALTURA da meta, não no topo do card. */}
          {data.some((d) => d.meta != null) && (
            <Line
              type="stepAfter"
              dataKey="meta"
              stroke={C.grayLight}
              strokeDasharray="5 4"
              strokeWidth={1.5}
              dot={false}
              activeDot={false}
              isAnimationActive={false}
              connectNulls={false}
              legendType="none"
            />
          )}
          <Tooltip
            cursor={{ stroke: C.borderStrong, strokeWidth: 1 }}
            contentStyle={{
              background: C.panel,
              border: `1px solid ${C.borderStrong}`,
              borderRadius: 8,
              fontFamily: 'Bricolage Grotesque',
              fontSize: 12,
              color: C.ink,
              boxShadow: '0 4px 12px rgba(0,0,0,0.06)',
            }}
            labelStyle={{ color: C.gray, textTransform: 'uppercase', fontSize: 10, letterSpacing: '0.1em' }}
            formatter={(v) => v === null ? ['—', 'sem dado'] : [`${fmt(v)}${valueSuffix}`, 'valor']}
          />
          <Area
            type="monotone"
            dataKey="value"
            stroke={color}
            strokeWidth={2.5}
            fill={`url(#${gid})`}
            connectNulls={false}
            dot={<Dot />}
            activeDot={{ r: 5, fill: color, stroke: C.panel, strokeWidth: 2 }}
            label={<ValueLabel />}
            isAnimationActive={true}
            animationDuration={700}
          />
        </ComposedChart>
      </ResponsiveContainer>
    </div>
  );
}

/* ---------- Objetivo mensal: veredito ----------
   O gráfico mostra a régua e o ✓/✗ de cada mês; esta faixa fecha a conta em uma
   frase ("bateu 1 de 2 meses"), que é a leitura pedida na reunião. Conta só os
   meses AVALIÁVEIS (com dado lançado) — mês vazio não conta como fracasso. */
function MonthlyGoalVerdict({ goals, fmtGoal, hits, windowText, emAndamento = false }) {
  const goalValue = monthlyGoalValueText(goals, (v) => fmtGoal(monthlyGoalShown(v)));
  if (goalValue == null) return null;
  const avaliados = hits.filter((h) => h !== null).length;
  const batidos = hits.filter((h) => h === true).length;

  // avaliados === 0 tem duas leituras bem diferentes: KR que ainda nem começou
  // (vazio de verdade) vs. mês corrente já com valor lançado, só ainda não
  // julgado (✓/✗ fica p/ o mês fechar — ver isMonthOver). Sem separar os dois,
  // o texto dizia "nenhum mês lançado ainda" com o chip do mês atual mostrando
  // valor > 0 logo acima.
  const tone = avaliados > 0 ? (batidos === avaliados ? 'todos' : batidos === 0 ? 'nenhum' : 'parcial')
    : emAndamento ? 'andamento'
    : 'vazio';
  const fg = { vazio: C.gray, andamento: C.blueText, todos: C.blueText, parcial: C.orangeText, nenhum: C.redText }[tone];
  const bg = { vazio: C.panel2, andamento: C.blueSoft, todos: C.blueSoft, parcial: C.orangeSoft, nenhum: C.redSoft }[tone];
  const Icon = { vazio: Calendar, andamento: Activity, todos: CheckCircle2, parcial: Activity, nenhum: AlertTriangle }[tone];
  const texto = avaliados > 0
    ? `bateu ${batidos} de ${avaliados} ${avaliados === 1 ? 'mês' : 'meses'}`
    : emAndamento ? 'mês atual em andamento'
    : 'nenhum mês lançado ainda';

  return (
    <div
      className="mt-3 rounded-lg px-3 py-2 flex items-center justify-between gap-3"
      style={{ background: bg, border: `1px solid ${C.border}` }}
    >
      <span className="flex items-baseline gap-2 flex-shrink-0">
        <span className="text-[9px] uppercase tracking-widest" style={{ color: C.grayLight, fontWeight: 700 }}>
          Meta/mês
        </span>
        <span className="mono text-[15px]" style={{ color: C.dim, fontWeight: 700 }}>
          {goalValue}
        </span>
        {/* KR que não roda o trimestre inteiro: mostra a janela, senão o
            objetivo mensal parece calculado errado (target ÷ 2, não ÷ 3). */}
        {windowText && (
          <span className="text-[11px]" style={{ color: C.grayLight, fontWeight: 600 }}>
            · {windowText}
          </span>
        )}
      </span>
      <span className="flex items-center gap-1.5 flex-shrink-0" style={{ color: fg }}>
        <Icon size={14} strokeWidth={2.4} />
        <span className="text-[13px]" style={{ fontWeight: 700 }}>{texto}</span>
      </span>
    </div>
  );
}

function Avatar({ name, size = 22, ring = false }) {
  const src = getAvatar(name);
  const initials = (name || '?').split(/\s+/).map(s => s[0]).join('').slice(0, 2).toUpperCase();
  const style = {
    width: size,
    height: size,
    borderRadius: '50%',
    flexShrink: 0,
    border: ring ? `2px solid ${C.panel}` : `1px solid ${C.border}`,
    boxShadow: ring ? '0 1px 2px rgba(0,0,0,0.08)' : 'none',
    objectFit: 'cover',
    display: 'inline-block',
  };
  if (src) {
    return <img src={src} alt={name} title={name} style={style} />;
  }
  // Fallback to initials when no photo
  return (
    <span
      title={name}
      style={{
        ...style,
        background: C.panel3,
        color: C.grayMid,
        fontSize: Math.round(size * 0.38),
        fontWeight: 700,
        display: 'inline-flex',
        alignItems: 'center',
        justifyContent: 'center',
        fontFamily: 'Bricolage Grotesque',
      }}
    >
      {initials}
    </span>
  );
}

function SquadStackOverlap({ squad, owner, size = 20 }) {
  if (!squad || squad.trim() === '-' || squad.trim() === '') {
    return <span style={{ color: C.grayLight }}>—</span>;
  }
  let raw = squad.split(/[·\n]/).map(s => s.trim()).filter(Boolean);
  // "Todos" = a squad inteira: mostra a foto de todos os colaboradores. O owner é excluído — já aparece como Responsável no card.
  if (raw.some(n => n.toLowerCase() === 'todos')) {
    const ownerKey = avatarKey(owner);
    raw = Object.keys(AVATARS).filter(k => k !== ownerKey);
  }
  const knownNames = raw.filter(n => getAvatar(n));
  const labels = raw.filter(n => !getAvatar(n));
  const overlap = Math.round(size * 0.35);

  return (
    <span className="flex items-center gap-1.5 min-w-0">
      {knownNames.length > 0 && (
        <span className="flex items-center flex-shrink-0">
          {knownNames.map((n, i) => (
            <span key={n + i} style={{ marginLeft: i === 0 ? 0 : -overlap }}>
              <Avatar name={n} size={size} ring />
            </span>
          ))}
        </span>
      )}
      {labels.length > 0 && (
        <span style={{ color: C.gray, fontSize: 13, fontWeight: 500 }} className="truncate">
          {labels.join(' · ')}
        </span>
      )}
    </span>
  );
}

/* ---------- Métricas diárias para KRs de Leads ---------- */

/* Dias da JANELA do KR dentro do trimestre: total, decorridos e restantes.
   Com os 3 meses de trabalho ativos o resultado é idêntico ao do trimestre
   inteiro; num KR de um mês só, o ritmo passa a ser medido dentro desse mês —
   senão "leads/dia" divide por dias em que o KR nem existia. */
function monthWindow(q, active) {
  const act = active || [true, true, true];
  if (act.every(Boolean)) {
    return {
      totalDays: q.totalDays,
      daysElapsed: q.daysElapsed,
      daysRemaining: q.daysRemaining,
      ended: q.phase !== 'current' || q.daysRemaining <= 0,
    };
  }
  let total = 0, elapsed = 0;
  for (let i = 0; i < 3; i++) {
    if (!act[i]) continue;
    const ini = new Date(q.year, q.startMonth + i, 1);
    const fim = new Date(q.year, q.startMonth + i + 1, 0);   // último dia do mês
    total += fim.getDate();
    if (TODAY > fim) elapsed += fim.getDate();
    else if (TODAY >= ini) elapsed += TODAY.getDate();
  }
  const daysRemaining = Math.max(0, total - elapsed);
  return { totalDays: total, daysElapsed: Math.max(1, elapsed), daysRemaining, ended: daysRemaining <= 0 };
}

function DailyLeadsStats({ totalSoFar, target, activeMonths }) {
  const q = useQuarter();
  const w = monthWindow(q, activeMonths);
  // "Encerrado" = trimestre passado OU sem dias restantes. Nesse caso NÃO faz
  // sentido projetar "leads/dia p/ bater a meta" (daria divisão por zero =
  // Infinity); mostramos o RESULTADO FINAL (% da meta / quanto faltou).
  const ended = w.ended;
  const elapsed = w.daysElapsed || w.totalDays || 1;
  const dailyAvg = totalSoFar / elapsed;
  const leadsRemaining = Math.max(0, target - totalSoFar);
  const achieved = totalSoFar >= target;
  const dailyNeeded = (!ended && leadsRemaining > 0) ? leadsRemaining / w.daysRemaining : 0;
  const offPace = !ended && !achieved && dailyAvg < dailyNeeded;
  const pctFinal = target > 0 ? Math.round((totalSoFar / target) * 100) : 0;
  const endSt = statusOf(target > 0 ? totalSoFar / target : 0);

  const fmtRate = (n) => {
    if (!isFinite(n) || n === 0) return '0';
    if (n < 1) return n.toFixed(2).replace('.', ',');
    return n.toFixed(1).replace('.', ',');
  };

  const rightBg = achieved ? C.blueSoft
    : ended ? (endSt === 'batido' ? C.blueSoft : endSt === 'caminho' ? C.orangeSoft : C.redSoft)
    : (offPace ? C.orangeSoft : C.panel2);
  const rightBorder = achieved ? 'rgba(0,114,206,0.2)'
    : ended ? (endSt === 'batido' ? 'rgba(0,114,206,0.2)' : endSt === 'caminho' ? 'rgba(222,141,19,0.25)' : 'rgba(220,38,38,0.2)')
    : (offPace ? 'rgba(222,141,19,0.25)' : C.border);
  const rightHead = achieved ? C.blueText : ended ? statusTextColor(endSt) : (offPace ? C.orangeText : C.gray);

  return (
    <div className="mt-3 grid grid-cols-2 gap-2">
      <div className="rounded-lg px-3 py-2.5" style={{ background: C.panel2, border: `1px solid ${C.border}` }}>
        <div className="text-[9px] uppercase tracking-widest mb-1 flex items-center gap-1" style={{ color: C.gray, fontWeight: 700 }}>
          <Activity size={9} strokeWidth={2.5} />
          <span>{ended ? 'Ritmo médio' : 'Ritmo atual'}</span>
        </div>
        <div className="flex items-baseline gap-1">
          <span className="mono text-[16px]" style={{ color: C.ink, fontWeight: 600 }}>
            {fmtRate(dailyAvg)}
          </span>
          <span className="text-[10px]" style={{ color: C.gray }}>leads/dia</span>
        </div>
        <div className="text-[10px] mt-0.5" style={{ color: C.grayLight }}>
          {totalSoFar} em {elapsed} dias
        </div>
      </div>

      <div className="rounded-lg px-3 py-2.5" style={{ background: rightBg, border: `1px solid ${rightBorder}` }}>
        <div className="text-[9px] uppercase tracking-widest mb-1 flex items-center gap-1" style={{ color: rightHead, fontWeight: 700 }}>
          <Target size={9} strokeWidth={2.5} />
          <span>{achieved ? 'Meta atingida' : ended ? 'Resultado final' : 'Para bater a meta'}</span>
        </div>
        {achieved ? (
          <>
            <div className="text-[14px] flex items-center gap-1" style={{ color: C.blueText, fontWeight: 600 }}>
              <CheckCircle2 size={13} strokeWidth={2.5} />
              <span>{totalSoFar - target > 0 ? `+${totalSoFar - target} acima` : 'no alvo'}</span>
            </div>
            <div className="text-[10px] mt-0.5" style={{ color: C.grayLight }}>
              {ended ? 'Trimestre encerrado' : `${w.daysRemaining} dias restantes`}
            </div>
          </>
        ) : ended ? (
          <>
            <div className="flex items-baseline gap-1">
              <span className="mono text-[16px]" style={{ color: statusTextColor(endSt), fontWeight: 600 }}>
                {pctFinal}%
              </span>
              <span className="text-[10px]" style={{ color: C.gray }}>da meta</span>
            </div>
            <div className="text-[10px] mt-0.5" style={{ color: C.grayLight }}>
              Faltaram {leadsRemaining} leads
            </div>
          </>
        ) : (
          <>
            <div className="flex items-baseline gap-1">
              <span className="mono text-[16px]" style={{ color: offPace ? C.orangeText : C.blueText, fontWeight: 600 }}>
                {fmtRate(dailyNeeded)}
              </span>
              <span className="text-[10px]" style={{ color: C.gray }}>leads/dia</span>
            </div>
            <div className="text-[10px] mt-0.5" style={{ color: C.grayLight }}>
              {leadsRemaining} em {w.daysRemaining} dias
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function InsightBadge({ insight }) {
  const palette = {
    // KR cuja janela de meses ainda não chegou: neutro, não vermelho — não é
    // atraso, é agenda (ver tom 'espera' em buildInsight).
    espera:   { bg: C.panel2,     fg: C.gray,       border: C.border,               Icon: Calendar,      label: 'Aguardando' },
    star:     { bg: C.blueSoft,   fg: C.blueText,   border: 'rgba(0,114,206,0.2)',  Icon: Award,         label: 'Destaque' },
    win:      { bg: C.blueSoft,   fg: C.blueText,   border: 'rgba(0,114,206,0.2)',  Icon: TrendingUp,    label: 'Vitória' },
    near:     { bg: C.orangeSoft, fg: C.orangeText, border: 'rgba(222,141,19,0.25)', Icon: Target,       label: 'Quase lá' },
    caminho:  { bg: C.orangeSoft, fg: C.orangeText, border: 'rgba(222,141,19,0.25)', Icon: Activity,     label: 'No caminho' },
    warn:     { bg: C.orangeSoft, fg: C.orangeText, border: 'rgba(222,141,19,0.25)', Icon: AlertTriangle, label: 'Atenção' },
    critical: { bg: C.redSoft,    fg: C.redText,    border: 'rgba(220,38,38,0.2)',   Icon: AlertCircle,   label: 'Em risco' },
  };
  const p = palette[insight.tone] || palette.warn;
  const Icon = p.Icon;
  return (
    <div
      className="rounded-lg p-3.5 mt-3"
      style={{ background: p.bg, border: `1px solid ${p.border}` }}
    >
      <div className="flex items-center gap-2 mb-1 flex-wrap">
        <Icon size={14} style={{ color: p.fg }} strokeWidth={2.4} />
        <span className="text-[11px] uppercase tracking-widest" style={{ color: p.fg, fontWeight: 700 }}>
          {p.label}
        </span>
        <span className="text-[14px]" style={{ color: C.ink, fontWeight: 500, lineHeight: 1.2 }}>
          {insight.headline}
        </span>
      </div>
      <p className="text-[13px] leading-relaxed" style={{ color: C.grayMid, marginLeft: 22 }}>
        {insight.body}
      </p>
    </div>
  );
}

function KRCard({ kr, index, focused = false, dimmed = false, onFocus, variant }) {
  const q = useQuarter();
  const MONTHS = q.months;
  const CURRENT_MONTH_INDEX = q.currentMonthIndex;
  // Meses de trabalho do KR (ver activeMonthsOf): mês fora da janela não recebe
  // valor, não é julgado e não entra na divisão do objetivo mensal.
  const active = kr.activeMonths || [true, true, true];
  const janela = windowLabel(active, MONTHS);
  // Mês futuro (vazio) só conta como tal se ainda não tiver valor lançado.
  const isFutureMonth = (i) => (q.phase === 'future' || (q.phase === 'current' && i > CURRENT_MONTH_INDEX)) && !(kr.months[i] > 0);
  // Só julga (✓/✗) mês que já VIROU — o mês corrente ainda está em andamento,
  // então o ✗ é adiado até o mês fechar (senão desanima ver "não bateu" logo
  // no início do mês, quando o valor ainda mal começou a subir).
  const isMonthOver = (i) => active[i] && (q.phase === 'past' || (q.phase === 'current' && i < CURRENT_MONTH_INDEX));
  const s = statusOf(kr.progress);
  // KR cuja janela ainda não chegou não é "em risco": fica neutro (cinza) até
  // ter mês de trabalho corrido. O veredito é o do insight (tone 'espera').
  const aguardando = !!kr.insight && kr.insight.tone === 'espera';
  const color = aguardando ? C.grayLight : statusColor(s);
  const validMonths = kr.months.filter(m => m > 0);
  const isAvg = kr.displayMode === 'average';
  const aggValue = isAvg
    ? (validMonths.length ? validMonths.reduce((a, b) => a + b, 0) / validMonths.length : 0)
    : kr.months.reduce((a, b) => a + b, 0);
  const aggLabel = isAvg ? 'Média / Meta' : 'Atual / Meta';
  // KRs percentuais (ex.: taxa de retenção): os meses vêm na escala 0–100, mas a
  // meta vem em fração (0,5). Normalizamos a meta p/ 0–100 e exibimos ambos com '%'.
  const aggTarget = (kr.percentValue && kr.target != null && kr.target <= 1) ? kr.target * 100 : kr.target;
  const fmtAgg = (n) => kr.percentValue ? `${Math.round(n)}%` : `${fmt(n)}${valueSuffix}`;
  const valueSuffix = kr.valueSuffix || '';
  // Apenas KRs de "% concluído" (projetos) são progresso-cumulativo-contra-meta,
  // não série de fluxo: a barra de progresso já é a melhor leitura. Os demais
  // (inclusive % de retenção, que é medido mês a mês) mantêm o gráfico de área.
  const isPercent = kr.unit === '% concluído';

  // Objetivo mensal, um por mês de trabalho (ver monthlyGoalsOf): derivado da
  // meta trimestral, ou o valor próprio de cada mês quando o KR liga "meta
  // personalizada por mês". `aggTarget` já está na escala 0–100 nas taxas.
  const monthlyGoals = monthlyGoalsOf(kr, aggTarget, activeCount(active), active);
  const monthHit = (i) => monthHitOf(kr.months[i], monthlyGoals[i], kr.lowerIsBetter);
  // Mês futuro sem dado não é fracasso: fica fora da conta.
  const monthHits = kr.months.map((_, i) => (isMonthOver(i) ? monthHit(i) : null));
  // O mês corrente não entra em `monthHits` (ainda não "virou" — ver isMonthOver
  // acima), mas pode já ter valor lançado (ex.: chip "AGO +35"). Sem isso, o
  // veredito abaixo dizia "nenhum mês lançado ainda" contradizendo o próprio
  // chip do mês atual logo acima.
  const emAndamento = q.phase === 'current' && active[CURRENT_MONTH_INDEX] && kr.months[CURRENT_MONTH_INDEX] > 0;

  // Modo foco: o card em análise cresce e ganha anel (azul da marca); os demais
  // recuam (esmaecem + blur). 'spotlight' = card ampliado no overlay, sem recuo.
  const isSpotlight = variant === 'spotlight';
  const focusStyle = isSpotlight ? {}
    : focused ? { transform: 'scale(1.03)', boxShadow: `0 0 0 2px ${C.blue}, 0 18px 50px rgba(20,20,20,0.16)`, zIndex: 5 }
    : dimmed ? { opacity: 0.32, filter: 'blur(3px) grayscale(0.45)', transform: 'scale(0.985)' }
    : {};

  return (
    <div
      className="id-card id-fade-up rounded-xl p-5 relative overflow-hidden"
      onClick={onFocus}
      style={{
        background: C.panel,
        border: `1px solid ${C.border}`,
        animationDelay: `${index * 60}ms`,
        cursor: (!isSpotlight && onFocus) ? 'pointer' : 'default',
        ...focusStyle,
      }}
    >
      {/* subtle accent */}
      <div
        className="absolute top-0 right-0 w-32 h-32 rounded-full pointer-events-none"
        style={{
          background: `radial-gradient(circle, ${color}14 0%, transparent 70%)`,
          transform: 'translate(40%, -40%)',
        }}
      />

      <div className="flex items-start justify-between mb-2.5 relative">
        <div>
          <h3 className="text-[22px] tracking-tight" style={{ color: C.ink, fontWeight: 600, lineHeight: 1.1 }}>
            {kr.title}
          </h3>
          <p className="text-[14px] mt-0.5" style={{ color: C.grayMid }}>{kr.sub}</p>
        </div>
        <StatusPill progress={kr.progress} waiting={aguardando} />
      </div>

      <div className="flex items-center justify-between gap-3 mb-3 min-w-0 rounded-xl px-3 py-2" style={{ background: C.panel2, border: `1px solid ${C.border}` }}>
        <span className="flex items-center gap-2.5 flex-shrink-0 min-w-0">
          <Avatar name={kr.owner} size={40} ring />
          <span className="min-w-0">
            <span className="block text-[9px] uppercase tracking-widest" style={{ color: C.grayLight, fontWeight: 700 }}>Responsável</span>
            <span className="block text-[15px] truncate" style={{ color: C.dim, fontWeight: 700 }}>{kr.owner}</span>
          </span>
        </span>
        <span className="flex flex-col items-end gap-1 min-w-0">
          <span className="text-[9px] uppercase tracking-widest" style={{ color: C.grayLight, fontWeight: 700 }}>Squad</span>
          <SquadStackOverlap squad={kr.squad} owner={kr.owner} size={34} />
        </span>
      </div>

      <div className="flex items-end justify-between mb-2">
        <div>
          <div className="mono text-[48px] leading-none tracking-tight" style={{ color: C.ink, fontWeight: 500 }}>
            {Math.round(kr.progress * 100)}<span style={{ color, fontSize: 24 }}>%</span>
          </div>
          {kr.progressRaw > 1 && (
            <div className="text-[13px] mt-1.5 flex items-center gap-1" style={{ color: C.blueText }}>
              <Sparkles size={13} />
              <span style={{ fontWeight: 600 }}>{Math.round(kr.progressRaw * 100)}% real</span>
            </div>
          )}
        </div>
        <div className="text-right" style={{ color: C.gray }}>
          <div className="uppercase tracking-widest mb-1" style={{ fontSize: 11, fontWeight: 600 }}>{aggLabel}</div>
          <div className="mono text-[22px] leading-none" style={{ color: C.dim, fontWeight: 600 }}>
            {fmtAgg(aggValue)} <span style={{ color: C.grayDeep, fontWeight: 400 }}>/</span> {fmtAgg(aggTarget)}
          </div>
          <div className="mt-1.5" style={{ color: C.grayLight, fontSize: 13 }}>{kr.unit}</div>
        </div>
      </div>

      <ProgressTrack progress={kr.progress} />

      {isPercent ? (
        <div className="mt-4">
          <span className="text-[9px] uppercase tracking-widest" style={{ color: C.gray, fontWeight: 600 }}>
            Avanço por mês (rumo a 70%)
          </span>
          <div className="mt-4 flex items-start gap-2">
            {MONTHS.map((m, i) => {
              const v = kr.months[i] || 0;
              const out = !active[i];
              if (out) {
                // Mês fora da janela: chip apagado, sem número e sem ✓/✗.
                return (
                  <div key={m} className="flex-1 rounded-lg px-3 py-2 text-center"
                    style={{ background: 'transparent', border: `1px dashed ${C.border}`, opacity: 0.6 }}>
                    <div className="text-[10px] uppercase tracking-widest" style={{ color: C.grayLight, fontWeight: 700 }}>{m}</div>
                    <div className="text-[10px] mt-1.5" style={{ color: C.grayLight }}>fora do escopo</div>
                  </div>
                );
              }
              const future = isFutureMonth(i);
              const isGain = !future && v > 0;
              const isCurrent = q.phase === 'current' && i === CURRENT_MONTH_INDEX;
              return (
                <div
                  key={m}
                  className="flex-1 rounded-lg px-3 py-2 text-center relative"
                  style={{
                    background: isCurrent ? C.blueSoft : (future ? C.panel2 : (isGain ? C.blueSofter : C.panel2)),
                    borderStyle: (future && !isCurrent) ? 'dashed' : 'solid',
                    borderWidth: isCurrent ? 1.5 : 1,
                    borderColor: isCurrent ? C.blue : (future ? C.borderStrong : C.border),
                    boxShadow: isCurrent ? '0 6px 16px rgba(0,114,206,0.14)' : 'none',
                    transform: isCurrent ? 'translateY(-3px)' : 'none',
                    transition: 'transform 0.2s ease, box-shadow 0.2s ease',
                  }}
                >
                  {isCurrent && (
                    <span
                      className="absolute left-1/2 -translate-x-1/2 uppercase rounded-full"
                      style={{ top: -10, background: C.blue, color: '#fff', fontSize: 8, fontWeight: 800, letterSpacing: '0.12em', padding: '2px 8px', whiteSpace: 'nowrap', boxShadow: '0 2px 6px rgba(0,114,206,0.3)' }}
                    >
                      Mês atual
                    </span>
                  )}
                  <div className="text-[10px] uppercase tracking-widest" style={{ color: isCurrent ? C.blueText : C.grayLight, fontWeight: 700 }}>{m}</div>
                  <div className="mono text-[22px] mt-0.5 leading-none" style={{ color: future ? C.grayLight : (isCurrent || isGain ? C.blueText : C.gray), fontWeight: 700 }}>
                    {future ? '·' : (v > 0 ? `+${fmt(v)}` : '0')}
                  </div>
                  {!future && isGain && (
                    <div className="text-[10px] mt-0.5" style={{ color: C.grayLight }}>pp</div>
                  )}
                  {/* Estes KRs não têm gráfico, então o ✓/✗ do objetivo mensal
                      entra no próprio chip do mês. */}
                  {monthHits[i] !== null && (
                    <div className="text-[12px] mt-0.5" style={{ color: monthHits[i] ? C.blueText : C.redText, fontWeight: 800 }}>
                      {monthHits[i] ? '✓' : '✗'}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ) : (
        <div className="mt-4">
          <MonthlyChart
            months={kr.months}
            color={color}
            valueSuffix={valueSuffix}
            monthlyGoals={monthlyGoals}
            monthHit={monthHit}
            activeMonths={active}
            fmtGoal={fmtAgg}
          />
        </div>
      )}

      <MonthlyGoalVerdict goals={monthlyGoals} fmtGoal={fmtAgg} hits={monthHits} windowText={janela} emAndamento={emAndamento} />

      {kr.unit === 'leads' && (
        <DailyLeadsStats totalSoFar={kr.months.reduce((a, b) => a + b, 0)} target={kr.target} activeMonths={active} />
      )}

      <InsightBadge insight={kr.insight} />
    </div>
  );
}

function StatusDonut({ batidos, caminho, risco }) {
  const total = batidos + caminho + risco;
  const slices = [
    { key: 'batido',  label: 'Batidos',    desc: '70%+',        value: batidos, color: C.blue,   text: C.blueText },
    { key: 'caminho', label: 'No caminho', desc: '50–69%',      value: caminho, color: C.orange, text: C.orangeText },
    { key: 'risco',   label: 'Em risco',   desc: 'abaixo 50%',  value: risco,   color: C.red,    text: C.redText },
  ].filter(s => s.value > 0);

  return (
    <div className="flex items-center gap-6 flex-wrap">
      <div style={{ width: 168, height: 168, position: 'relative', flexShrink: 0 }}>
        <ResponsiveContainer>
          <PieChart>
            <Pie
              data={slices}
              dataKey="value"
              nameKey="label"
              cx="50%" cy="50%"
              innerRadius={52} outerRadius={80}
              paddingAngle={3}
              startAngle={90} endAngle={-270}
              stroke="none"
              isAnimationActive={true}
              animationDuration={700}
            >
              {slices.map(s => <Cell key={s.key} fill={s.color} />)}
            </Pie>
            <Tooltip
              wrapperStyle={{ zIndex: 50 }}
              contentStyle={{
                background: C.panel, border: `1px solid ${C.borderStrong}`, borderRadius: 8,
                fontFamily: 'Bricolage Grotesque', fontSize: 12, color: C.ink,
                boxShadow: '0 4px 12px rgba(0,0,0,0.06)',
              }}
              formatter={(v, n) => [`${v} de ${total} KRs`, n]}
            />
          </PieChart>
        </ResponsiveContainer>
        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
          <span className="mono text-[34px] leading-none" style={{ color: C.ink, fontWeight: 600 }}>{total}</span>
          <span className="text-[9px] uppercase tracking-widest mt-1" style={{ color: C.gray, fontWeight: 700 }}>KRs</span>
        </div>
      </div>

      <div className="flex-1 min-w-[140px] space-y-3">

  const batidos = allKRs.filter(k => k.progress >= 0.7);
  const risco = allKRs.filter(k => k.progress < 0.5);
  const caminho = allKRs.filter(k => k.progress >= 0.5 && k.progress < 0.7);

  // Página sem KR (páginas fixas do Q3 recém-criadas) entra com média 0 em vez
  // de NaN — a barra fica vazia e o contador mostra "0 KR".
  const sectionData = sections.map(s => ({
    name: s.name,
    avg: s.krs.length ? s.krs.reduce((a, k) => a + k.progress, 0) / s.krs.length : 0,
    krs: s.krs.length,

  // Destaques derivados dos próprios números (a planilha não traz curadoria):
  //  - metas batidas = progresso real >= 100% da meta;
  //  - prioridades   = os menores progressos do trimestre.
  const monthsToHit = (kr) => {
    if (!kr.target || kr.target <= 0 || !Array.isArray(kr.months)) return null;
    let cum = 0;
    for (let i = 0; i < kr.months.length; i++) {

  const prioridades = allKRs
